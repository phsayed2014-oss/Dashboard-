  --canvas: linear-gradient(135deg,#eff7fd,#dcecf8 45%,#cfe4f4);
  --line:#eceef1;
  --line-soft:#f3f4f6;

  /* ink — slightly darker for clearer text */
  --ink:#333333;
  --ink-2:#48515e;
  --ink-3:#828d9d;

  /* brand accent — teal */
  --accent:#3498db;
  --accent-600:#2980b9;
  --accent-soft:#eaf4fb;
  --accent-ring:rgba(52,152,219,.16);

  /* state tints */
  --blue-bg:#eff4ff;   --blue-fg:#2563eb;
  --amber-bg:#fff6ea;  --amber-fg:#c2790b;
  --rose-bg:#fbece9;   --rose-fg:#c0392b;
  --green-bg:#eaf7ef;  --green-fg:#27ae60;
  --violet-bg:#f4f0ff; --violet-fg:#7c3aed;
  --slate-bg:#f4f5f7;

  /* radii */
  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:22px;

  /* shadow */
  --shadow-card:0 1px 2px rgba(16,24,40,.06), 0 10px 26px -14px rgba(16,24,40,.16);
  --shadow-float:0 1px 3px rgba(16,24,40,.05), 0 24px 60px -30px rgba(16,24,40,.28);
  --shadow-pop:0 12px 40px -12px rgba(16,24,40,.22);

  /* type */
  --font:"IBM Plex Sans Arabic", system-ui, sans-serif;
  --num:"Inter", "IBM Plex Sans Arabic", sans-serif;

  --sidebar-w:252px;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; color:var(--ink);
  /* medical report canvas — image (if set) over a soft gradient */
  background:var(--canvas-image), var(--canvas);
  background-size:cover, cover; background-position:center, center; background-attachment:fixed, fixed;
  font-family:var(--font); font-size:14.5px; font-weight:450; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button{ font-family:inherit; cursor:pointer; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:#dfe3e8; border-radius:99px; border:3px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-thumb:hover{ background:#cfd5dc; background-clip:content-box; }

/* ---------- app shell (Power BI style: chrome solid, content = canvas) ---------- */
.app{
  display:flex; height:100vh; margin:0;
  background:transparent; border:0; border-radius:0; box-shadow:none; overflow:hidden;
}

/* ---------- sidebar (solid chrome) ---------- */
.side{
  width:var(--sidebar-w); flex-shrink:0; display:flex; flex-direction:column;
  background:var(--surface);
  border-inline-start:1px solid var(--line); /* RTL inner edge */
  box-shadow:-1px 0 0 rgba(16,24,40,.04);
}
.brand{
  display:flex; align-items:center; gap:11px; padding:16px 18px;
  border-bottom:1px solid var(--line);
}
.brand-logo{
  width:38px; height:38px; border-radius:11px; flex-shrink:0;
  background:linear-gradient(135deg,#3498db,#5dade2); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px;
  box-shadow:0 4px 10px -3px rgba(52,152,219,.5);
}
.brand-t1{ font-size:15px; font-weight:700; color:var(--ink); line-height:1.2; }
.brand-t2{ font-size:11.5px; color:var(--ink-3); font-weight:500; }

.nav{ flex:1; overflow-y:auto; padding:8px 12px 12px; }
.nav-group{ font-size:11px; font-weight:600; color:var(--ink-3); padding:12px 10px 4px; }
.nav-item{
  display:flex; align-items:center; gap:11px; width:100%;
  padding:9px 11px; margin:1px 0; border:0; background:transparent;
  border-radius:10px; font-size:13.5px; font-weight:500; color:var(--ink-2);
  text-align:start; transition:background .15s, color .15s;
}
.nav-item:hover{ background:var(--slate-bg); color:var(--ink); }
.nav-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
.nav-item .ico{ width:19px; height:19px; flex-shrink:0; display:inline-flex; opacity:.9; }
.nav-item.active .ico{ color:var(--accent); opacity:1; }
.nav-item .ico svg{ width:18px; height:18px; stroke-width:1.7; }
.nav-item .count{
  margin-inline-start:auto; min-width:20px; height:20px; padding:0 6px;
  border-radius:99px; font-size:11px; font-weight:700; background:var(--slate-bg); color:var(--ink-2);
  display:inline-flex; align-items:center; justify-content:center;
}
.nav-item.active .count{ background:#cfe4f5; color:var(--accent); }

/* colored icons for target group (image-inspired) */
.nav-item[data-k="pureherb"] .ico{ color:#7c3aed; }
.nav-item[data-k="nostri"]   .ico{ color:#3498db; }
.nav-item[data-k="expiry"]   .ico{ color:#c0392b; }
.nav-item[data-k="overstock"].ico, .nav-item[data-k="overstock"] .ico{ color:#c2790b; }
.nav-item.active[data-k] .ico{ color:var(--accent); }

.side-user{ padding:12px; border-top:1px solid var(--line); }
.side-user-in{
  display:flex; align-items:center; gap:10px; padding:8px;
  border-radius:12px; background:var(--slate-bg);
}
.avatar{
  width:36px; height:36px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,#3498db,#5dade2); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;
}
.side-user-name{ font-size:13px; font-weight:700; color:var(--ink); }
.side-user-role{ font-size:10.5px; color:var(--ink-3); line-height:1.45; }

/* ---------- main ---------- */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }

.topbar{
  display:flex; align-items:center; gap:14px; padding:12px 22px;
  border-bottom:1px solid var(--line); background:var(--surface);
}
.crumb{ font-size:11px; color:var(--ink-3); font-weight:600; display:flex; align-items:center; gap:5px; }
.crumb .sep{ opacity:.5; }
.page-title{ font-size:18px; font-weight:700; color:var(--ink); line-height:1.15; margin:1px 0 0; }
.topbar-search{
  flex:1; max-width:320px; margin-inline:auto; position:relative;
}
.topbar-search input{
  width:100%; height:40px; padding:0 40px 0 14px; border:1px solid var(--line);
  border-radius:10px; background:#f7f8fa; font-family:var(--font); font-size:13px; color:var(--ink);
}
.topbar-search input:focus{ outline:0; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px var(--accent-ring); }
.topbar-search .s-ico{ position:absolute; inset-inline-end:12px; top:50%; transform:translateY(-50%); opacity:.45; }
.topbar-actions{ display:flex; align-items:center; gap:8px; }
.icon-btn{
  width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:#fff;
  color:var(--ink-2); display:inline-flex; align-items:center; justify-content:center;
}
.icon-btn:hover{ background:var(--slate-bg); color:var(--ink); }
.btn{
  display:inline-flex; align-items:center; gap:7px; height:38px; padding:0 15px;
  border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink-2);
  font-size:13px; font-weight:600; transition:background .15s, border-color .15s;
}
.btn:hover{ background:var(--slate-bg); color:var(--ink); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover{ background:var(--accent-600); }

/* content scroll region */
.content{ flex:1; overflow-y:auto; background:transparent; }
.content-in{ max-width:1180px; margin:0 auto; padding:24px; }

/* panels */
.panel{ display:none; animation:rise .4s cubic-bezier(.16,1,.3,1); }
.panel.active{ display:block; }
@keyframes rise{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }

.formats{ display:flex; gap:8px; justify-content:center; margin-top:18px; }
.fmt{ font-size:11.5px; font-weight:600; color:var(--ink-2); background:var(--slate-bg); border-radius:99px; padding:4px 12px; }

/* ---------- collaboration selector bar ---------- */
.collab-bar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow-card); padding:12px 14px; margin-bottom:18px;
}
.collab-label{ font-size:12.5px; font-weight:600; color:var(--ink-3); }
.collab-select{ position:relative; }
.collab-trigger{
  display:inline-flex; align-items:center; gap:9px; height:40px; padding:0 12px;
  border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);
  font-size:14px; font-weight:700; min-width:190px;
}
.collab-trigger:hover{ background:var(--slate-bg); }
.collab-trigger[aria-expanded="true"]{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-ring); }
.collab-dot{ width:9px; height:9px; border-radius:50%; background:var(--ink-3); flex-shrink:0; }
.collab-dot.on{ background:var(--green-fg); box-shadow:0 0 0 3px rgba(15,157,88,.15); }
.collab-chev{ margin-inline-start:auto; opacity:.6; }
.collab-menu{
  position:absolute; inset-block-start:calc(100% + 6px); inset-inline-start:0; z-index:30;
  min-width:240px; background:#fff; border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow-pop); padding:6px; display:none;
}
.collab-menu.open{ display:block; }
.collab-opt{
  display:flex; align-items:center; gap:10px; width:100%; padding:10px 10px;
  border:0; background:transparent; border-radius:9px; font-size:13.5px; font-weight:600; color:var(--ink-2); text-align:start;
}
.collab-opt:hover{ background:var(--slate-bg); color:var(--ink); }
.collab-opt.active{ background:var(--accent-soft); color:var(--accent); }
.collab-opt .co-dot{ width:8px; height:8px; border-radius:50%; background:var(--ink-3); flex-shrink:0; }
.collab-opt .co-dot.on{ background:var(--green-fg); }
.collab-opt .co-meta{ margin-inline-start:auto; font-size:11px; font-weight:600; color:var(--ink-3); }
.collab-opt .co-meta.on{ color:var(--green-fg); }
.collab-sep{ height:1px; background:var(--line); margin:6px 8px; }
.collab-opt.collab-all{ font-weight:800; color:var(--accent); }
.collab-opt.collab-all .co-dot{ background:var(--accent); }
.collab-opt.disabled{ opacity:.45; pointer-events:none; }
.collab-actions{ display:flex; gap:8px; margin-inline-start:auto; }

/* selected-branch empty prompt */
.branch-empty{ max-width:560px; margin:5vh auto; text-align:center; }
.branch-empty .empty-badge{
  width:60px; height:60px; border-radius:16px; margin:0 auto 16px;
  background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center;
}
.branch-empty h3{ font-size:19px; font-weight:700; margin:0 0 6px; }
.branch-empty p{ color:var(--ink-2); margin:0 0 20px; font-size:13.5px; }

/* period chips (comparison) */
.periods{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px; }
.period-chip{
  display:inline-flex; align-items:center; gap:8px; padding:7px 12px;
  border:1px solid var(--line); border-radius:99px; background:#fff; font-size:12px;
}
.period-chip .pc-ico{ color:var(--accent); flex-shrink:0; display:inline-flex; }
.period-chip .pc-name{ font-weight:600; color:var(--ink); }
.period-chip .pc-x{ width:20px; height:20px; border-radius:6px; border:0; background:var(--slate-bg); color:var(--ink-3); display:flex; align-items:center; justify-content:center; }
.period-chip .pc-x:hover{ background:var(--rose-bg); color:var(--rose-fg); }

.dropzone{
  border:1.5px dashed #cfd6dd; border-radius:var(--r-lg); background:#fbfcfd;
  padding:34px 24px; transition:border-color .2s, background .2s;
}
.dropzone.drag{ border-color:var(--accent); background:var(--accent-soft); }
.dropzone .dz-title{ font-weight:600; color:var(--ink); margin-bottom:4px; }
.dropzone .dz-sub{ font-size:12.5px; color:var(--ink-3); margin-bottom:16px; }

@media(max-width:820px){ .collab-actions{ margin-inline-start:0; width:100%; } }

/* ---------- loaded branch summary (Part 2b) ---------- */
.loaded-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.loaded-title{ font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
.ok-dot{ width:9px; height:9px; border-radius:50%; background:var(--green-fg); box-shadow:0 0 0 3px rgba(15,157,88,.15); }
.loaded-head .periods{ margin:0; justify-content:flex-start; }

.kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:13px; margin-bottom:16px; }
.kpi{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-card); padding:16px; }
.kpi-label{ font-size:12px; font-weight:600; color:var(--ink-3); margin-bottom:6px; }
.kpi-num{ font-family:var(--num); font-size:28px; font-weight:800; letter-spacing:-1px; color:var(--ink); }
.note{ font-size:12.5px; color:var(--ink-3); background:var(--slate-bg); border-radius:var(--r); padding:12px 14px; }

.empty-badge.spin svg{ animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- Part 3: overview analytics ---------- */
.kpi{ position:relative; }
.kpi-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
.kpi-ico{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent); }
.kpi-ico svg{ width:17px; height:17px; }
.kpi-k1 .kpi-ico{ background:var(--accent-soft); color:var(--accent); }
.kpi-k2 .kpi-ico{ background:var(--green-bg); color:var(--green-fg); }
.kpi-k3 .kpi-ico{ background:var(--amber-bg); color:var(--amber-fg); }
.kpi-k4 .kpi-ico{ background:#eaf6ff; color:#0284c7; }
.kpi-k5 .kpi-ico{ background:var(--violet-bg); color:var(--violet-fg); }
.kpi-k6 .kpi-ico{ background:var(--rose-bg); color:var(--rose-fg); }
.kpi-foot{ font-size:11.5px; color:var(--ink-3); margin-top:3px; }

.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-card); padding:18px; margin-bottom:16px; }
.card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
.card-title{ font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
.card-title .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); }

/* segmented status bar */
.seg{ display:flex; height:14px; border-radius:99px; overflow:hidden; gap:2px; background:var(--line-soft); }
.seg > span{ display:block; height:100%; }
.seg-legend{ display:flex; gap:18px; flex-wrap:wrap; margin-top:12px; }
.seg-legend > span{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-2); font-weight:600; }
.seg-legend i{ width:9px; height:9px; border-radius:3px; }
.seg-legend b{ font-family:var(--num); font-weight:800; color:var(--ink); }

/* status layout: tiles + gauge */
.status-grid{ display:grid; grid-template-columns:1fr auto; gap:22px; align-items:center; margin-top:16px; }
.status-tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.tile{ border-radius:var(--r); padding:14px; text-align:center; border:1px solid transparent; }
.tile .t-label{ font-size:11.5px; font-weight:700; margin-bottom:4px; }
.tile .t-num{ font-family:var(--num); font-size:22px; font-weight:800; }
.tile.green{ background:var(--green-bg); border-color:#cfeadd; } .tile.green .t-label,.tile.green .t-num{ color:var(--green-fg); }
.tile.blue{ background:var(--blue-bg); border-color:#d8e6ff; } .tile.blue .t-label,.tile.blue .t-num{ color:var(--blue-fg); }
.tile.rose{ background:var(--rose-bg); border-color:#f2d6d1; } .tile.rose .t-label,.tile.rose .t-num{ color:var(--rose-fg); }

.gauge{ width:130px; height:130px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0; }
.gauge::after{ content:""; position:absolute; inset:14px; background:var(--surface); border-radius:50%; }
.gauge-in{ position:relative; z-index:1; text-align:center; }
.gauge-pct{ font-family:var(--num); font-size:26px; font-weight:800; color:var(--ink); line-height:1; }
.gauge-lbl{ font-size:10.5px; color:var(--ink-3); margin-top:3px; }

/* charts */
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.chart-box{ position:relative; height:280px; }
@media(max-width:820px){ .grid-2{ grid-template-columns:1fr; } .status-grid{ grid-template-columns:1fr; } .gauge{ margin:0 auto; } }

/* ---------- Part 4: analysis tables ---------- */
.tbl-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-card); overflow:hidden; }
.tbl-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:16px 18px; border-bottom:1px solid var(--line); }
.tbl-title{ font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
.tbl-title .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); }
.search-in{ position:relative; }
.search-in input{ height:38px; width:260px; max-width:52vw; padding:0 36px 0 12px; border:1px solid var(--line); border-radius:9px; background:#f7f8fa; font-family:var(--font); font-size:13px; color:var(--ink); }
.search-in input:focus{ outline:0; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px var(--accent-ring); }
.search-in .si-ico{ position:absolute; inset-inline-end:11px; top:50%; transform:translateY(-50%); opacity:.45; }
.tbl-scroll{ max-height:66vh; overflow-y:auto; }
table.data{ width:100%; border-collapse:collapse; font-size:13.5px; }
table.data thead th{ position:sticky; top:0; z-index:1; background:#fafbfc; color:var(--ink-3); font-size:11.5px; font-weight:600; text-align:start; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer; user-select:none; }
table.data thead th .arr{ opacity:.4; font-size:10px; }
table.data thead th.sorted .arr{ opacity:1; color:var(--accent); }
table.data tbody td{ padding:11px 14px; border-bottom:1px solid var(--line-soft); color:var(--ink); }
table.data tbody tr:last-child td{ border-bottom:0; }
table.data tbody tr{ transition:background .12s; cursor:pointer; }
table.data tbody tr:hover{ background:var(--accent-soft); }
.num{ font-family:var(--num); font-weight:700; font-variant-numeric:tabular-nums; }
.rank{ width:26px; height:26px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; font-family:var(--num); font-weight:800; font-size:12px; background:var(--slate-bg); color:var(--ink-2); }
.rank.g1{ background:#fff4d6; color:#b7791f; } .rank.g2{ background:#eef1f5; color:#5b6472; } .rank.g3{ background:#fbe7d6; color:#b45c25; }
.bar-cell{ display:flex; align-items:center; gap:8px; }
.bar-cell .bar{ height:6px; border-radius:99px; background:linear-gradient(90deg,#3498db,#5dade2); min-width:2px; }
.bar-cell .bv{ font-size:12px; color:var(--ink-2); font-family:var(--num); }
.tag{ display:inline-flex; align-items:center; padding:3px 10px; border-radius:99px; font-size:11.5px; font-weight:600; background:var(--slate-bg); color:var(--ink-2); }
.tag.teal{ background:var(--accent-soft); color:var(--accent); }
.tag.green{ background:var(--green-bg); color:var(--green-fg); }
.tag.amber{ background:var(--amber-bg); color:var(--amber-fg); }
.tag.rose{ background:var(--rose-bg); color:var(--rose-fg); }
.tag.blue{ background:var(--blue-bg); color:var(--blue-fg); }
.tbl-empty{ padding:9vh 24px; text-align:center; color:var(--ink-3); }

/* ---------- share card modal ---------- */
#shareModal{ position:fixed; inset:0; z-index:1100; display:none; align-items:center; justify-content:center; padding:24px; }
#shareModal.open{ display:flex; }
#shareModal .sm-scrim{ position:absolute; inset:0; background:rgba(16,24,40,.42); backdrop-filter:blur(2px); }
#shareModal .sm-box{ position:relative; z-index:1; background:#fff; border-radius:18px; box-shadow:var(--shadow-pop); padding:16px; max-width:340px; width:100%; animation:rise .3s cubic-bezier(.16,1,.3,1); }
#shareModal .sm-box img, #shareModal .sm-box canvas{ width:100%; height:auto; border-radius:12px; display:block; border:1px solid var(--line); }
#shareModal .sm-actions{ display:flex; gap:8px; margin-top:12px; }
#shareModal .sm-actions .btn{ flex:1; justify-content:center; }
#shareModal .sm-close{ position:absolute; top:-12px; inset-inline-start:-12px; width:32px; height:32px; border-radius:50%; border:0; background:#fff; box-shadow:var(--shadow-card); color:var(--ink-2); font-size:15px; }

/* ---------- slide-over detail drawer ---------- */
#drawer{ position:fixed; inset:0; z-index:1000; display:none; }
#drawer.open{ display:block; }
.drawer-scrim{ position:absolute; inset:0; background:rgba(16,24,40,.30); opacity:0; transition:opacity .38s ease; backdrop-filter:blur(0px); }
#drawer.open .drawer-scrim{ opacity:1; backdrop-filter:blur(2px); }
.drawer-panel{ position:absolute; top:0; bottom:0; right:0; left:auto; width:min(560px,94vw); background:#fff;
  box-shadow:-30px 0 80px -24px rgba(16,24,40,.42);
  transform:translateX(105%); opacity:.4;
  transition:transform .5s cubic-bezier(.22,1,.36,1), opacity .35s ease;
  display:flex; flex-direction:column; overflow:hidden; will-change:transform; }
#drawer.open .drawer-panel{ transform:translateX(0); opacity:1; }

/* graceful staggered reveal of the drawer content */
@keyframes drIn{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
#drawer.open .drawer-body > *{ animation:drIn .55s cubic-bezier(.22,1,.36,1) both; }
#drawer.open .drawer-body > *:nth-child(1){ animation-delay:.14s; }
#drawer.open .drawer-body > *:nth-child(2){ animation-delay:.19s; }
#drawer.open .drawer-body > *:nth-child(3){ animation-delay:.24s; }
#drawer.open .drawer-body > *:nth-child(4){ animation-delay:.29s; }
#drawer.open .drawer-body > *:nth-child(5){ animation-delay:.34s; }
#drawer.open .drawer-body > *:nth-child(6){ animation-delay:.39s; }
#drawer.open .drawer-body > *:nth-child(n+7){ animation-delay:.43s; }
@media(prefers-reduced-motion:reduce){
  .drawer-panel{ transition:opacity .2s; transform:none; }
  #drawer.open .drawer-body > *{ animation:none; }
}
.drawer-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 22px 14px; border-bottom:1px solid var(--line); }
.drawer-kind{ font-size:12px; font-weight:700; color:var(--ink-3); }
.drawer-x{ width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--ink-2); font-size:16px; display:flex; align-items:center; justify-content:center; }
.drawer-x:hover{ background:var(--slate-bg); }
.drawer-body{ overflow-y:auto; padding:20px 22px 28px; flex:1; }
.dr-title{ font-size:22px; font-weight:800; margin:0 0 5px; }
.dr-sub{ font-size:13px; color:var(--ink-3); margin-bottom:18px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.dr-kpis{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:0 0 18px; }
.dr-kpi{ background:var(--slate-bg); border-radius:12px; padding:14px; }
.dr-kpi .l{ font-size:11px; color:var(--ink-3); font-weight:600; }
.dr-kpi .n{ font-family:var(--num); font-size:22px; font-weight:800; color:var(--ink); margin-top:2px; }
.dr-prop{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line-soft); }
.dr-prop .k{ min-width:130px; font-size:13px; color:var(--ink-3); font-weight:600; }
.dr-prop .v{ font-size:14px; font-weight:700; color:var(--ink); display:flex; gap:6px; flex-wrap:wrap; }
.dr-sec{ font-size:14px; font-weight:700; margin:20px 0 10px; }
.dr-row{ display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--line); border-radius:11px; margin-bottom:8px; }
.dr-row .nm{ flex:1; font-size:13.5px; font-weight:600; color:var(--ink); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dr-row .mb{ width:72px; height:6px; border-radius:99px; background:var(--line-soft); overflow:hidden; flex-shrink:0; }
.dr-row .mb > i{ display:block; height:100%; background:linear-gradient(90deg,#3498db,#5dade2); }
.dr-row .ct{ font-family:var(--num); font-size:13px; font-weight:800; color:var(--accent); flex-shrink:0; }
.dr-row.clickable{ cursor:pointer; transition:background .14s, border-color .14s; }
.dr-row.clickable:hover{ background:var(--accent-soft); border-color:#cfe4f5; }

/* ---------- Part 5: targeted products (NOSTRI / PureHerb) ---------- */
.tg-summary{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-card); padding:14px 16px; margin-bottom:16px; }
.tg-summary .tg-badge{ font-size:12px; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:99px; padding:5px 12px; }
.tg-summary .tg-stat{ font-size:13px; color:var(--ink-2); }
.tg-summary .tg-stat b{ font-family:var(--num); font-weight:800; color:var(--ink); }
.prod-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.prod-card{ position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-card); padding:16px; cursor:pointer; transition:border-color .16s, box-shadow .16s, transform .16s; }
.prod-card:hover{ border-color:#cfe4f5; box-shadow:0 8px 22px -12px rgba(52,152,219,.35); transform:translateY(-2px); }
.prod-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.prod-rank{ width:26px; height:26px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; font-family:var(--num); font-weight:800; font-size:12px; background:var(--slate-bg); color:var(--ink-2); }
.prod-rank.g1{ background:#fff4d6; color:#b7791f; } .prod-rank.g2{ background:#eef1f5; color:#5b6472; } .prod-rank.g3{ background:#fbe7d6; color:#b45c25; }
.prod-count{ font-family:var(--num); font-size:26px; font-weight:800; color:var(--ink); line-height:1; }
.prod-name{ font-size:15px; font-weight:700; margin-bottom:2px; }
.prod-form{ font-size:11.5px; color:var(--ink-3); }
.prod-stats{ display:flex; gap:14px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line-soft); font-size:12px; color:var(--ink-2); }
.prod-stats b{ font-family:var(--num); font-weight:800; color:var(--ink); }
.prod-card.zero{ opacity:.6; }
.prod-card.zero .prod-count{ color:var(--ink-3); }
@media(max-width:820px){ .prod-grid{ grid-template-columns:1fr; } }

/* ---------- near-expiry ---------- */
.ne-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
.ne-stat{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-card); padding:14px 16px; }
.ne-stat .l{ font-size:11.5px; font-weight:600; margin-bottom:5px; }
.ne-stat .n{ font-family:var(--num); font-size:24px; font-weight:800; }
.ne-stat.crit{ background:var(--rose-bg); border-color:#f2d6d1; } .ne-stat.crit .l,.ne-stat.crit .n{ color:var(--rose-fg); }
.ne-stat.warn{ background:var(--amber-bg); border-color:#fbe7c8; } .ne-stat.warn .l,.ne-stat.warn .n{ color:var(--amber-fg); }
.ne-stat.watch{ background:var(--blue-bg); border-color:#d8e6ff; } .ne-stat.watch .l,.ne-stat.watch .n{ color:var(--blue-fg); }
.ne-stat.green-s{ background:var(--green-bg); border-color:#cfeadd; } .ne-stat.green-s .l,.ne-stat.green-s .n{ color:var(--green-fg); }
.ne-stat .l{ color:var(--ink-3); } .ne-stat .n{ color:var(--ink); }
.chips{ display:flex; gap:8px; flex-wrap:wrap; }
.chip{ height:32px; padding:0 13px; border-radius:99px; border:1px solid var(--line); background:#fff; color:var(--ink-2); font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
.chip:hover{ background:var(--slate-bg); }
.chip.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
.days-pill{ font-family:var(--num); font-weight:700; }

/* generic placeholder for parts not built yet */
.stub{
  margin:8vh auto; max-width:480px; text-align:center; color:var(--ink-3);
}
.stub .stub-ico{ width:56px; height:56px; border-radius:16px; margin:0 auto 16px; background:var(--slate-bg); display:flex; align-items:center; justify-content:center; color:var(--ink-3); }
.stub h3{ color:var(--ink-2); font-size:17px; font-weight:600; margin:0 0 4px; }

/* mobile */
.menu-btn{ display:none; }
@media(max-width:920px){
  .app{ margin:0; height:100vh; border-radius:0; }
  .side{ position:fixed; inset-block:0; inset-inline-end:0; z-index:50; background:var(--surface);
         transform:translateX(100%); transition:transform .28s; box-shadow:var(--shadow-pop); }
  html[dir=rtl] .side{ transform:translateX(-100%); }
  .side.open{ transform:none !important; }
  .menu-btn{ display:inline-flex; }
  .topbar-search{ display:none; }
}
</style>
</head>

        if(!pending)return;
        sourceRows++;
        const split=cols.section?{doctor:pending.doctorSection,section:pending.section}:splitDoctorSection(pending.doctorSection);
        const row=normalizeRow({patient:pending.patient,patientName:pending.patientName,service:pending.service,orderNo:pending.orderNo,status:pending.status,doctor:split.doctor,section:split.section});
        if(row&&row.doctor&&row.service)rows.push(row);else rejectedRows++;
        pending=null;
        if(rows.length>PharmaCore.MAX_UPLOAD_ROWS)throw new Error('عدد الصفوف أكبر من الحد المدعوم (500,000 صف)');
      };
      for(const line of lines){
        const ws=line.words;
        if(isHeaderLine(ws)||isFooterLine(ws))continue;
        const cells={
          patient:joinCell(ws,cols.patient),
          patientName:joinCell(ws,cols.patientName),
          service:joinCell(ws,cols.service),
          orderNo:joinCell(ws,cols.orderNo),
          status:joinCell(ws,cols.status),
          doctorSection:joinCell(ws,cols.doctorSection),
          section:joinCell(ws,cols.section),
        };
        /* عمود «رقم المريض» قد يلتقط الرقم واسم المريض معاً؛ نأخذ المعرِّف الأول
           كبداية صفّ جديد ونحوّل بقية النص إلى اسم المريض بدل رفض الصف كاملاً */
        const patientCell=normalizeDigits(cells.patient).trim();
        const patientLead=patientCell.split(/\s+/)[0]||'';
        if(patientCell){
          if(/^[\p{L}\p{N}][\p{L}\p{N}._/-]{0,31}$/u.test(patientLead)){
            finalizePending();
            const patientRest=patientCell.slice(patientLead.length).trim();
            pending={...cells,patient:patientLead,patientName:patientRest?appendValue(patientRest,cells.patientName):cells.patientName,lastY:line.y};
            continue;
          }
          /* الخلية تبدأ بنص غير معرِّف — عاملها كتكملة سطر ملتفّ إن وُجد صفّ قيد التجميع */
          if(pending&&Math.abs(pending.lastY-line.y)<=24){
            ['patientName','service','orderNo','status','doctorSection','section'].forEach(field=>{pending[field]=appendValue(pending[field],cells[field]);});
            pending.patientName=appendValue(pending.patientName,patientCell);
            pending.lastY=line.y;
            continue;
          }
          sourceRows++;rejectedRows++;continue;
        }
        if(pending&&Math.abs(pending.lastY-line.y)<=24){
          ['patientName','service','orderNo','status','doctorSection','section'].forEach(field=>{pending[field]=appendValue(pending[field],cells[field]);});
          pending.lastY=line.y;
        }
      }
      finalizePending();
      options?.onProgress?.(pageNumber/pdf.numPages);
      if(pageNumber<pdf.numPages&&pageNumber%3===0)await yieldToBrowser();
    }
    if(!textItemCount)throw new Error('ملف PDF عبارة عن صور ممسوحة ولا يحتوي نصاً قابلاً للاستخراج. استخدم PDF نصي من Oracle أو شغّل OCR أولاً');
    if(!rows.length){
      if(textItemCount<Math.max(20,pdf.numPages*5)||!layoutDetectedPages)throw new Error('PDF لا يحتوي طبقة نص كاملة أو تخطيطه غير معروف. شغّل OCR أو صدّر تقرير PDF نصياً من النظام');
      throw new Error('لم أتمكن من تحليل صفوف PDF — تأكد من وجود أعمدة Patient No وService Name وDoctor Name');
    }
    return attachParseMeta(rows,{source:'pdf',pages:pdf.numPages,sourceRows,rejectedRows,textItemCount,layoutDetectedPages,fallbackPages});
  }finally{
    try{if(pdf)await pdf.destroy();else await loadingTask.destroy();}catch(_){}
  }
}

function nearExpiryDrugMatches(inventoryName,rxName){
  const inventory=PharmaCore.normalizeProductText(inventoryName),rx=PharmaCore.normalizeProductText(rxName);
  if(!inventory||!rx)return false;
  const brand=inventory.split(' ')[0];
  if(brand.length<3||!rx.split(' ').includes(brand))return false;
  if(PharmaCore.matchesCatalogProduct(rxName,{name:inventoryName,short:brand}))return true;
  const dose=value=>[...PharmaCore.normalizeEntityKey(value).matchAll(/(\d+(?:\.\d+)?)\s*(MG|MCG|G|IU|%)/g)].map(match=>String(Number(match[1]))+match[2]);
  const inventoryDose=dose(inventoryName),rxDose=dose(rxName);
  if(inventoryDose.length&&rxDose.length&&inventoryDose[0]!==rxDose[0])return false;
  const forms=['TABLET','CAPSULE','SYRUP','CREAM','GEL','SPRAY','SUSPENSION','SUSPENTION','OINTMENT','DROPS','PATCH'];
  const inventoryForm=forms.find(form=>inventory.includes(form)),rxForm=forms.find(form=>rx.includes(form));
  return !inventoryForm||!rxForm||inventoryForm===rxForm||(inventoryForm.startsWith('SUSP')&&rxForm.startsWith('SUSP'));
}

  function statusCounts(d){

  /* ── chart helpers (Chart.js) ── */
  const CH = {};
  if(window.Chart){ Chart.defaults.font.family='IBM Plex Sans Arabic'; Chart.defaults.color='#5b6472'; }
  function destroy(id){ if(CH[id]){ CH[id].destroy(); delete CH[id]; } }
  function hBar(id, items, color){
    const el=document.getElementById(id); if(!el||!window.Chart) return; destroy(id);
    CH[id]=new Chart(el,{ type:'bar',
      data:{ labels:items.map(x=>x.label), datasets:[{ data:items.map(x=>x.v), backgroundColor:color, borderRadius:6, barThickness:'flex', maxBarThickness:22 }] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ backgroundColor:'#1b1e23', padding:10, cornerRadius:8, displayColors:false } },
        scales:{ x:{ grid:{ color:'#f0f2f5' }, border:{display:false}, ticks:{ font:{size:11} } },
                 y:{ grid:{ display:false }, border:{display:false}, ticks:{ font:{size:12}, autoSkip:false } } } }
    });
  }
  function doughnut(id, labels, data, colors){
    const el=document.getElementById(id); if(!el||!window.Chart) return; destroy(id);
    CH[id]=new Chart(el,{ type:'doughnut',
      data:{ labels, datasets:[{ data, backgroundColor:colors, borderWidth:2, borderColor:'#fff', hoverOffset:6 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',
        plugins:{ legend:{ position:'right', labels:{ boxWidth:10, boxHeight:10, usePointStyle:true, font:{size:11.5}, padding:12 } },
                  tooltip:{ backgroundColor:'#1b1e23', padding:10, cornerRadius:8 } } }
    });
  }
  const PALETTE=['#3498db','#5dade2','#0284c7','#38bdf8','#c2790b','#f59e0b','#c0392b','#f87171','#7c3aed','#a78bfa','#27ae60','#4ade80','#334155','#94a3b8','#65a30d'];
  function drawCharts(d, st){
    const topDocs=d.doctors.slice(0,10).map(x=>({label:trunc(x.name,20), v:x.total}));
    const topDrugs=d.drugs.slice(0,10).map(x=>({label:trunc(x.name,22), v:x.total}));
    hBar('chDocs', topDocs, '#3498db');
    hBar('chDrugs', topDrugs, '#5dade2');
    const secs=d.sections.slice(0,8);
    doughnut('chSecs', secs.map(s=>trunc(s.name,16)), secs.map(s=>s.total), PALETTE);
    doughnut('chStatus', ['صُرفت','جديدة/معلّقة','ملغاة'], [st.closed, st.open, st.canceled], ['#27ae60','#0284c7','#c0392b']);
  }
  function trunc(s,n){ s=String(s||''); return s.length>n ? s.slice(0,n)+'…' : s; }

  /* ── Part 4: analysis tables (doctors / drugs / sections) ── */
  function activeData(){ return STATE[STATE.active] && STATE[STATE.active].data; }
  function rankHtml(i){ const c=i===0?'g1':i===1?'g2':i===2?'g3':''; return '<span class="rank '+c+'">'+(i+1)+'</span>'; }
  function barHtml(v,max){ const p=max>0?(v*100/max):0; return '<div class="bar-cell"><div class="bar" style="width:'+Math.max(2,p)+'%"></div><div class="bv">'+p.toFixed(1)+'%</div></div>'; }

  const TABLES = {
    doctors:{ title:'الأطباء', kind:'doc', sort:'total',
      cols:[ {k:'#',l:'#',w:'56px'}, {k:'name',l:'الطبيب',s:'name'}, {k:'section',l:'القسم'},
             {k:'total',l:'الكتابات',s:'total',n:1}, {k:'uniqueDrugs',l:'الأدوية',s:'uniqueDrugs',n:1},
             {k:'patients',l:'المرضى',s:'patients',n:1}, {k:'bar',l:'النسبة',w:'170px'} ] },
    drugs:{ title:'الأدوية', kind:'drug', sort:'total',

             {k:'patients',l:'المرضى',s:'patients',n:1}, {k:'bar',l:'النسبة',w:'170px'} ] },
    sections:{ title:'الأقسام', kind:'sec', sort:'total',
      cols:[ {k:'#',l:'#',w:'56px'}, {k:'name',l:'القسم',s:'name'}, {k:'doctors',l:'الأطباء',s:'doctors',n:1},

  let TB = null;

  function openTab(k){
    const d = activeData();
    if(!d){
      stub.innerHTML = '<div class="tbl-card"><div class="tbl-empty">'
        + '<div class="stub-ico" style="margin:0 auto 14px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="m7 8 5-5 5 5"/><path d="M4 21h16"/></svg></div>'

      return;
    }
    const conf = TABLES[k];
    const rows = (conf.kind==='doc'?d.doctors:conf.kind==='drug'?d.drugs:d.sections).slice();
    TB = { k, conf, d, rows, sort:{key:conf.sort, dir:-1}, term:'' };
    const thead = conf.cols.map(c=>{
      const sortable = c.s ? ' data-sk="'+c.s+'"' : '';
      return '<th'+(c.w?' style="width:'+c.w+'"':'')+sortable+'>'+c.l+(c.s?' <span class="arr"></span>':'')+'</th>';
    }).join('');
    stub.innerHTML =
      '<div class="tbl-card"><div class="tbl-head">'
      + '<div class="tbl-title"><span class="dot"></span> '+esc(conf.title)+' — '+esc(curBranch().label)+'</div>'
      + '<div class="search-in"><input placeholder="🔎 ابحث بالاسم…"><span class="si-ico"></span></div></div>'
      + '<div class="tbl-scroll"><table class="data"><thead><tr>'+thead+'</tr></thead><tbody id="tbody"></tbody></table></div></div>';

    stub.querySelectorAll('th[data-sk]').forEach(th=>th.addEventListener('click', ()=>{
      const key=th.dataset.sk;
      if(TB.sort.key===key) TB.sort.dir*=-1; else { TB.sort.key=key; TB.sort.dir=-1; }
      paintRows();
    }));
    paintRows();

  function paintRows(){
    const { conf, rows, sort, term } = TB;
    let list = rows;
    if(term) list = list.filter(r=>String(r.name||'').toLowerCase().includes(term));
    list = list.slice().sort((a,b)=>{
      const av=a[sort.key], bv=b[sort.key];
      if(typeof av==='string') return sort.dir*String(av).localeCompare(String(bv),'ar');
      return sort.dir*((av||0)-(bv||0));
    });
    const max = list.reduce((m,r)=>Math.max(m, r.total||0), 0);
    const tbody = stub.querySelector('#tbody');
    tbody.innerHTML = list.map((r,i)=>{
      const cells = conf.cols.map(c=>{
        if(c.k==='#') return '<td>'+rankHtml(i)+'</td>';
        if(c.k==='bar') return '<td>'+barHtml(r.total||0, max)+'</td>';
        if(c.k==='name') return '<td><strong>'+esc(r.name)+'</strong></td>';
        if(c.k==='section') return '<td><span class="tag teal">'+esc(r.section||'—')+'</span></td>';
        return '<td class="num">'+fmt(r[c.k]||0)+'</td>';
      }).join('');
      return '<tr data-name="'+escAttr(r.name)+'">'+cells+'</tr>';
    }).join('') || '<tr><td colspan="'+conf.cols.length+'" style="text-align:center;padding:30px;color:var(--ink-3)">لا توجد نتائج</td></tr>';
    // update sorted header marker
    stub.querySelectorAll('th[data-sk]').forEach(th=>{
      const on = th.dataset.sk===sort.key;
      th.classList.toggle('sorted', on);
      const arr=th.querySelector('.arr'); if(arr) arr.textContent = on ? (sort.dir<0?'▼':'▲') : '';
    });
    tbody.querySelectorAll('tr[data-name]').forEach(tr=>tr.onclick=()=>openRecord(TB.k, tr.dataset.name));
  }
  function escAttr(s){ return esc(s).replace(/'/g,'&#39;'); }

  /* ── slide-over drawer ── */
  const drawer = document.getElementById('drawer');
  const drawerBody = document.getElementById('drawerBody');
  const drawerKind = document.getElementById('drawerKind');
  drawer.addEventListener('click', e=>{ if(e.target.hasAttribute('data-close')) closeDrawer(); });
  document.getElementById('drawerBody').addEventListener('click', e=>{ const t=e.target.closest&&e.target.closest('[data-share-doc]'); if(t) openShareCard(t.getAttribute('data-share-doc')); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });
  function openDrawer(kind, html){ drawerKind.textContent=kind; drawerBody.innerHTML=html; drawer.classList.add('open'); drawerBody.scrollTop=0; }
  function closeDrawer(){ drawer.classList.remove('open'); }

  function pctOf(a,b){ return b>0?(a*100/b):0; }
  function statusPills(status){
    if(!status) return '—';
    const map={ Closed:['green','صُرفت'], Dispensed:['green','مصروف'], New:['blue','جديدة'], Opened:['blue','معلّقة'], Pending:['amber','معلّقة'], Canceled:['rose','ملغاة'], Cancelled:['rose','ملغاة'] };
    return Object.keys(status).map(kk=>{ const m=map[kk]||['',kk]; return '<span class="tag '+m[0]+'">'+esc(m[1])+' · '+fmt(status[kk])+'</span>'; }).join(' ') || '—';
  }
  function listRows(items, keyCount, shareable){
    if(!items || !items.length) return '<div class="dr-row"><span class="nm" style="color:var(--ink-3)">—</span></div>';
    const max = items[0][keyCount] || 1;
    return items.slice(0,12).map(it=>{ const c=it[keyCount]; const w=Math.max(4,Math.round(pctOf(c,max)));
      const attr = shareable ? ' class="dr-row clickable" data-share-doc="'+escAttr(it.name)+'" title="بطاقة مشاركة"' : ' class="dr-row"';
      return '<div'+attr+'><span class="nm">'+esc(it.name)+'</span><span class="mb"><i style="width:'+w+'%"></i></span><span class="ct">'+fmt(c)+'</span></div>'; }).join('');
  }

  function openRecord(k, name){
    const d = activeData(); if(!d) return;
    const find = arr => arr.find(x=> (typeof sameEntity==='function'? sameEntity(x.name,name) : x.name===name));
    if(k==='doctors'){ const r=find(d.doctors); if(r) drawDoctor(r,d); }
    else if(k==='drugs'){ const r=find(d.drugs); if(r) drawDrug(r,d); }
    else if(k==='sections'){ const r=find(d.sections); if(r) drawSection(r,d); }
  }
  function drawDoctor(r,d){
    openDrawer('👨‍⚕️ ملف طبيب',
      '<h2 class="dr-title">'+esc(r.name)+'</h2>'
      + '<div class="dr-sub"><span class="tag teal">'+esc(r.section||'—')+'</span><span>'+esc(curBranch().label)+'</span></div>'
      + '<button class="btn btn-primary" data-share-doc="'+escAttr(r.name)+'" style="width:100%;justify-content:center;margin-bottom:16px">🪪 بطاقة مشاركة (Private Label + PureHerb)</button>'

      + drProp('📊 نسبة من الإجمالي', pctOf(r.total,d.totalRows).toFixed(1)+'%')

      + '<div class="dr-sec">💊 أعلى الأدوية كتابةً</div>'+listRows(r.drugs,'count'));
  }
  function drawDrug(r,d){
    openDrawer('💊 ملف دواء',
      '<h2 class="dr-title">'+esc(r.name)+'</h2>'
      + '<div class="dr-sub"><span>'+esc(curBranch().label)+'</span></div>'
      + drKpis([['الكتابات',r.total],['الأطباء',r.doctorCount],['المرضى',r.patients]])
      + drProp('📊 نسبة من الإجمالي', pctOf(r.total,d.totalRows).toFixed(1)+'%')
      + drProp('🔁 مرضى متكررون', fmt(r.repeatPatients||0))
      + drProp('🩺 الحالة', statusPills(r.status))
      + '<div class="dr-sec">👨‍⚕️ أعلى الأطباء</div>'+listRows(r.doctors,'count')
      + '<div class="dr-sec">🏥 التوزيع على الأقسام</div>'+listRows(r.sections,'count'));
  }
  function drawSection(r,d){
    const ek = x => (typeof entityKey==='function'? entityKey(x) : String(x||'').trim().toLowerCase());
    const key = ek(r.name);
    const docs = d.doctors.filter(x=>ek(x.section)===key).sort((a,b)=>b.total-a.total).slice(0,12).map(x=>({name:x.name,count:x.total}));
    const drugs=[]; d.drugs.forEach(dr=>{ const h=(dr.sections||[]).find(s=>ek(s.name)===key); if(h&&h.count>0) drugs.push({name:dr.name,count:h.count}); });
    drugs.sort((a,b)=>b.count-a.count);
    openDrawer('🏥 ملف قسم',

  /* ── shareable doctor card (Private Label + PureHerb) — drawn on canvas ── */
  function roundRectPath(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function doctorTargeted(name, d){
    const pl={}, ph={};
    (d.rows||[]).forEach(r=>{ if(!sameEntity(r.doctor,name)) return;
      const p=findPrivateLabelProduct(r.service); if(p) pl[p.name]=(pl[p.name]||0)+1;
      const q=findPureHerbProduct(r.service); if(q) ph[q.name]=(ph[q.name]||0)+1;
    });
    return { pl:Object.entries(pl).sort((a,b)=>b[1]-a[1]), ph:Object.entries(ph).sort((a,b)=>b[1]-a[1]) };
  }
  async function buildDoctorCard(name, d){
    if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
    const rec = d.doctors.find(x=>sameEntity(x.name,name)) || { total:0, section:'' };
    const { pl, ph } = doctorTargeted(name, d);
    const plSum = pl.reduce((s,x)=>s+x[1],0), phSum = ph.reduce((s,x)=>s+x[1],0);
    const F='"IBM Plex Sans Arabic", sans-serif';
    const W=680, PAD=36, RH=44;
    const HEAD=140;
    let H = HEAD + 50 + 32 + 30 + 100 + 30;           // header + name + sub + gap + kpi + gap
    H += 46 + Math.max(1,pl.length)*RH + 18;          // PL block
    H += 46 + Math.max(1,ph.length)*RH + 18;          // PH block
    H += 100;                                         // footer (rule + two lines)
    const sc=2, cv=document.createElement('canvas'); cv.width=W*sc; cv.height=H*sc;
    const ctx=cv.getContext('2d'); ctx.scale(sc,sc); ctx.textBaseline='alphabetic';
    // background
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
    // header band
    const g=ctx.createLinearGradient(0,0,W,0); g.addColorStop(0,'#3498db'); g.addColorStop(1,'#5dade2');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,HEAD);
    ctx.textAlign='right'; ctx.fillStyle='#ffffff';
    ctx.font='800 28px '+F; ctx.fillText('PharmaDash', W-PAD, 56);
    ctx.font='600 16px '+F; ctx.fillStyle='rgba(255,255,255,.92)'; ctx.fillText('بطاقة الطبيب · الكتابات المستهدفة', W-PAD, 88);
    ctx.font='600 14px '+F; ctx.fillStyle='rgba(255,255,255,.82)'; ctx.fillText(curBranch().label, W-PAD, 114);
    let y=HEAD+50;
    // doctor name + section
    ctx.textAlign='right'; ctx.fillStyle='#14171c'; ctx.font='800 30px '+F; ctx.fillText(name, W-PAD, y); y+=32;
    ctx.fillStyle='#828d9d'; ctx.font='600 15px '+F; ctx.fillText((rec.section||'—')+'  ·  إجمالي الكتابات '+fmt(rec.total), W-PAD, y); y+=30;
    // KPI boxes
    const boxes=[['كتابات PL',plSum,'#c0392b'],['كتابات PureHerb',phSum,'#7c3aed'],['إجمالي',rec.total,'#3498db']];
    const bw=(W-PAD*2-20)/3;
    boxes.forEach((b,i)=>{ const bx=PAD+i*(bw+10), by=y;
      ctx.fillStyle='#f4f5f7'; roundRectPath(ctx,bx,by,bw,80,14); ctx.fill();
      ctx.textAlign='center'; ctx.fillStyle='#828d9d'; ctx.font='600 13px '+F; ctx.fillText(b[0], bx+bw/2, by+30);
      ctx.fillStyle=b[2]; ctx.font='800 30px '+F; ctx.fillText(fmt(b[1]), bx+bw/2, by+64);
    });
    y+=80+30;
    // block renderer
    function block(title, rows, dot){
      ctx.textAlign='right'; ctx.fillStyle='#14171c'; ctx.font='800 18px '+F; ctx.fillText(title, W-PAD, y);
      ctx.beginPath(); ctx.fillStyle=dot; ctx.arc(W-PAD-ctx.measureText(title).width-14, y-6, 5, 0, 7); ctx.fill();
      y+=46;
      if(!rows.length){ ctx.textAlign='right'; ctx.fillStyle='#98a1b0'; ctx.font='500 15px '+F; ctx.fillText('لم يكتب أي صنف', W-PAD, y-14); y+=8; return; }
      rows.forEach(r=>{
        ctx.fillStyle='#fafbfc'; roundRectPath(ctx,PAD,y-30,W-PAD*2,38,10); ctx.fill();
        ctx.textAlign='right'; ctx.fillStyle='#14171c'; ctx.font='600 15px '+F;
        let nm=r[0]; if(nm.length>46) nm=nm.slice(0,46)+'…'; ctx.fillText(nm, W-PAD-16, y-6);
        ctx.textAlign='left'; ctx.fillStyle=dot; ctx.font='800 17px '+F; ctx.fillText(fmt(r[1]), PAD+16, y-6);
        y+=RH;
      });
      y+=18;
    }
    block('⭐ منتجات Private Label', pl, '#c0392b');
    block('🌿 منتجات PureHerb', ph, '#7c3aed');
    // footer — report attribution
    ctx.fillStyle='#eef0f2'; ctx.fillRect(PAD,y-6,W-PAD*2,1);
    y+=30;
    ctx.textAlign='center'; ctx.fillStyle='#2980b9'; ctx.font='800 18px '+F;
    ctx.fillText('التقرير الدوري لرئيس مجلس الإدارة', W/2, y);
    y+=28;
    ctx.fillStyle='#828d9d'; ctx.font='600 14px '+F;
    ctx.fillText(new Date().toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'}), W/2, y);
    return cv;
  }

  /* ── Part 5: targeted products (NOSTRI / PureHerb) ── */
  function targetedStats(d, products, matcher){
    const map = {}; products.forEach(p=>map[p.key]={count:0, docs:new Map(), pts:new Set()});
    (d.rows||[]).forEach(r=>{
      const p = matcher(r.service); if(!p || !map[p.key]) return;
      const m = map[p.key]; m.count++;
      const dn = r.doctor; if(dn){ const k=entityKey(dn); const e=m.docs.get(k)||{name:dn,count:0}; e.count++; m.docs.set(k,e); }
      if(r.patient) m.pts.add(entityKey(r.patient));
    });
    return products.map(p=>({ key:p.key, name:p.name||p.key, form:(p.form||p.code||''),
      count:map[p.key].count, docs:[...map[p.key].docs.values()].sort((a,b)=>b.count-a.count),
      patients:map[p.key].pts.size })).sort((a,b)=>b.count-a.count);
  }

  let NE = null;
  function neUrgency(days){
    if(days<=30) return {lvl:'crit', label:'حرج', cls:'rose'};
    if(days<=90) return {lvl:'warn', label:'تحذير', cls:'amber'};
    if(days<=180) return {lvl:'watch', label:'مراقبة', cls:'blue'};
    return {lvl:'ok', label:'آمن', cls:'green'};
  }

    const items = NEAR_EXPIRY_DATA.map(r=>{
      const d = dtParseLocal(r.expiry);
      const days = Math.ceil((d - today)/(1000*60*60*24));

    }).filter(r=> dtParseLocal(r.expiry) >= cutoff)   // ← استبعاد كل ما يتبقّى له أقل من شهر
      .sort((a,b)=>a.days-b.days);
    const warn = items.filter(i=>i.u.lvl==='warn');

      + '<td><span class="tag '+r.u.cls+'">'+r.u.label+'</span></td>'
      + '</tr>'
    ).join('') || '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--ink-3)">لا توجد أصناف مطابقة</td></tr>';
  }

  /* ── shared: empty prompt + kpi card ── */
  function analysisEmpty(title){
    stub.innerHTML = '<div class="tbl-card"><div class="tbl-empty"><div class="stub-ico" style="margin:0 auto 14px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="m7 8 5-5 5 5"/><path d="M4 21h16"/></svg></div><h3 style="color:var(--ink-2);font-size:17px;font-weight:600;margin:0 0 4px">لا توجد بيانات بعد</h3><p>افتح «نظرة عامة» وارفع ملف مجمّع لعرض '+esc(title)+'.</p></div></div>';
  }
  function kpiCard(label, val, cls, foot){
    return '<div class="kpi kpi-'+cls+'"><div class="kpi-head"><div class="kpi-label">'+label+'</div><div class="kpi-ico">'+(KICON[cls]||'')+'</div></div>'
      + '<div class="kpi-num">'+(typeof val==='number'?fmt(val):val)+'</div>'+(foot?'<div class="kpi-foot">'+esc(foot)+'</div>':'')+'</div>';
  }

  /* ── Pareto 80/20 ── */
  function renderPareto(){
    const d = activeData(); if(!d){ analysisEmpty('باريتو 80/20'); return; }
    const total = d.totalRows;
    const docs = d.doctors.slice().sort((a,b)=>b.total-a.total);
    let cum=0; const rows = docs.map(x=>{ cum+=x.total; return {name:x.name, total:x.total, cumPct: total?cum/total*100:0}; });
    const idx80 = rows.findIndex(r=>r.cumPct>=80);
    const n80 = idx80<0 ? rows.length : idx80+1;
    const pctDocs = rows.length ? (n80/rows.length*100) : 0;
    stub.innerHTML =
      '<div class="kpi-grid">'
      + kpiCard('قاعدة 80/20', pctDocs.toFixed(0)+'%', 'k2', 'من الأطباء يكتبون 80% من الوصفات')
      + kpiCard('أطباء الـ 80%', n80, 'k1', 'طبيب يمثّلون 80% من الكتابات')
      + kpiCard('إجمالي الأطباء', rows.length, 'k4', '')
      + kpiCard('إجمالي الوصفات', total, 'k3', esc(curBranch().label))
      + '</div>'
      + '<div class="card"><div class="card-head"><div class="card-title"><span class="dot"></span> منحنى باريتو — أعلى 30 طبيب (كتابات + تراكمي %)</div></div><div class="chart-box" style="height:340px"><canvas id="chPareto"></canvas></div></div>';
    drawPareto(rows.slice(0,30), n80);
  }
  function drawPareto(rows, n80){
    const el=document.getElementById('chPareto'); if(!el||!window.Chart) return; destroy('chPareto');
    CH['chPareto']=new Chart(el,{ data:{ labels:rows.map(r=>trunc(r.name,14)),
      datasets:[
        { type:'bar', label:'كتابات', data:rows.map(r=>r.total), backgroundColor:rows.map((r,i)=>i<n80?'#3498db':'#cbd5d8'), borderRadius:5, yAxisID:'y', order:2 },
        { type:'line', label:'تراكمي %', data:rows.map(r=>r.cumPct), borderColor:'#c2790b', backgroundColor:'rgba(194,121,11,.08)', borderWidth:2, pointRadius:0, tension:.35, yAxisID:'y2', order:1 }
      ]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{ usePointStyle:true, boxWidth:9, font:{size:11.5} } }, tooltip:{ backgroundColor:'#1b1e23', padding:10, cornerRadius:8 } },
        scales:{ x:{ grid:{display:false}, border:{display:false}, ticks:{ font:{size:10}, maxRotation:60, minRotation:45 } },
          y:{ grid:{color:'#f0f2f5'}, border:{display:false}, ticks:{font:{size:10}} },
          y2:{ position:'left', min:0, max:100, grid:{display:false}, border:{display:false}, ticks:{ callback:v=>v+'%', font:{size:10} } } } }
    });
  }

  /* ── doctor loyalty (Private Label tiers) ── */
  const LOY = { loyal:{l:'🏆 مخلص',c:'green'}, regular:{l:'✅ منتظم',c:'teal'}, developing:{l:'🔄 يحتاج تطوير',c:'amber'}, none:{l:'⚠ لم يكتب PL',c:'rose'} };
  function renderLoyalty(){
    const d = activeData(); if(!d){ analysisEmpty('ولاء الأطباء'); return; }
    const docs = d.doctors.map(doc=>{
      let pl=0, plItems=0;
      (doc.drugs||[]).forEach(dr=>{ if(findPrivateLabelProduct(dr.name)){ pl+=dr.count; plItems++; } });
      const rate = doc.total ? pl/doc.total*100 : 0;
      let tier;
      if(pl>=5 && rate>=20) tier='loyal';
      else if(pl>0 && (rate>=8 || plItems>=3)) tier='regular';
      else if(pl>0) tier='developing';
      else tier='none';
      return { name:doc.name, section:doc.section, total:doc.total, pl, rate, tier };
    });
    const buckets = { loyal:0, regular:0, developing:0, none:0 };
    docs.forEach(x=>buckets[x.tier]++);
    const ranked = docs.slice().sort((a,b)=> b.pl-a.pl || b.rate-a.rate);
    LY = { ranked, filter:'all' };
    stub.innerHTML =
      '<div class="ne-stats">'
      + '<div class="ne-stat green-s"><div class="l">🏆 مخلص</div><div class="n">'+fmt(buckets.loyal)+'</div></div>'
      + '<div class="ne-stat watch"><div class="l">✅ منتظم</div><div class="n">'+fmt(buckets.regular)+'</div></div>'
      + '<div class="ne-stat warn"><div class="l">🔄 يحتاج تطوير</div><div class="n">'+fmt(buckets.developing)+'</div></div>'
      + '<div class="ne-stat crit"><div class="l">⚠ لم يكتب PL</div><div class="n">'+fmt(buckets.none)+'</div></div>'
      + '</div>'
      + '<div class="tbl-card"><div class="tbl-head">'
      + '<div class="chips" id="lyChips"><button class="chip active" data-f="all">الكل</button><button class="chip" data-f="loyal">مخلص</button><button class="chip" data-f="regular">منتظم</button><button class="chip" data-f="developing">يحتاج تطوير</button><button class="chip" data-f="none">لم يكتب</button></div>'
      + '<div class="tbl-title" style="font-size:13px;color:var(--ink-3)">'+esc(curBranch().label)+'</div></div>'
      + '<div class="tbl-scroll"><table class="data"><thead><tr><th style="width:56px">#</th><th>الطبيب</th><th>القسم</th><th>الكتابات</th><th>كتابات PL</th><th>نسبة PL</th><th>التصنيف</th></tr></thead><tbody id="lyBody"></tbody></table></div></div>';
    stub.querySelectorAll('#lyChips .chip').forEach(c=>c.onclick=()=>{ stub.querySelectorAll('#lyChips .chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); LY.filter=c.dataset.f; paintLY(); });
    paintLY();
  }
  let LY = null;
  function paintLY(){
    let list = LY.ranked;
    if(LY.filter!=='all') list = list.filter(x=>x.tier===LY.filter);
    const body = stub.querySelector('#lyBody');
    body.innerHTML = list.map((r,i)=>{ const t=LOY[r.tier];
      return '<tr data-name="'+escAttr(r.name)+'"><td>'+rankHtml(i)+'</td><td><strong>'+esc(r.name)+'</strong></td>'
        + '<td><span class="tag teal">'+esc(r.section||'—')+'</span></td>'
        + '<td class="num">'+fmt(r.total)+'</td><td class="num">'+fmt(r.pl)+'</td>'
        + '<td class="num">'+r.rate.toFixed(1)+'%</td><td><span class="tag '+t.c+'">'+t.l+'</span></td></tr>';
    }).join('') || '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--ink-3)">لا يوجد</td></tr>';
    body.querySelectorAll('tr[data-name]').forEach(tr=>tr.onclick=()=>openRecord('doctors', tr.dataset.name));
  }

  /* ── comparisons (branches + periods) ── */
  function branchMetrics(d){
    return { writings:d.totalRows, doctors:d.doctors.length, drugs:d.drugs.length,
      sections:d.sections.length, patients:d.totalPatients,
      pl:(d.rows||[]).filter(r=>findPrivateLabelProduct(r.service)).length };
  }
  const CMP_METRICS = [['الكتابات','writings'],['الأطباء','doctors'],['الأدوية','drugs'],['الأقسام','sections'],['المرضى','patients'],['Private Label','pl']];
  function comparePrompt(title, msg){
    return '<div class="tbl-card"><div class="tbl-empty"><div class="stub-ico" style="margin:0 auto 14px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="6" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="14"/></svg></div><h3 style="color:var(--ink-2);font-size:17px;font-weight:600;margin:0 0 4px">'+esc(title)+'</h3><p>'+esc(msg)+'</p></div></div>';
  }
  function vBar(id, labels, data){
    const el=document.getElementById(id); if(!el||!window.Chart) return; destroy(id);
    CH[id]=new Chart(el,{ type:'bar', data:{ labels, datasets:[{ data, backgroundColor:'#3498DB', borderRadius:7, maxBarThickness:64 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false}, tooltip:{backgroundColor:'#333',padding:10,cornerRadius:8,displayColors:false} },
        scales:{ x:{ grid:{display:false}, border:{display:false}, ticks:{font:{size:12}} }, y:{ grid:{color:'#eef1f4'}, border:{display:false}, ticks:{font:{size:10}} } } } });
  }
  function cmpTable(cols, rowsData){
    // cols: [{label}], rowsData: [{label, vals:[...]}]
    return '<div class="tbl-scroll"><table class="data"><thead><tr><th>المقياس</th>'
      + cols.map(c=>'<th class="num" style="text-align:center">'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'
      + rowsData.map(r=>'<tr><td><strong>'+esc(r.label)+'</strong></td>'+r.vals.map(v=>'<td class="num" style="text-align:center">'+v+'</td>').join('')+'</tr>').join('')
      + '</tbody></table></div>';
  }
  function renderCompareBranches(){
    const loaded = BRANCHES.filter(b=>STATE[b.key] && STATE[b.key].data);
    if(loaded.length<2){ stub.innerHTML = comparePrompt('مقارنة الفروع','ارفع ملف لفرعين على الأقل (مثلاً «التعاون الأول» + «التعاون الثاني») لعرض المقارنة.'); return; }
    const rows = loaded.map(b=>({ label:b.label, m:branchMetrics(STATE[b.key].data) }));
    const cards = rows.map((r,i)=>kpiCard(r.label, r.m.writings, ['k1','k2','k3','k4','k5','k6'][i%6], fmt(r.m.doctors)+' طبيب · '+fmt(r.m.pl)+' PL')).join('');
    const tbl = cmpTable(rows.map(r=>r.label), CMP_METRICS.map(m=>({label:m[0], vals:rows.map(r=>fmt(r.m[m[1]]))})));
    stub.innerHTML = '<div class="kpi-grid">'+cards+'</div>'
      + '<div class="grid-2"><div class="card"><div class="card-head"><div class="card-title"><span class="dot"></span> إجمالي الكتابات لكل فرع</div></div><div class="chart-box" style="height:300px"><canvas id="chCmpBr"></canvas></div></div>'
      + '<div class="tbl-card"><div class="tbl-head"><div class="tbl-title"><span class="dot"></span> مقارنة المقاييس</div></div>'+tbl+'</div></div>';
    vBar('chCmpBr', rows.map(r=>r.label), rows.map(r=>r.m.writings));
  }
  function renderComparePeriods(){
    const cur = curBranch(); const periods = (STATE[cur.key].periods||[]);
    if(periods.length<2){ stub.innerHTML = comparePrompt('مقارنة زمنية','أضف فترة ثانية لـ«'+cur.label+'» (زر «+ فترة» في النظرة العامة) لمقارنة التغيّر عبر الزمن.'); return; }
    const list = periods.map((p,i)=>({ label:p.name.replace(/\.[^.]+$/,'').slice(0,22)||('فترة '+(i+1)), m:branchMetrics(p.data) }));
    const first=list[0].m, last=list[list.length-1].m;
    function chg(key){ const a=first[key],b=last[key]; if(!a) return {t:'—',c:'var(--ink-3)'}; const g=((b-a)/a*100); return {t:(g>=0?'▲ +':'▼ ')+g.toFixed(1)+'%', c:g>0?'var(--green-fg)':g<0?'var(--rose-fg)':'var(--ink-3)'}; }
    const cards = CMP_METRICS.slice(0,4).map((m,i)=>{ const c=chg(m[1]);
      return '<div class="kpi kpi-'+['k1','k2','k3','k6'][i]+'"><div class="kpi-head"><div class="kpi-label">'+m[0]+'</div><div class="kpi-ico">'+(KICON[['k1','k2','k3','k6'][i]]||'')+'</div></div>'
        + '<div class="kpi-num">'+fmt(last[m[1]])+'</div><div class="kpi-foot" style="color:'+c.c+';font-weight:700">'+c.t+' مقابل '+fmt(first[m[1]])+'</div></div>'; }).join('');
    const tbl = cmpTable(list.map(p=>p.label), CMP_METRICS.map(m=>({label:m[0], vals:list.map(p=>fmt(p.m[m[1]]))})));
    stub.innerHTML = '<div class="tg-summary"><span class="tg-badge">مقارنة زمنية</span><span class="tg-stat">'+esc(cur.label)+' · '+list.length+' فترات</span></div>'
      + '<div class="kpi-grid">'+cards+'</div>'
      + '<div class="grid-2"><div class="card"><div class="card-head"><div class="card-title"><span class="dot"></span> الكتابات عبر الفترات</div></div><div class="chart-box" style="height:300px"><canvas id="chCmpPr"></canvas></div></div>'
      + '<div class="tbl-card"><div class="tbl-head"><div class="tbl-title"><span class="dot"></span> مقارنة المقاييس</div></div>'+tbl+'</div></div>';
    vBar('chCmpPr', list.map(p=>p.label), list.map(p=>p.m.writings));
  }

  /* ── drug search ── */
  let DS = null;
  function renderDrugSearch(){
    const d = activeData();
    if(!d){
      stub.innerHTML = '<div class="tbl-card"><div class="tbl-empty"><div class="stub-ico" style="margin:0 auto 14px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg></div><h3 style="color:var(--ink-2);font-size:17px;font-weight:600;margin:0 0 4px">لا توجد بيانات بعد</h3><p>افتح «نظرة عامة» وارفع ملف مجمّع للبحث في الأدوية.</p></div></div>';
      return;
    }
    DS = { d, term:'' };
    stub.innerHTML =
      '<div class="tbl-card"><div class="tbl-head">'
      + '<div class="tbl-title"><span class="dot"></span> بحث الأدوية — '+esc(curBranch().label)+'</div>'
      + '<div class="search-in"><input id="dsInput" placeholder="🔎 اكتب اسم الدواء…" autocomplete="off"><span class="si-ico"></span></div></div>'
      + '<div class="tbl-scroll"><table class="data"><thead><tr><th style="width:56px">#</th><th>الدواء</th><th>الكتابات</th><th>الأطباء</th><th>المرضى</th><th style="width:170px">النسبة</th></tr></thead><tbody id="dsBody"></tbody></table></div>'
      + '<div class="note" style="margin:12px 14px 14px">اكتب جزء من اسم الدواء لتصفية القائمة، واضغط على أي صف لفتح ملف الدواء (أعلى الأطباء + التوزيع على الأقسام).</div></div>';
    const inp = stub.querySelector('#dsInput');
    inp.addEventListener('input', ()=>{ DS.term = inp.value.trim().toLowerCase(); paintDS(); });
    paintDS();
    setTimeout(()=>inp.focus(), 30);
  }
  function paintDS(){
    const d = DS.d;
    let list = d.drugs;
    if(DS.term) list = list.filter(x=>String(x.name||'').toLowerCase().includes(DS.term));
    list = list.slice(0, DS.term ? 500 : 60);
    const max = d.drugs.length ? d.drugs[0].total : 1;
    const body = stub.querySelector('#dsBody');
    body.innerHTML = list.map((r,i)=>
      '<tr data-name="'+escAttr(r.name)+'"><td>'+rankHtml(i)+'</td><td><strong>'+esc(r.name)+'</strong></td>'
      + '<td class="num">'+fmt(r.total)+'</td><td class="num">'+fmt(r.doctorCount)+'</td><td class="num">'+fmt(r.patients)+'</td><td>'+barHtml(r.total,max)+'</td></tr>'
    ).join('') || '<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--ink-3)">لا يوجد دواء مطابق</td></tr>';
    body.querySelectorAll('tr[data-name]').forEach(tr=>tr.onclick=()=>{ const r=d.drugs.find(x=>x.name===tr.dataset.name); if(r) drawDrug(r,d); });
  }

  function drawProduct(s, kind){
    const label = kind==='pl' ? 'منتج Private Label' : 'منتج PureHerb';
    const d = TG.d;
    openDrawer('⭐ '+label,
      '<h2 class="dr-title">'+esc(s.name)+'</h2>'
      + '<div class="dr-sub"><span class="tag '+(kind==='pl'?'rose':'violet')+'">'+esc(s.form||'')+'</span><span>'+esc(curBranch().label)+'</span></div>'
      + drKpis([['الكتابات',s.count],['الأطباء',s.docs.length],['المرضى',s.patients]])
      + drProp('📊 نسبة من الوصفات', pctOf(s.count,d.totalRows).toFixed(2)+'%')
      + '<div class="dr-sec">👨‍⚕️ الأطباء الأكثر كتابةً <span style="font-size:11px;color:var(--ink-3);font-weight:500">(اضغط على طبيب لبطاقة المشاركة)</span></div>'
      + (s.docs.length ? listRows(s.docs,'count',true) : '<div class="dr-row"><span class="nm" style="color:var(--ink-3)">لم يكتبه أي طبيب بعد</span></div>'));
  }

  function periodChip(p,i){
    const x = (STATE.active==='ALL') ? '' : '<button class="pc-x" data-i="'+i+'" title="حذف">✕</button>';
    return '<span class="period-chip"><span class="pc-ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg></span>'
      + '<span class="pc-name">'+esc(p.name)+'</span>'+x+'</span>';
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function wirePeriodRemoval(){
    branchBody.querySelectorAll('.pc-x').forEach(x=>x.onclick=()=>{
      STATE[STATE.active].periods.splice(+x.dataset.i,1);
      renderSelector(); renderBranchBody(); updateCounts();
    });
  }

  function wireDropzone(){
    const dz = document.getElementById('dz');
    document.getElementById('dzBtn').onclick = ()=>pickFile();
    dz.addEventListener('click', e=>{ if(e.target.id!=='dzBtn') pickFile(); });
    ['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add('drag'); }));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.remove('drag'); }));
    dz.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f) onFile(f); });
  }

  function pickFile(){ fileInput.value=''; fileInput.click(); }
  fileInput.addEventListener('change', e=>{ const f=e.target.files[0]; if(f) onFile(f); });

  function setLoading(label){
    branchBody.innerHTML =
      '<div class="branch-empty"><div class="empty-badge spin"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.5"/></svg></div>'
      + '<h3>جارٍ تحليل الملف…</h3><p>'+esc(label)+'</p></div>';
  }

  async function onFile(f){
    if(STATE.active==='ALL'){ alert('العرض المجمّع للقراءة فقط — اختر «التعاون الأول/الثاني/الثالث» لرفع ملف.'); return; }
    const branch = STATE.active;
    try{
      const ext = validateUploadFile(f);            // throws on bad file/size/type
      setLoading(f.name);
      let rows;
      if(ext==='.pdf')       rows = await parsePDF(f, {});
      else if(ext==='.csv')  rows = await parseCSV(f, {});
      else                   rows = await parseExcel(f, {});
      validateParsedRows(rows);
      const d = aggregate(rows);
      d.rows = rows; d.reportName = f.name;
      STATE[branch].periods.push({ name:f.name, data:d });
      STATE[branch].data = d;                        // latest period is the active dataset
      renderSelector(); renderBranchBody(); updateCounts();
    }catch(err){
      alert('تعذّر قراءة الملف:\n' + (err && err.message ? err.message : err));
      renderBranchBody();                            // back to prompt
    }
  }

  function updateCounts(){
    const d = STATE[STATE.active].data;
    const set = (k,v)=>{ const el=document.querySelector('.nav-item[data-k="'+k+'"] .count'); if(el) el.textContent = v; };
    set('doctors', d?fmt(d.doctors.length):'0');
    set('drugs',   d?fmt(d.drugs.length):'0');
    set('sections',d?fmt(d.sections.length):'0');
  }

  // selector open/close
  trigger.onclick = (e)=>{ e.stopPropagation(); const open=menu.classList.toggle('open'); trigger.setAttribute('aria-expanded', open); };
  menu.addEventListener('click', e=>{ const opt=e.target.closest('.collab-opt'); if(!opt) return; STATE.active=opt.dataset.b; menu.classList.remove('open'); trigger.setAttribute('aria-expanded','false'); renderSelector(); renderBranchBody(); });
  document.addEventListener('click', ()=>{ menu.classList.remove('open'); trigger.setAttribute('aria-expanded','false'); });

  // topbar buttons + add-period both target the active branch
  document.getElementById('uploadBtn').onclick = ()=>pickFile();
  document.getElementById('branchUpload').onclick = ()=>pickFile();
  document.getElementById('branchAddPeriod').onclick = ()=>pickFile();

  // mobile menu
  document.getElementById('menuBtn').onclick = ()=> document.getElementById('side').classList.toggle('open');

  // init
  renderSelector(); renderBranchBody();
})();
</script>
</body>
</html>
