<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pure Herb Kids | بطاقة توزيع للطبيب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #142033;
    --navy: #0f2744;
    --zinc: #1a4f8b;
    --omega: #0b6e8a;
    --argi: #c45a12;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Cairo", "Sora", sans-serif;
    background: #e8eef5;
    color: var(--ink);
    min-height: 100vh;
    padding: 16px;
  }

  .toolbar {
    width: 210mm;
    max-width: 100%;
    margin: 0 auto 10px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .toolbar button {
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
    background: var(--navy);
    color: #fff;
  }

  .sheet {
    width: 210mm;
    height: 297mm;
    max-width: 100%;
    margin: 0 auto;
    background:
      radial-gradient(circle at 15% 10%, rgba(26, 79, 139, 0.06), transparent 28%),
      radial-gradient(circle at 85% 18%, rgba(196, 90, 18, 0.05), transparent 26%),
      #fff;
    border: 1px solid rgba(15, 39, 68, 0.12);
    border-radius: 14px;
    box-shadow: 0 14px 40px rgba(15, 39, 68, 0.12);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 14mm 12mm 12mm;
  }

  .head {
    text-align: center;
    margin-bottom: 10mm;
  }

  .brand {
    font-family: "Sora", "Cairo", sans-serif;
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--navy);
  }

  .brand span { color: #2f9d57; }

  .line {
    width: 56px;
    height: 3px;
    margin: 8px auto 0;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--zinc), var(--omega), var(--argi));
  }

  .grid {
    flex: 1;
    display: grid;
    grid-template-rows: repeat(3, 1fr);
    gap: 8mm;
    min-height: 0;
  }

  .item {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    align-items: center;
    gap: 8mm;
    min-height: 0;
    border-radius: 16px;
    overflow: hidden;
    background: #f7f9fc;
    border: 1px solid rgba(15, 39, 68, 0.08);
  }

  .item.zinc { background: linear-gradient(90deg, #eef4fb, #fff); }
  .item.omega { background: linear-gradient(90deg, #e9f6fa, #fff); }
  .item.argi { background: linear-gradient(90deg, #fff6ea, #fff); }

  .photo {
    height: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6mm;
  }

  .photo img {
    width: 100%;
    height: 100%;
    max-height: 68mm;
    object-fit: contain;
    display: block;
  }

  .label {
    padding: 6mm 7mm 6mm 4mm;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }

  .label strong {
    font-family: "Sora", "Cairo", sans-serif;
    font-size: clamp(1.6rem, 3.2vw, 2.1rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: 0.02em;
  }

  .label span {
    font-size: 1.05rem;
    font-weight: 800;
    color: #5a6b7d;
  }

  .item.zinc .label strong { color: var(--zinc); }
  .item.omega .label strong { color: var(--omega); }
  .item.argi .label strong { color: var(--argi); }

  .foot {
    margin-top: 8mm;
    text-align: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: #6b7c8f;
  }

  .note {
    width: 210mm;
    max-width: 100%;
    margin: 8px auto 0;
    text-align: center;
    font-size: 0.75rem;
    color: #6b7c8f;
  }

  @media (max-width: 820px) {
    body { padding: 8px; }
    .sheet {
      width: 100%;
      height: auto;
      min-height: 0;
      padding: 18px 14px;
    }
    .grid { gap: 12px; }
    .item {
      grid-template-columns: 1fr;
      text-align: center;
    }
    .photo img { max-height: 220px; }
    .label { padding: 8px 12px 14px; align-items: center; }
    .toolbar { width: 100%; }
    .toolbar button { flex: 1; }
  }

  @media print {
    @page {
      size: A4 portrait;
      margin: 0;
    }

    html, body {
      background: #fff !important;
      padding: 0 !important;
      margin: 0 !important;
      width: 210mm;
      height: 297mm;
      overflow: hidden;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .toolbar, .note { display: none !important; }

    .sheet {
      width: 210mm;
      height: 297mm;
      border: none;
      border-radius: 0;
      box-shadow: none;
      page-break-inside: avoid;
      break-inside: avoid;
    }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button type="button" onclick="window.print()">طباعة / حفظ PDF</button>
  </div>

  <main class="sheet" aria-label="بطاقة منتجات للطبيب">
    <header class="head">
      <div class="brand">PURE <span>HERB</span> KIDS</div>
      <div class="line" aria-hidden="true"></div>
    </header>

    <section class="grid">
      <article class="item zinc">
        <div class="photo">
          <img src="assets/zincolive-hero.png" alt="Zincolive" width="800" height="800">
        </div>
        <div class="label">
          <strong>ZINCOLIVE</strong>
          <span>زنك</span>
        </div>
      </article>

      <article class="item omega">
        <div class="photo">
          <img src="assets/pure-omega-hero.png" alt="Omega-3" width="800" height="800">
        </div>
        <div class="label">
          <strong>OMEGA-3</strong>
          <span>أوميغا-3</span>
        </div>
      </article>

      <article class="item argi">
        <div class="photo">
          <img src="assets/argi-grow-hero.png" alt="Argi Grow" width="800" height="800">
        </div>
        <div class="label">
          <strong>ARGI GROW</strong>
          <span>نمو</span>
        </div>
      </article>
    </section>

    <footer class="foot">للطبيب · دعم نمو الأطفال</footer>
  </main>

  <p class="note">A4 · اطبع ووزّع على الطبيب</p>
</body>
</html>
