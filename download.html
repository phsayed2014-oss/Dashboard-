<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحميل PharmaDash | لوحة التحليلات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:#070a12;color:#f0f4ff;font-family:'IBM Plex Sans Arabic',sans-serif;padding:24px}
.card{max-width:520px;width:100%;background:#10162a;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px;box-shadow:0 24px 64px rgba(0,0,0,.5);text-align:center}
.logo{width:64px;height:64px;margin:0 auto 16px;border-radius:16px;background:linear-gradient(135deg,#2563eb,#14b8a6);display:grid;place-items:center;font-weight:900;font-size:22px}
h1{font-size:22px;font-weight:900;margin-bottom:8px}
p{color:#9aa7c4;font-size:14px;line-height:1.7;margin-bottom:24px}
.dl{display:flex;flex-direction:column;gap:12px}
a.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 20px;border-radius:14px;text-decoration:none;font-weight:800;font-size:15px;transition:.2s}
a.primary{background:linear-gradient(135deg,#2563eb,#0d9488);color:#fff;box-shadow:0 8px 24px rgba(37,99,235,.35)}
a.secondary{background:rgba(255,255,255,.05);color:#f0f4ff;border:1px solid rgba(255,255,255,.12)}
a:hover{transform:translateY(-2px);filter:brightness(1.08)}
.meta{margin-top:20px;font-size:12px;color:#6b7795}
.preview{margin:20px 0;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.preview img{width:100%;display:block}
</style>
</head>
<body>
<div class="card">
  <div class="logo">PD</div>
  <h1>لوحة PharmaDash جاهزة للتحميل</h1>
  <p>اختر الملف المناسب — HTML تفاعلي للمتصفح، PNG جاهز للعرض، أو حزمة ZIP تحتوي على الاثنين.</p>
  <div class="preview">
    <img src="exports/pharmadash-dashboard-visualization.png" alt="معاينة اللوحة">
  </div>
  <div class="dl">
    <a class="btn primary" href="pharmadash-visualization.zip" download="pharmadash-visualization.zip">⬇️ تحميل الحزمة الكاملة (ZIP)</a>
    <a class="btn secondary" href="exports/pharmadash-canvas-visualization.html" download="pharmadash-canvas-visualization.html">📄 تحميل HTML التفاعلي</a>
    <a class="btn secondary" href="exports/pharmadash-dashboard-visualization.png" download="pharmadash-dashboard-visualization.png">🖼️ تحميل صورة PNG</a>
    <a class="btn secondary" href="exports/extracted_items_sales.xlsx" download="استخراج_الاصناف_المحددة.xlsx">📊 تحميل استخراج الأصناف المحددة (Excel)</a>
  </div>
  <div class="meta">PharmaDash Canvas Visualization · جاهز للاستخدام فوراً</div>
</div>
</body>
</html>
