<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NOSTRI — متابعة الأداء التجاري | مايو–يوليو 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NOSTRI Tracking Dashboard — board presentation polish
   يتابع: المبيعات · الكتابات · التحويل · Near-Expire · PureHerb
   ============================================================ */
:root{
  --teal:#0f766e; --teal-d:#06332e; --teal-m:#0b5c55; --teal-l:#5eead4; --heading:#06332e;
  --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#eef3f6; --card:#ffffff;
  --up:#15803d; --down:#b91c1c; --warn:#c2410c;
  --c05:#99f6e4; --c06:#2dd4bf; --c07:#0f766e;
  --grid:rgba(148,163,184,.18);
  --th-bg:#f3f7fa; --zebra:rgba(15,118,110,.035); --row-hover:#eef8f6; --tfoot-bg:#ecfdf5;
  --trend-line-color:rgba(15,23,42,.38);
  --mesh1:rgba(45,212,191,.12); --mesh2:rgba(6,51,46,.05); --mesh3:rgba(14,116,144,.06);
  --sh-ambient:0 14px 36px -18px rgba(15,23,42,.18);
  --sh-direct:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 12px -6px rgba(15,23,42,.08);
  --radius:18px; --ease:cubic-bezier(.22,1,.36,1);
}
:root[data-theme="dark"]{
  --teal-d:#041f1c; --heading:#99f6e4;
  --ink:#e8eef7; --muted:#9fb1c4; --line:#243247; --bg:#081018; --card:#101b2c;
  --c05:#5eead4; --c06:#2dd4bf; --c07:#14b8a6;
  --grid:rgba(148,163,184,.14);
  --th-bg:#162437; --zebra:rgba(255,255,255,.025); --row-hover:#1a2b42; --tfoot-bg:#123029;
  --trend-line-color:rgba(226,232,240,.55);
  --mesh1:rgba(45,212,191,.08); --mesh2:rgba(20,184,166,.06); --mesh3:rgba(56,189,248,.05);
  --sh-ambient:0 16px 40px -18px rgba(0,0,0,.55);
  --sh-direct:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 1px 3px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;
  background:
    radial-gradient(980px 460px at 100% -8%, var(--mesh1), transparent 58%),
    radial-gradient(820px 440px at -8% 12%, var(--mesh2), transparent 52%),
    radial-gradient(700px 380px at 55% 100%, var(--mesh3), transparent 55%),
    linear-gradient(180deg, #f7fafb 0%, var(--bg) 38%, var(--bg) 100%);
  background-attachment:fixed;
  color:var(--ink);direction:rtl;-webkit-font-smoothing:antialiased;
  line-height:1.55;
}
:root[data-theme="dark"] body{
  background:
    radial-gradient(980px 460px at 100% -8%, var(--mesh1), transparent 58%),
    radial-gradient(820px 440px at -8% 12%, var(--mesh2), transparent 52%),
    radial-gradient(700px 380px at 55% 100%, var(--mesh3), transparent 55%),
    var(--bg);
}
.wrap{max-width:1680px;margin:0 auto;padding:18px 28px 56px}

/* --- Board header --- */
header.top{
  background:
    linear-gradient(120deg, rgba(94,234,212,.14), transparent 42%),
    radial-gradient(ellipse at 70% 0%, #12897f 0%, #0a4f48 42%, #052925 100%);
  color:#fff;border-radius:22px;padding:26px 32px 24px;
  box-shadow:0 18px 40px -20px rgba(6,51,46,.55), inset 0 1px 0 rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  min-height:108px;
}
header.top::before{
  content:"";position:absolute;inset:auto -10% -55% auto;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle, rgba(94,234,212,.18), transparent 68%);pointer-events:none;
}
header.top::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg, transparent 30%, rgba(255,255,255,.05) 48%, transparent 66%);
  pointer-events:none;animation:sheen 7s var(--ease) infinite;
}
@keyframes sheen{0%,70%{transform:translateX(8%)}100%{transform:translateX(-55%)}}
.brand-block{text-align:center;position:relative;z-index:1;max-width:720px}
.brand{
  font-family:'Alexandria','IBM Plex Sans Arabic',sans-serif;
  font-size:clamp(34px,4.6vw,48px);font-weight:900;letter-spacing:.18em;
  line-height:1;margin:0;
  background:linear-gradient(180deg,#ffffff 20%,#99f6e4 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.18));
}
header.top h1{
  margin:10px 0 0;font-size:clamp(15px,1.7vw,18px);font-weight:600;letter-spacing:.2px;
  text-align:center;color:rgba(240,253,250,.92);
}
.period{
  display:inline-flex;align-items:center;gap:8px;margin-top:12px;
  padding:5px 14px;border-radius:999px;font-size:12.5px;font-weight:700;
  color:#ecfeff;background:rgba(4,30,27,.35);border:1px solid rgba(153,246,228,.28);
  letter-spacing:.2px;
}
.period::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal-l);box-shadow:0 0 0 3px rgba(94,234,212,.2)}
.badge{background:#dcfce7;color:#166534;font-weight:700;font-size:12px;padding:5px 12px;border-radius:999px}

/* --- Toolbar --- */
.mlegend{
  display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 0;font-size:13px;color:var(--muted);
  align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:16px;
  background:color-mix(in srgb,var(--card) 88%, transparent);
  backdrop-filter:blur(8px);box-shadow:var(--sh-direct);
}
.mlegend b{color:var(--ink);font-weight:700}
.month-chip{
  display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;
  background:color-mix(in srgb,var(--card) 70%, var(--bg));border:1px solid var(--line);
  font-weight:600;color:var(--ink);font-size:12.5px;
}
.month-chip.current{border-color:color-mix(in srgb,var(--teal) 45%, var(--line));
  background:color-mix(in srgb,var(--teal) 10%, var(--card))}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;
  box-shadow:inset 0 0 0 1px rgba(15,23,42,.08)}
.spacer{flex:1}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.toggle button{border:0;background:transparent;padding:8px 16px;font-family:inherit;font-size:13px;
  font-weight:600;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.toggle button.active{background:var(--teal);color:#fff}
.toggle button:hover:not(.active){color:var(--teal)}

/* --- Edge sidebar + collapse --- */
#menuToggle{
  position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;
  width:42px;height:42px;border-radius:12px;font-size:18px;line-height:1;cursor:pointer;
  z-index:2;transition:background .15s,transform .15s;backdrop-filter:blur(6px)
}
#menuToggle:hover{background:rgba(255,255,255,.26);transform:translateY(-50%) scale(1.04)}
.layout{display:flex;gap:14px;align-items:flex-start;margin-top:16px}
.main{flex:1;min-width:0}
.sidebar{
  flex:0 0 168px;display:flex;flex-direction:column;gap:4px;position:sticky;top:12px;
  margin-inline-start:-6px;padding:8px 6px;border:1px solid var(--line);border-radius:16px;
  background:color-mix(in srgb,var(--card) 94%, transparent);box-shadow:var(--sh-direct);
}
.sidebar .nav-label{
  font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;
  padding:2px 8px 6px;
}
.sidebar button{
  border:1px solid transparent;background:transparent;color:var(--muted);
  padding:10px 10px;border-radius:11px;font-family:inherit;font-size:12.5px;font-weight:700;
  cursor:pointer;transition:all .18s var(--ease);text-align:right;width:100%;position:relative;
}
.sidebar button::before{
  content:"";position:absolute;inset-inline-start:0;top:22%;bottom:22%;width:3px;border-radius:0 3px 3px 0;
  background:transparent;transition:background .18s
}
.sidebar button:hover{color:var(--teal);background:color-mix(in srgb,var(--teal) 8%, transparent)}
.sidebar button:hover::before{background:var(--teal-l)}
.sidebar button.active{
  color:#fff;background:linear-gradient(135deg,var(--teal) 0%,var(--teal-m) 100%);
  box-shadow:0 8px 16px -10px rgba(15,118,110,.7);
}
.sidebar button.active::before{background:var(--teal-l)}
body.nav-collapsed .sidebar{display:none}
body.nav-collapsed .layout{gap:0}
@media(max-width:820px){
  .wrap{padding:14px 14px 48px}
  header.top{padding:22px 56px 20px;min-height:96px;border-radius:18px}
  .layout{flex-direction:column}
  .sidebar{
    flex-basis:auto;width:100%;flex-direction:row;flex-wrap:wrap;position:static;
    margin:0;padding:8px;
  }
  .sidebar .nav-label{width:100%}
  .sidebar button{width:auto;flex:1 1 auto;text-align:center}
}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--muted);
  padding:8px 14px;border-radius:999px;font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s}
.chips button:hover{color:var(--teal);border-color:var(--teal-l)}
.chips button.active{background:var(--teal-d);color:#fff;border-color:var(--teal-d);
  box-shadow:0 6px 14px -8px rgba(6,51,46,.55)}
.chips button.pending{opacity:.55}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px 16px;
  box-shadow:var(--sh-ambient),var(--sh-direct);position:relative;overflow:hidden;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--teal-l),var(--teal))}
.kpi::after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:90px;height:90px;
  border-radius:50%;background:radial-gradient(circle, color-mix(in srgb,var(--teal) 10%, transparent), transparent 70%);
  pointer-events:none}
.kpi:hover{transform:translateY(-3px);box-shadow:0 16px 28px -18px rgba(15,23,42,.22),var(--sh-direct)}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.1px}
.kpi .val{font-family:'Alexandria','IBM Plex Sans Arabic',sans-serif;
  font-size:clamp(24px,2.4vw,30px);font-weight:800;margin-top:8px;line-height:1.05;letter-spacing:-.4px;
  color:var(--ink)}
.kpi .unit{font-size:13px;color:var(--muted);font-weight:600;font-family:'IBM Plex Sans Arabic',sans-serif}
.kpi .delta{font-size:12.5px;font-weight:700;margin-top:10px;display:inline-flex;align-items:center;gap:4px}
.kpi .delta.up{color:var(--up)} .kpi .delta.down{color:var(--down)} .kpi .delta.flat{color:var(--muted)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 20px;
  box-shadow:var(--sh-ambient),var(--sh-direct);margin-bottom:16px;transition:box-shadow .2s var(--ease)}
.panel:hover{box-shadow:0 18px 36px -20px rgba(15,23,42,.2),var(--sh-direct)}
.panel h2{
  margin:0 0 14px;font-size:16px;color:var(--heading);font-weight:700;
  font-family:'Alexandria','IBM Plex Sans Arabic',sans-serif;letter-spacing:.1px;
  display:flex;align-items:center;gap:10px;
}
.panel h2::before{
  content:"";width:8px;height:8px;border-radius:50%;flex:0 0 auto;
  background:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 16%, transparent);
}
.panel .hint{color:var(--muted);font-size:13px;margin:0 0 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}

.chart{display:flex;align-items:flex-end;gap:18px;height:236px;padding:28px 8px 0;
  border-bottom:2px solid var(--line);position:relative;border-radius:4px}
.chart::before{content:"";position:absolute;left:8px;right:8px;top:28px;bottom:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(to top,var(--grid) 0 1px,transparent 1px 25%)}
.chgroup{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:8px;height:100%;position:relative;z-index:1}
.bar{width:40px;border-radius:10px 10px 3px 3px;position:relative;transition:height .45s var(--ease);min-height:2px;
  box-shadow:0 8px 14px -8px rgba(15,23,42,.35)}
.bar::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 40%,rgba(0,0,0,.1))}
.bar .cap{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap}
.chlabels{display:flex;gap:18px;margin-top:10px}
.chlabels span{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--muted)}

table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
th,td{padding:11px 13px;text-align:right;border-bottom:1px solid var(--line)}
th{background:var(--th-bg);font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.02em;
  position:sticky;top:0;z-index:1}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr:hover{background:var(--row-hover)}
tbody td:first-child{font-weight:600}
tfoot td{font-weight:700;background:var(--tfoot-bg);border-top:2px solid var(--teal-l);border-bottom:0}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.tbl-wrap{overflow:auto;border-radius:14px;border:1px solid var(--line);max-width:100%}

.conv{display:flex;align-items:center;gap:10px}
.conv .track{flex:1;height:10px;background:color-mix(in srgb,var(--line) 80%, transparent);
  border-radius:999px;overflow:hidden}
.conv .fill{height:100%;border-radius:999px}
.pill{font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.g{background:#dcfce7;color:#166534}.pill.y{background:#fef9c3;color:#854d0e}.pill.r{background:#fee2e2;color:#991b1b}
:root[data-theme="dark"] .pill.g{background:#14532d;color:#bbf7d0}
:root[data-theme="dark"] .pill.y{background:#713f12;color:#fde68a}
:root[data-theme="dark"] .pill.r{background:#7f1d1d;color:#fecaca}
.trend{font-size:12px;font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:28px;line-height:1.8;
  padding-top:18px;border-top:1px solid var(--line)}
.note{border-radius:14px;padding:12px 16px;font-size:13px;margin-bottom:16px}
.note.demo{background:#fffbeb;border:1px solid #fde68a;color:#854d0e}
.note.real{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.note.info{background:#ecfeff;border:1px solid #a5f3fc;color:#155e75}
.pend{text-align:center;color:var(--muted);padding:48px 20px}
.pend .big{font-size:36px;opacity:.7}

/* --- entrance motion --- */
@keyframes fadeRise{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
@keyframes barRise{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}
@keyframes brandIn{from{opacity:0;letter-spacing:.32em;filter:blur(4px)}to{opacity:1;letter-spacing:.18em;filter:blur(0)}}
.brand{animation:brandIn .7s var(--ease) both}
.kpi{animation:fadeRise .45s var(--ease) both}
.kpis .kpi:nth-child(2){animation-delay:.05s}
.kpis .kpi:nth-child(3){animation-delay:.10s}
.kpis .kpi:nth-child(4){animation-delay:.15s}
.kpis .kpi:nth-child(5){animation-delay:.20s}
.kpis .kpi:nth-child(6){animation-delay:.25s}
.panel{animation:fadeRise .5s var(--ease) both}
.bar{animation:barRise .55s cubic-bezier(.2,.75,.2,1) both}
.chart .chgroup:nth-child(1) .bar{animation-delay:.04s}
.chart .chgroup:nth-child(2) .bar{animation-delay:.12s}
.chart .chgroup:nth-child(3) .bar{animation-delay:.20s}
.chart .chgroup:nth-child(4) .bar{animation-delay:.28s}
.chart .chgroup:nth-child(5) .bar{animation-delay:.36s}
.chart .chgroup:nth-child(6) .bar{animation-delay:.44s}

/* --- trend delta chips --- */
.trend-chip{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:999px;
  font-weight:700;font-size:12px;white-space:nowrap;line-height:1.5}
.trend-chip.up{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}
.trend-chip.down{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)}
.trend-chip.flat{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted)}

/* --- control buttons / inputs --- */
.ctrlbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);width:38px;height:38px;
  border-radius:12px;font-size:15px;cursor:pointer;line-height:1;transition:.15s}
.ctrlbtn:hover{color:var(--teal);border-color:var(--teal-l);transform:translateY(-1px)}
#neSearch{background:var(--card);color:var(--ink);outline:none}
#neSearch:focus{border-color:var(--teal)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 18%, transparent)}

/* --- chart tooltip + trend line --- */
#barTip{position:fixed;z-index:50;pointer-events:none;background:var(--teal-d);color:#fff;
  padding:6px 11px;border-radius:9px;font-size:12px;font-weight:700;opacity:0;transition:opacity .12s;
  transform:translate(-50%,-100%);white-space:nowrap;box-shadow:var(--sh-direct)}
.trendline polyline{stroke:var(--trend-line-color)}
.trendline circle{stroke:var(--trend-line-color);fill:var(--card)}

@media (prefers-reduced-motion:reduce){
  .kpi,.panel,.bar,.brand,header.top::after{animation:none}
}
@media print{
  body{background:#fff!important;color:#0f172a}
  #menuToggle,.sidebar,.chips,#metricToggle,#themeBtn,#printBtn,.spacer,.mlegend .toggle{display:none!important}
  .layout{display:block;margin-top:8px}
  .main{width:100%}
  .mlegend{box-shadow:none;backdrop-filter:none;border-color:#cbd5e1;background:#fff;padding:8px 0;border:0}
  header.top{
    background:#06332e!important;color:#fff;box-shadow:none;border-radius:12px;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;min-height:auto;padding:18px
  }
  header.top::before,header.top::after{display:none}
  .brand{-webkit-text-fill-color:#fff;background:none;filter:none;color:#fff}
  .panel,.kpi{box-shadow:none;break-inside:avoid;border:1px solid #cbd5e1}
  .kpi:hover,.panel:hover{transform:none;box-shadow:none}
  .tbl-wrap{overflow:visible;border-color:#cbd5e1}
  th{position:static}
  .foot{border:0}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <button id="menuToggle" aria-label="طي القائمة" title="طي / فتح القائمة">☰</button>
    <div class="brand-block">
      <div class="brand">NOSTRI</div>
      <h1>الإدارة التجارية — د. السيد حسن</h1>
      <div class="period">متابعة الأداء · مايو ← يوليو 2026</div>
    </div>
  </header>

  <div class="mlegend">
    <span class="month-chip"><span class="dot" style="background:var(--c05)"></span><b>مايو 05</b></span>
    <span class="month-chip"><span class="dot" style="background:var(--c06)"></span><b>يونيو 06</b></span>
    <span class="month-chip current"><span class="dot" style="background:var(--c07)"></span><b>يوليو 07 · الحالي</b></span>
    <span class="spacer"></span>
    <span class="toggle" id="metricToggle">
      <button data-metric="units" class="active">وحدات مباعة</button>
      <button data-metric="value">قيمة (ريال)</button>
    </span>
    <button id="themeBtn" class="ctrlbtn" title="الوضع الداكن" aria-label="تبديل الوضع الداكن">◐</button>
    <button id="printBtn" class="ctrlbtn" title="طباعة / PDF" aria-label="طباعة">⎙</button>
  </div>

  <div class="layout">
    <nav class="sidebar" id="tabs" aria-label="أقسام التقرير">
      <div class="nav-label">أقسام التقرير</div>
      <button data-tab="sales" class="active">مبيعات Nostri</button>
      <button data-tab="share">المشاركة</button>
      <button data-tab="writings">الكتابات</button>

/* ==================== helpers ==================== */
const M=DATA.months, ML=DATA.monthLabel;
const CUR="07",PREV="06",FIRST="05";
const COL={"05":"var(--c05)","06":"var(--c06)","07":"var(--c07)"};
const state={tab:"sales",scope:"all",metric:"units"};
const fmt=n=>n==null?"—":Number(n).toLocaleString("en-US",{maximumFractionDigits:0});
function delta(cur,prev){
  if(prev==null||prev===0) return {t:"—",c:"flat"};
  const d=Math.round(((cur-prev)/prev)*100);
  return {t:(d>0?"▲ +":d<0?"▼ ":"● ")+d+"%",c:d>0?"up":d<0?"down":"flat"};
}
const MK={units:"u",value:"v"};
function itemVals(it,scope,metric){ return it[scope] ? it[scope][MK[metric]] : null; }
function itemTotals(scope,metric){ // {05,06,07} totals across items for a scope
  const o={}; M.forEach(m=>o[m]=DATA.nostriItems.reduce((a,it)=>{
    const v=itemVals(it,scope,metric); return a+((v&&v[m])||0);},0)); return o;
}
function barChart(vals,unit){
  const max=Math.max(...M.map(m=>vals[m]||0),1);
  const bars=M.map(m=>{
    const h=Math.max((vals[m]||0)/max*100,1.5);
    return `<div class="chgroup"><div class="bar" style="height:${h}%;background:${COL[m]}">
      <span class="cap" style="color:${COL[m]}">${fmt(vals[m])}</span></div></div>`;
  }).join("");
  const labels=M.map(m=>`<span>${ML[m]}</span>`).join("");
  return `<div class="chart">${bars}</div><div class="chlabels">${labels}</div>`;
}
function scopeLabel(s){return s==="all"?"كل الصيدليات":"صيدلية "+s;}
function metricLabel(){return state.metric==="units"?"وحدة":"ريال";}
function convClass(p){return p>=90?"g":p>=60?"y":"r";}

      <div class="delta ${dShare>0?'up':dShare<0?'down':'flat'}">${dShare>0?'▲ +':dShare<0?'▼ ':'● '}${dShare} نقطة مقابل يونيو</div></div>

    <div class="kpi"><div class="lbl">اتجاه المشاركة 05→07</div>
      <div class="val ${sCur>=sFirst?'up':'down'}">${sFirst}% ← ${sCur}%</div>
      <div class="delta ${sCur>=sFirst?'up':'down'}">${sCur>=sFirst?'ارتفاع':'انخفاض'} النصيب</div></div></div>`;

  const maxT=Math.max(...M.map(m=>all[m]),1);

  const rows=M.map(m=>{
    const d=m===FIRST?{t:"—",c:"flat"}:(()=>{const p=m===CUR?PREV:FIRST;const dd=Math.round(share[m]-share[p]);
      return {t:(dd>0?"▲ +":dd<0?"▼ ":"● ")+dd+" نقطة",c:dd>0?"up":dd<0?"down":"flat"};})();
    return `<tr><td>${ML[m]}</td><td class="num">${fmt(intr[m])}</td><td class="num">${fmt(ext[m])}</td>

function itemWr(it,scope){ return it.wr && it.wr[scope] ? it.wr[scope] : null; }
function wrTotals(scope){ const o={}; M.forEach(m=>o[m]=DATA.nostriItems.reduce((a,it)=>{
  const w=itemWr(it,scope); return a+((w&&w[m])||0);},0)); return o; }
V.writings=()=>{
  const scope=state.scope;
  if(!DATA.writingsReady[scope]){
    return `<div class="panel"><div class="pend"><div class="big">✍️</div>
      <h2>كتابات ${scopeLabel(scope)} — بانتظار الملف</h2></div></div>`;
  }
  const w=wrTotals(scope), dCur=delta(w[CUR],w[PREV]), dTot=delta(w[CUR],w[FIRST]);
  const note=`<div class="note real">✔ <b>كتابات حقيقية</b> — ${scopeLabel(scope)}، من ملفات الأطباء 05/06/07.
     كل «كتابة» = سطر وصفة لأحد أصناف نوستري (كل الحالات).</div>`;
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="lbl">كتابات يوليو 07</div><div class="val">${fmt(w[CUR])}</div>
      <div class="delta ${dCur.c}">${dCur.t} مقابل يونيو</div></div>
    <div class="kpi"><div class="lbl">يونيو 06</div><div class="val">${fmt(w[PREV])}</div></div>
    <div class="kpi"><div class="lbl">مايو 05</div><div class="val">${fmt(w[FIRST])}</div></div>
    <div class="kpi"><div class="lbl">التغير 05←07</div><div class="val ${dTot.c}">${dTot.t.replace(/[▲▼●] /,"")}</div>
      <div class="delta ${dTot.c}">${dTot.c==="up"?"تحسّن":dTot.c==="down"?"تراجع":"ثبات"} الكتابات</div></div></div>`;
  const chart=`<div class="panel"><h2>تسلسل الكتابات — ${scopeLabel(scope)}</h2>${barChart(w)}</div>`;
  const rows=DATA.nostriItems.map(it=>{
    const x=itemWr(it,scope)||{}, d=delta(x[CUR],x[PREV]);
    return `<tr><td>${it.name}</td><td class="num">${fmt(x[FIRST])}</td>
      <td class="num">${fmt(x[PREV])}</td><td class="num">${fmt(x[CUR])}</td>
      <td class="trend ${d.c}">${d.t}</td></tr>`;}).join("");
  const table=`<div class="panel"><h2>الكتابات لكل صنف — ${scopeLabel(scope)}</h2>
    <div class="tbl-wrap"><table><thead><tr><th>الصنف</th><th>مايو</th><th>يونيو</th><th>يوليو</th><th>التغير ش/ش</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>الإجمالي</td><td class="num">${fmt(w[FIRST])}</td><td class="num">${fmt(w[PREV])}</td>
    <td class="num">${fmt(w[CUR])}</td><td class="trend ${dCur.c}">${dCur.t}</td></tr></tfoot></table></div></div>`;
  return kpis+chart+table;
};

/* ---- 3. Conversion (REAL — ص1 & ص18) ---- */
V.conversion=()=>{
  const scope=state.scope;
  if(!DATA.writingsReady[scope]){
    return `<div class="panel"><div class="pend"><div class="big">🔄</div>
      <h2>تحويل ${scopeLabel(scope)} — بانتظار الكتابات</h2></div></div>`;
  }
  const note=`<div class="note real">🔄 <b>التحويل الفعلي — ${scopeLabel(scope)}</b> = (وحدات مباعة ÷ عدد الكتابات) × 100.
    كلاهما حقيقي. أكثر من 100% يعني بيع أكبر من الكتابة (صرف متعدد الوحدات أو بيع بدون وصفة).
    ⏳ باقي الصيدليات تدخل هنا فور وصول كتاباتها.</div>`;
  const soldTot=itemTotals(scope,"units"), wr=wrTotals(scope);
  // monthly totals
  const mrows=M.map(m=>{
    const cv=wr[m]?Math.round(soldTot[m]/wr[m]*100):0, c=convClass(cv);
    return `<tr><td>${ML[m]}</td><td class="num">${fmt(wr[m])}</td><td class="num">${fmt(soldTot[m])}</td>
      <td><span class="pill ${c}">${cv}%</span></td>
      <td style="width:160px"><div class="conv"><div class="track">

      </div></div></td></tr>`;}).join("");
  const cvCur=wr[CUR]?Math.round(soldTot[CUR]/wr[CUR]*100):0;
  const cvPrev=wr[PREV]?Math.round(soldTot[PREV]/wr[PREV]*100):0;
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="lbl">تحويل يوليو 07</div><div class="val">${cvCur}%</div>
      <div class="delta ${cvCur>=cvPrev?'up':'down'}">${cvCur-cvPrev>0?'▲ +':'▼ '}${cvCur-cvPrev} نقطة مقابل يونيو</div></div>
    <div class="kpi"><div class="lbl">كتابات 07</div><div class="val">${fmt(wr[CUR])}</div></div>
    <div class="kpi"><div class="lbl">وحدات مباعة 07</div><div class="val">${fmt(soldTot[CUR])}</div></div></div>`;
  const mtable=`<div class="panel"><h2>التحويل الشهري — ${scopeLabel(scope)}</h2>
    <div class="tbl-wrap"><table><thead><tr><th>الشهر</th><th>كتابات</th><th>وحدات مباعة</th>
    <th>التحويل %</th><th></th></tr></thead><tbody>${mrows}</tbody></table></div></div>`;
  // per-item July
  const irows=DATA.nostriItems.map(it=>{
    const wv=(itemWr(it,scope)||{})[CUR]||0, uv=(itemVals(it,scope,"units")||{})[CUR]||0;
    const cv=wv?Math.round(uv/wv*100):0, c=convClass(cv);
    return `<tr><td>${it.name}</td><td class="num">${fmt(wv)}</td><td class="num">${fmt(uv)}</td>
      <td><span class="pill ${c}">${wv?cv+'%':'—'}</span></td></tr>`;}).join("");
  const itable=`<div class="panel"><h2>التحويل لكل صنف — يوليو 07 (${scopeLabel(scope)})</h2>
    <div class="tbl-wrap"><table><thead><tr><th>الصنف</th><th>كتابات</th><th>وحدات مباعة</th><th>التحويل %</th></tr></thead>

/* ---- 5. PureHerb (REAL sales — 07: ص1/ص7/ص18 + إجمالي كل الصيدليات) ---- */
V.pureherb=()=>{

    <div class="kpi"><div class="lbl">كل الصيدليات — يوليو 07</div><div class="val">${fmt(uAll)} <span class="unit">وحدة</span></div>
      <div class="delta flat">${fmt(vAll)} ريال</div></div>

    <div class="kpi"><div class="lbl">الخارجية</div><div class="val">${fmt(uExt)} <span class="unit">وحدة</span></div>

        <span class="cap" style="color:${c}">${fmt(u)}</span></div></div>`;

    <div class="chlabels"><span>الداخلية ${shUv}%</span><span>الخارجية ${100-shUv}%</span><span>كل الصيدليات</span></div></div>`;
  const mx=Math.max(u1,u7,u18,1);
  const barP=(u,c)=>`<div class="chgroup"><div class="bar" style="height:${Math.max(u/mx*100,2)}%;background:${c}">
        <span class="cap" style="color:${c}">${fmt(u)}</span></div></div>`;
  const chart=`<div class="panel"><h2>مبيعات PureHerb حسب الصيدلية الداخلية — يوليو 07 (وحدات)</h2>
    <div class="chart">${barP(u1,'var(--c05)')}${barP(u7,'var(--c06)')}${barP(u18,'var(--c07)')}</div>
    <div class="chlabels"><span>صيدلية 1</span><span>صيدلية 7</span><span>صيدلية 18</span></div></div>`;
  const cell=x=>x==null?"—":fmt(x);
  const rows=items.map(it=>{
    const tu=(it.u["1"]||0)+(it.u["7"]||0)+(it.u["18"]||0), tv=(it.v["1"]||0)+(it.v["7"]||0)+(it.v["18"]||0);
    return `<tr><td>${it.name}<br><span style="color:var(--muted);font-weight:500;font-size:12px">${it.code}</span></td>
      <td class="num">${cell(it.u["1"])}</td><td class="num">${cell(it.u["7"])}</td><td class="num">${cell(it.u["18"])}</td>

  const table=`<div class="panel"><h2>تفصيلي أصناف PureHerb — يوليو 07</h2>

    <tbody>${crows}</tbody></table></div></div>`;
  return kpis+shareChart+chart+table+conv;
};

/* ==================== render ==================== */
function needsScope(t){return t==="sales"||t==="writings"||t==="conversion"||t==="doctors";}
function scopeReadyMap(t){return (t==="writings"||t==="conversion"||t==="doctors")?DATA.writingsReady:DATA.pharmacyReady;}
function usesMetric(t){return t==="sales"||t==="share";}
function render(){
  const host=document.getElementById("view");
  let chips="";
  if(needsScope(state.tab)){
    const readyMap=scopeReadyMap(state.tab);
    const scopes=(state.tab==="doctors")?["1","7","18"]:["1","7","18","all"];
    chips=`<div class="chips">${scopes.map(s=>{
      const pend=!readyMap[s];
      return `<button data-scope="${s}" class="${state.scope===s?'active':''} ${pend?'pending':''}">${scopeLabel(s)}${pend?' ⏳':''}</button>`;
    }).join("")}</div>`;
  }
  host.innerHTML=chips+V[state.tab]();
  host.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{state.scope=b.dataset.scope;render();});
  // show/hide metric toggle
  document.getElementById("metricToggle").style.display=usesMetric(state.tab)?"inline-flex":"none";
}
document.querySelectorAll("#tabs button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); state.tab=b.dataset.tab;
    if(state.tab==="sales") state.scope="all";
    else if(needsScope(state.tab) && !scopeReadyMap(state.tab)[state.scope]) state.scope="1";
    render();
  };
});
document.querySelectorAll("#metricToggle button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("#metricToggle button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); state.metric=b.dataset.metric; render();
  };
});
document.getElementById("menuToggle").onclick=()=>document.body.classList.toggle("nav-collapsed");
render();

  const view=document.getElementById("view");
  const tip=document.createElement("div"); tip.id="barTip"; document.body.appendChild(tip);
  view.addEventListener("mouseover",e=>{const b=e.target.closest(".bar");if(!b)return;
    const c=b.querySelector(".cap");tip.textContent=c?c.textContent.trim():"";tip.style.opacity="1";});
  view.addEventListener("mousemove",e=>{if(tip.style.opacity==="1"){
    tip.style.left=e.clientX+"px";tip.style.top=(e.clientY-12)+"px";}});
  view.addEventListener("mouseout",e=>{if(e.target.closest(".bar"))tip.style.opacity="0";});
  function chipTrends(){
    view.querySelectorAll("td.trend:not([data-chip])").forEach(td=>{
      td.setAttribute("data-chip","1");
      const txt=td.textContent.trim(); if(!txt||txt==="—")return;
      const cls=td.classList.contains("up")?"up":td.classList.contains("down")?"down":"flat";
      const sp=document.createElement("span"); sp.className="trend-chip "+cls; sp.textContent=txt;
      td.textContent=""; td.appendChild(sp);
    });
  }
  function trendLines(){
    view.querySelectorAll(".chart").forEach(chart=>{
      const old=chart.querySelector("svg.trendline"); if(old)old.remove();
      const groups=[...chart.children].filter(c=>c.classList&&c.classList.contains("chgroup"));
      if(groups.length!==3)return;
      const bars=groups.map(g=>g.querySelectorAll(".bar"));
      if(bars.some(b=>b.length!==1))return;
      const cr=chart.getBoundingClientRect(); if(!cr.width)return;
      const pts=bars.map(b=>{const r=b[0].getBoundingClientRect();
        return[r.left+r.width/2-cr.left, r.top-cr.top];});
      const NS="http://www.w3.org/2000/svg";
      const svg=document.createElementNS(NS,"svg"); svg.setAttribute("class","trendline");
      svg.setAttribute("width",cr.width); svg.setAttribute("height",cr.height);
      svg.style.cssText="position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible";
      const pl=document.createElementNS(NS,"polyline");
      pl.setAttribute("points",pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" "));
      pl.setAttribute("fill","none"); pl.setAttribute("stroke-width","2");
      pl.setAttribute("stroke-linecap","round"); pl.setAttribute("stroke-linejoin","round");
      svg.appendChild(pl);
      pts.forEach(p=>{const c=document.createElementNS(NS,"circle");
        c.setAttribute("cx",p[0].toFixed(1));c.setAttribute("cy",p[1].toFixed(1));
        c.setAttribute("r","3.2");c.setAttribute("stroke-width","2");svg.appendChild(c);});
      chart.appendChild(svg);
    });
  }
  function enhance(){try{chipTrends();}catch(e){} setTimeout(()=>{try{trendLines();}catch(e){}},860);}
  try{new MutationObserver(enhance).observe(view,{childList:true});}catch(e){}
  enhance();
})();
</script>
</body>
</html>
