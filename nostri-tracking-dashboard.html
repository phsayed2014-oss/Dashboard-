<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NOSTRI — متابعة الأداء التجاري | مايو–يوليو 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NOSTRI Tracking Dashboard — board presentation polish
   يتابع: المبيعات · الكتابات · التحويل · Near-Expire · PureHerb
   ============================================================ */
:root{
  --teal:#0f766e; --teal-d:#06332e; --teal-m:#0b5c55; --teal-l:#5eead4; --heading:#06332e;
  --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#eef3f6; --card:#ffffff;
  --up:#15803d; --down:#b91c1c; --warn:#c2410c;
  --c05:#99f6e4; --c06:#2dd4bf; --c07:#0f766e; --c08:#0e7490;
  --grid:rgba(148,163,184,.18);
  --th-bg:#f3f7fa; --zebra:rgba(15,118,110,.035); --row-hover:#eef8f6; --tfoot-bg:#ecfdf5;
  --trend-line-color:rgba(15,23,42,.38);
  --mesh1:rgba(45,212,191,.12); --mesh2:rgba(6,51,46,.05); --mesh3:rgba(14,116,144,.06);
  --sh-ambient:0 14px 36px -18px rgba(15,23,42,.18);
  --sh-direct:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 12px -6px rgba(15,23,42,.08);
  --radius:18px; --ease:cubic-bezier(.22,1,.36,1);
}
:root[data-theme="dark"]{
  --teal-d:#041f1c; --heading:#99f6e4;
  --ink:#e8eef7; --muted:#9fb1c4; --line:#243247; --bg:#081018; --card:#101b2c;
  --c05:#5eead4; --c06:#2dd4bf; --c07:#14b8a6; --c08:#22d3ee;
  --grid:rgba(148,163,184,.14);
  --th-bg:#162437; --zebra:rgba(255,255,255,.025); --row-hover:#1a2b42; --tfoot-bg:#123029;
  --trend-line-color:rgba(226,232,240,.55);
  --mesh1:rgba(45,212,191,.08); --mesh2:rgba(20,184,166,.06); --mesh3:rgba(56,189,248,.05);
  --sh-ambient:0 16px 40px -18px rgba(0,0,0,.55);
  --sh-direct:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 1px 3px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;
  background:
    radial-gradient(980px 460px at 100% -8%, var(--mesh1), transparent 58%),
    radial-gradient(820px 440px at -8% 12%, var(--mesh2), transparent 52%),
    radial-gradient(700px 380px at 55% 100%, var(--mesh3), transparent 55%),
    linear-gradient(180deg, #f7fafb 0%, var(--bg) 38%, var(--bg) 100%);
  background-attachment:fixed;
  color:var(--ink);direction:rtl;-webkit-font-smoothing:antialiased;
  line-height:1.55;
}
:root[data-theme="dark"] body{
  background:
    radial-gradient(980px 460px at 100% -8%, var(--mesh1), transparent 58%),
    radial-gradient(820px 440px at -8% 12%, var(--mesh2), transparent 52%),
    radial-gradient(700px 380px at 55% 100%, var(--mesh3), transparent 55%),
    var(--bg);
}
.wrap{max-width:1680px;margin:0 auto;padding:18px 28px 56px}

/* --- Board header --- */
header.top{
  background:
    linear-gradient(120deg, rgba(94,234,212,.14), transparent 42%),
    radial-gradient(ellipse at 70% 0%, #12897f 0%, #0a4f48 42%, #052925 100%);
  color:#fff;border-radius:22px;padding:26px 64px 24px 64px;
  box-shadow:0 18px 40px -20px rgba(6,51,46,.55), inset 0 1px 0 rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  min-height:108px;
}
header.top::before{
  content:"";position:absolute;inset:auto -10% -55% auto;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle, rgba(94,234,212,.18), transparent 68%);pointer-events:none;
}
header.top::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg, transparent 30%, rgba(255,255,255,.05) 48%, transparent 66%);
  pointer-events:none;animation:sheen 7s var(--ease) infinite;
}
@keyframes sheen{0%,70%{transform:translateX(8%)}100%{transform:translateX(-55%)}}
.brand-block{text-align:center;position:relative;z-index:1;max-width:960px;width:100%}
.brand{
  font-family:'Alexandria','IBM Plex Sans Arabic',sans-serif;
  font-size:clamp(30px,4.4vw,46px);font-weight:900;line-height:1;margin:0;
  display:flex;justify-content:space-between;width:100%;padding:0 .35em;direction:ltr;
}
.brand span{
  background:linear-gradient(180deg,#ffffff 20%,#99f6e4 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.18));
}
header.top h1{
  margin:10px 0 0;font-size:clamp(15px,1.7vw,18px);font-weight:600;letter-spacing:.2px;
  text-align:center;color:rgba(240,253,250,.92);
}
.period{
  display:inline-flex;align-items:center;gap:8px;margin-top:12px;
  padding:5px 14px;border-radius:999px;font-size:12.5px;font-weight:700;
  color:#ecfeff;background:rgba(4,30,27,.35);border:1px solid rgba(153,246,228,.28);
  letter-spacing:.2px;
}
.period::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal-l);box-shadow:0 0 0 3px rgba(94,234,212,.2)}
.badge{background:#dcfce7;color:#166534;font-weight:700;font-size:12px;padding:5px 12px;border-radius:999px}

/* --- Toolbar --- */
.mlegend{
  display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 0;font-size:13px;color:var(--muted);
  align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:16px;
  background:color-mix(in srgb,var(--card) 88%, transparent);
  backdrop-filter:blur(8px);box-shadow:var(--sh-direct);
}
.mlegend b{color:var(--ink);font-weight:700}
.month-chip{
  display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;
  background:color-mix(in srgb,var(--card) 70%, var(--bg));border:1px solid var(--line);
  font-weight:600;color:var(--ink);font-size:12.5px;
}
.month-chip.current{border-color:color-mix(in srgb,var(--teal) 45%, var(--line));
  background:color-mix(in srgb,var(--teal) 10%, var(--card))}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;
  box-shadow:inset 0 0 0 1px rgba(15,23,42,.08)}
.spacer{flex:1}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.toggle button{border:0;background:transparent;padding:8px 16px;font-family:inherit;font-size:13px;
  font-weight:600;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.toggle button.active{background:var(--teal);color:#fff}
.toggle button:hover:not(.active){color:var(--teal)}

/* --- Edge sidebar + collapse --- */
#menuToggle{
  position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;
  width:42px;height:42px;border-radius:12px;font-size:18px;line-height:1;cursor:pointer;
  z-index:2;transition:background .15s,transform .15s;backdrop-filter:blur(6px)
}
#menuToggle:hover{background:rgba(255,255,255,.26);transform:translateY(-50%) scale(1.04)}
.layout{display:flex;gap:14px;align-items:flex-start;margin-top:16px}
.main{flex:1;min-width:0}
.sidebar{
  flex:0 0 168px;display:flex;flex-direction:column;gap:4px;position:sticky;top:12px;
  margin-inline-start:-6px;padding:8px 6px;border:1px solid var(--line);border-radius:16px;
  background:color-mix(in srgb,var(--card) 94%, transparent);box-shadow:var(--sh-direct);
}
.sidebar .nav-label{
  font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;
  padding:2px 8px 6px;
}
.sidebar button{
  border:1px solid transparent;background:transparent;color:var(--muted);
  padding:10px 10px;border-radius:11px;font-family:inherit;font-size:12.5px;font-weight:700;
  cursor:pointer;transition:all .18s var(--ease);text-align:right;width:100%;position:relative;
}
.sidebar button::before{
  content:"";position:absolute;inset-inline-start:0;top:22%;bottom:22%;width:3px;border-radius:0 3px 3px 0;
  background:transparent;transition:background .18s
}
.sidebar button:hover{color:var(--teal);background:color-mix(in srgb,var(--teal) 8%, transparent)}
.sidebar button:hover::before{background:var(--teal-l)}
.sidebar button.active{
  color:#fff;background:linear-gradient(135deg,var(--teal) 0%,var(--teal-m) 100%);
  box-shadow:0 8px 16px -10px rgba(15,118,110,.7);
}
.sidebar button.active::before{background:var(--teal-l)}
body.nav-collapsed .sidebar{display:none}
body.nav-collapsed .layout{gap:0}
@media(max-width:820px){
  .wrap{padding:14px 14px 48px}
  header.top{padding:22px 56px 20px;min-height:96px;border-radius:18px}
  .layout{flex-direction:column}
  .sidebar{
    flex-basis:auto;width:100%;flex-direction:row;flex-wrap:wrap;position:static;
    margin:0;padding:8px;
  }
  .sidebar .nav-label{width:100%}
  .sidebar button{width:auto;flex:1 1 auto;text-align:center}
}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;justify-content:center}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--muted);
  padding:8px 14px;border-radius:999px;font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s}
.chips button:hover{color:var(--teal);border-color:var(--teal-l)}
.chips button.active{background:var(--teal-d);color:#fff;border-color:var(--teal-d);
  box-shadow:0 6px 14px -8px rgba(6,51,46,.55)}
.chips button.pending{opacity:.55}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px 16px;
  box-shadow:var(--sh-ambient),var(--sh-direct);position:relative;overflow:hidden;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--teal-l),var(--teal))}
.kpi::after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:90px;height:90px;
  border-radius:50%;background:radial-gradient(circle, color-mix(in srgb,var(--teal) 10%, transparent), transparent 70%);
  pointer-events:none}
.kpi:hover{transform:translateY(-3px);box-shadow:0 16px 28px -18px rgba(15,23,42,.22),var(--sh-direct)}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.1px}
.kpi .val{font-family:'Alexandria','IBM Plex Sans Arabic',sans-serif;
  font-size:clamp(24px,2.4vw,30px);font-weight:800;margin-top:8px;line-height:1.05;letter-spacing:-.4px;
  color:var(--ink)}
.kpi .val .rng{margin:0 .35em;opacity:.7;font-weight:700}
.kpi .delta{font-size:12.5px;font-weight:700;margin-top:10px;display:inline-flex;align-items:center;gap:4px}
.kpi .delta.up{color:var(--up)} .kpi .delta.down{color:var(--down)} .kpi .delta.flat{color:var(--muted)}
.kpi.hero{
  background:linear-gradient(145deg, color-mix(in srgb,var(--teal) 12%, var(--card)) 0%, var(--card) 55%);
  border-color:color-mix(in srgb,var(--teal) 35%, var(--line));
}
.kpi.hero .val{font-size:clamp(28px,3vw,34px);color:var(--heading)}
.kpi.hero::before{width:5px;background:linear-gradient(180deg,#99f6e4,#0f766e)}

/* --- Section stage (board storytelling) --- */
.section-stage{
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;
  margin:0 0 16px;padding:16px 18px;border-radius:16px;position:relative;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--teal) 22%, var(--line));
  background:
    linear-gradient(120deg, color-mix(in srgb,var(--teal) 10%, var(--card)), var(--card) 55%),
    var(--card);
  box-shadow:var(--sh-direct);
  animation:fadeRise .4s var(--ease) both;
}
.section-stage::after{
  content:"";position:absolute;inset-inline-end:-40px;top:-50px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb,var(--teal-l) 35%, transparent), transparent 70%);
  pointer-events:none;
}
.section-stage .eyebrow{
  font-size:11px;font-weight:700;color:var(--teal);letter-spacing:.08em;margin-bottom:4px;
}
.section-stage h2{
  margin:0;font-family:'Alexandria','IBM Plex Sans Arabic',sans-serif;font-size:clamp(20px,2.2vw,26px);
  font-weight:800;color:var(--heading);letter-spacing:.2px;line-height:1.2;
}
.section-stage .sub{margin:6px 0 0;color:var(--muted);font-size:13px;font-weight:500;max-width:52ch}
.section-stage .stamp{
  flex:0 0 auto;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:700;
  color:var(--teal-d);background:color-mix(in srgb,var(--teal-l) 28%, transparent);
  border:1px solid color-mix(in srgb,var(--teal) 25%, transparent);white-space:nowrap;
}
:root[data-theme="dark"] .section-stage .stamp{color:var(--teal-l)}
#view{animation:viewIn .35s var(--ease)}
@keyframes viewIn{from{opacity:.35;translate:0 6px}to{opacity:1;translate:0 0}}

/* --- Presentation / board projector mode --- */
body.present{
  --bg:#071310;
}
body.present .wrap{max-width:1780px;padding:14px 18px 40px}
body.present .sidebar{flex-basis:150px}
body.present .kpi .val{font-size:clamp(28px,3.2vw,36px)}
body.present .section-stage h2{font-size:clamp(24px,2.8vw,30px)}
body.present .chart{height:270px}
body.present .mlegend,.section-stage .stamp{font-size:13px}
body.present header.top{min-height:96px}
#presentBtn.active,#storyBtn.active{color:#fff;background:var(--teal);border-color:var(--teal)}

/* --- Live insights --- */
.insights{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.insight{
  flex:1 1 220px;display:flex;align-items:flex-start;gap:10px;padding:12px 14px;
  border-radius:14px;border:1px solid var(--line);background:var(--card);
  box-shadow:var(--sh-direct);font-size:13px;font-weight:600;line-height:1.45;
  animation:fadeRise .45s var(--ease) both;
}
.insight .idot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.insight.up{border-color:color-mix(in srgb,var(--up) 35%, var(--line));
  background:color-mix(in srgb,var(--up) 7%, var(--card))}
.insight.up .idot{background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 18%, transparent)}
.insight.down{border-color:color-mix(in srgb,var(--down) 35%, var(--line));
  background:color-mix(in srgb,var(--down) 7%, var(--card))}
.insight.down .idot{background:var(--down);box-shadow:0 0 0 3px color-mix(in srgb,var(--down) 18%, transparent)}
.insight.flat{border-color:color-mix(in srgb,var(--teal) 30%, var(--line));
  background:color-mix(in srgb,var(--teal) 6%, var(--card))}
.insight.flat .idot{background:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 16%, transparent)}
.insights .insight:nth-child(2){animation-delay:.05s}
.insights .insight:nth-child(3){animation-delay:.1s}

/* --- Spotlight hero --- */
.spotlight{
  display:grid;grid-template-columns:1.15fr .85fr;gap:0;margin:0 0 16px;
  border-radius:20px;overflow:hidden;border:1px solid color-mix(in srgb,var(--teal) 28%, var(--line));
  box-shadow:var(--sh-ambient),var(--sh-direct);animation:fadeRise .5s var(--ease) both;
  background:var(--card);
}
.spotlight .spot-main{
  padding:22px 24px;position:relative;overflow:hidden;
  background:
    radial-gradient(420px 180px at 100% 0%, color-mix(in srgb,var(--teal-l) 28%, transparent), transparent 70%),
    linear-gradient(135deg, #06332e 0%, #0f766e 55%, #12897f 100%);
  color:#fff;
}
.spotlight .spot-main::after{
  content:"";position:absolute;inset-inline-start:-30px;bottom:-40px;width:140px;height:140px;border-radius:50%;
  background:rgba(255,255,255,.06);pointer-events:none;
}
.spotlight .tag{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-size:11px;font-weight:800;letter-spacing:.06em;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#ecfeff;
}
.spotlight .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal-l)}
.spotlight h3{
  margin:12px 0 6px;font-family:'Alexandria','IBM Plex Sans Arabic',sans-serif;
  font-size:clamp(22px,2.6vw,30px);font-weight:900;line-height:1.2;letter-spacing:.2px;
}
.spotlight .spot-sub{margin:0;color:rgba(236,254,250,.85);font-size:13.5px;font-weight:500;max-width:40ch}
.spotlight .spot-side{
  padding:20px 22px;display:flex;flex-direction:column;justify-content:center;gap:12px;
  background:linear-gradient(180deg, color-mix(in srgb,var(--teal) 6%, var(--card)), var(--card));
}
.spotlight .metric{display:flex;flex-direction:column;gap:2px}
.spotlight .metric .ml{font-size:12px;color:var(--muted);font-weight:700}
.spotlight .metric .mv{
  font-family:'Alexandria','IBM Plex Sans Arabic',sans-serif;font-size:clamp(22px,2.4vw,28px);
  font-weight:800;color:var(--heading);line-height:1.1;
}
.spotlight .metric .md{font-size:12.5px;font-weight:700}
@media(max-width:820px){.spotlight{grid-template-columns:1fr}}

/* --- Executive story mode --- */
.story-bar{
  position:fixed;inset-inline:16px 16px;bottom:16px;z-index:80;display:none;
  padding:12px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.18);
  background:rgba(6,51,46,.92);color:#ecfeff;backdrop-filter:blur(10px);
  box-shadow:0 16px 40px -18px rgba(0,0,0,.55);
}
body.storying .story-bar{display:block;animation:fadeRise .35s var(--ease) both}
body.storying .sidebar{opacity:.55}
.story-bar .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.story-bar .stitle{font-weight:800;font-size:13.5px;flex:1}
.story-bar .smeta{font-size:12px;opacity:.85;font-weight:600}
.story-bar .track{width:100%;height:6px;border-radius:999px;background:rgba(255,255,255,.16);margin-top:10px;overflow:hidden}
.story-bar .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#5eead4,#99f6e4);
  transition:width .25s linear}
.story-bar button{
  border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;
  border-radius:10px;padding:7px 12px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;
}
.story-bar button:hover{background:rgba(255,255,255,.2)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 20px;
  box-shadow:var(--sh-ambient),var(--sh-direct);margin-bottom:16px;transition:box-shadow .2s var(--ease)}
.panel:hover{box-shadow:0 18px 36px -20px rgba(15,23,42,.2),var(--sh-direct)}
.panel h2{
  margin:0 0 14px;font-size:16px;color:var(--heading);font-weight:700;
  font-family:'Alexandria','IBM Plex Sans Arabic',sans-serif;letter-spacing:.1px;
  display:flex;align-items:center;gap:10px;
}
.panel h2::before{
  content:"";width:8px;height:8px;border-radius:50%;flex:0 0 auto;
  background:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 16%, transparent);
}
.panel .hint{color:var(--muted);font-size:13px;margin:0 0 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}

.chart{display:flex;align-items:flex-end;gap:18px;height:236px;padding:28px 8px 0;
  border-bottom:2px solid var(--line);position:relative;border-radius:4px}
.chart::before{content:"";position:absolute;left:8px;right:8px;top:28px;bottom:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(to top,var(--grid) 0 1px,transparent 1px 25%)}
.chgroup{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:8px;height:100%;position:relative;z-index:1}
.bar{width:40px;border-radius:10px 10px 3px 3px;position:relative;transition:height .45s var(--ease);min-height:2px;
  box-shadow:0 8px 14px -8px rgba(15,23,42,.35)}
.bar::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 40%,rgba(0,0,0,.1))}
.bar .cap{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap}
.chlabels{display:flex;gap:18px;margin-top:10px}
.chlabels span{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--muted)}

table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
th,td{padding:11px 13px;text-align:right;border-bottom:1px solid var(--line)}
th{background:var(--th-bg);font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.02em;
  position:sticky;top:0;z-index:1}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr:hover{background:var(--row-hover)}
tbody td:first-child{font-weight:600}
tfoot td{font-weight:700;background:var(--tfoot-bg);border-top:2px solid var(--teal-l);border-bottom:0}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.tbl-wrap{overflow:auto;border-radius:14px;border:1px solid var(--line);max-width:100%}

.conv{display:flex;align-items:center;gap:10px}
.conv .track{flex:1;height:10px;background:color-mix(in srgb,var(--line) 80%, transparent);
  border-radius:999px;overflow:hidden}
.conv .fill{height:100%;border-radius:999px}
.pill{font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.g{background:#dcfce7;color:#166534}.pill.y{background:#fef9c3;color:#854d0e}.pill.r{background:#fee2e2;color:#991b1b}
:root[data-theme="dark"] .pill.g{background:#14532d;color:#bbf7d0}
:root[data-theme="dark"] .pill.y{background:#713f12;color:#fde68a}
:root[data-theme="dark"] .pill.r{background:#7f1d1d;color:#fecaca}
.trend{font-size:12px;font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:28px;line-height:1.8;
  padding-top:18px;border-top:1px solid var(--line)}
.note{border-radius:14px;padding:12px 16px;font-size:13px;margin-bottom:16px}
.note.demo{background:#fffbeb;border:1px solid #fde68a;color:#854d0e}
.note.real{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.note.info{background:#ecfeff;border:1px solid #a5f3fc;color:#155e75}
.pend{text-align:center;color:var(--muted);padding:48px 20px}
.pend .big{font-size:36px;opacity:.7}

/* --- entrance motion --- */
@keyframes fadeRise{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
@keyframes barRise{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}
@keyframes brandIn{from{opacity:0;letter-spacing:.32em;filter:blur(4px)}to{opacity:1;letter-spacing:.18em;filter:blur(0)}}
.brand{animation:brandIn .7s var(--ease) both}
.kpi{animation:fadeRise .45s var(--ease) both}
.kpis .kpi:nth-child(2){animation-delay:.05s}
.kpis .kpi:nth-child(3){animation-delay:.10s}
.kpis .kpi:nth-child(4){animation-delay:.15s}
.kpis .kpi:nth-child(5){animation-delay:.20s}
.kpis .kpi:nth-child(6){animation-delay:.25s}
.panel{animation:fadeRise .5s var(--ease) both}
.bar{animation:barRise .55s cubic-bezier(.2,.75,.2,1) both}
.chart .chgroup:nth-child(1) .bar{animation-delay:.04s}
.chart .chgroup:nth-child(2) .bar{animation-delay:.12s}
.chart .chgroup:nth-child(3) .bar{animation-delay:.20s}
.chart .chgroup:nth-child(4) .bar{animation-delay:.28s}
.chart .chgroup:nth-child(5) .bar{animation-delay:.36s}
.chart .chgroup:nth-child(6) .bar{animation-delay:.44s}

/* --- trend delta chips --- */
.trend-chip{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:999px;
  font-weight:700;font-size:12px;white-space:nowrap;line-height:1.5}
.trend-chip.up{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}
.trend-chip.down{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)}
.trend-chip.flat{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted)}

/* --- control buttons / inputs --- */
.ctrlbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);width:38px;height:38px;
  border-radius:12px;font-size:15px;cursor:pointer;line-height:1;transition:.15s}
.ctrlbtn:hover{color:var(--teal);border-color:var(--teal-l);transform:translateY(-1px)}
#neSearch{background:var(--card);color:var(--ink);outline:none;
  width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;
  font-family:inherit;font-size:14px;direction:rtl}
#neSearch:focus{border-color:var(--teal)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 18%, transparent)}
.ne-tools{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.ne-tools .ne-status{margin:0}
@media(min-width:720px){
  .ne-tools{flex-direction:row;align-items:center}
  .ne-tools #neSearch{flex:1;min-width:0}
  .ne-tools .ne-status{flex:0 0 auto}
}

/* --- chart tooltip + trend line --- */
#barTip{position:fixed;z-index:50;pointer-events:none;background:var(--teal-d);color:#fff;
  padding:6px 11px;border-radius:9px;font-size:12px;font-weight:700;opacity:0;transition:opacity .12s;
  transform:translate(-50%,-100%);white-space:nowrap;box-shadow:var(--sh-direct)}
.trendline polyline{stroke:var(--trend-line-color)}
.trendline circle{stroke:var(--trend-line-color);fill:var(--card)}

/* ===== Liquid Glass ===== */
:root{
  --glass:rgba(255,255,255,.5);
  --glass-2:rgba(255,255,255,.34);
  --glass-brd:rgba(255,255,255,.72);
  --glass-blur:saturate(185%) blur(16px);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.6);
  --glass-sh:0 18px 42px -22px rgba(15,60,55,.42);
}
:root[data-theme="dark"]{
  --glass:rgba(18,30,48,.52);
  --glass-2:rgba(18,30,48,.42);
  --glass-brd:rgba(255,255,255,.14);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.08);
  --glass-sh:0 20px 48px -22px rgba(0,0,0,.62);
}
body::before{
  content:"";position:fixed;inset:-12%;z-index:-1;pointer-events:none;filter:blur(8px);
  background:
    radial-gradient(closest-side, rgba(45,212,191,.34), transparent) 6% 16%/38% 44% no-repeat,
    radial-gradient(closest-side, rgba(20,184,166,.28), transparent) 94% 8%/42% 48% no-repeat,
    radial-gradient(closest-side, rgba(56,189,248,.20), transparent) 78% 98%/46% 52% no-repeat,
    radial-gradient(closest-side, rgba(16,185,129,.24), transparent) 16% 94%/40% 46% no-repeat;
}
:root[data-theme="dark"] body::before{opacity:.55}
.kpi,.panel,.tbl-wrap,.section-stage,.insight,.spotlight,
.sidebar button,.chips button,.toggle,.ctrlbtn,.month-chip,#neSearch,select{
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
}
.kpi,.panel,.tbl-wrap,.section-stage{
  background:var(--glass);border:1px solid var(--glass-brd);
  box-shadow:var(--glass-sh),var(--glass-hi);
}
.kpi.hero{background:color-mix(in srgb,var(--teal) 16%, var(--glass));border:1px solid var(--glass-brd)}
.sidebar button,.chips button,.toggle,.ctrlbtn,.month-chip,#neSearch,select{
  background:var(--glass-2);border:1px solid var(--glass-brd);
}
.insight{background:var(--glass);border:1px solid var(--glass-brd);box-shadow:var(--glass-hi)}
.insight.up{background:color-mix(in srgb,var(--up) 13%,var(--glass))}
.insight.down{background:color-mix(in srgb,var(--down) 13%,var(--glass))}
.insight.flat{background:color-mix(in srgb,var(--teal) 13%,var(--glass))}
.spotlight{background:var(--glass);border:1px solid var(--glass-brd);box-shadow:var(--glass-sh),var(--glass-hi)}
.spotlight .spot-side{background:var(--glass)}
th{background:color-mix(in srgb,var(--glass) 78%, transparent)}

  }

  .tbl-wrap{overflow:visible;border-color:#cbd5e1}
  th{position:static}
  .foot{border:0}
}

/* ==================== helpers ==================== */
const M=DATA.months, ML=DATA.monthLabel;
const CUR="07",PREV="06",FIRST="05";
const MW=["05","06","07","08"], CURW="08", PREVW="07";
const COL={"05":"var(--c05)","06":"var(--c06)","07":"var(--c07)","08":"var(--c08)"};
const state={tab:"sales",scope:"all",metric:"units"};
const fmt=n=>n==null?"—":Number(n).toLocaleString("en-US",{maximumFractionDigits:0});
function delta(cur,prev){
  if(prev==null||prev===0) return {t:"—",c:"flat"};
  const d=Math.round(((cur-prev)/prev)*100);
  return {t:(d>0?"▲ +":d<0?"▼ ":"● ")+d+"%",c:d>0?"up":d<0?"down":"flat"};
}
const MK={units:"u",value:"v"};
function itemVals(it,scope,metric){ return it[scope] ? it[scope][MK[metric]] : null; }
function itemTotals(scope,metric){ // {05,06,07} totals across items for a scope
  const o={}; M.forEach(m=>o[m]=DATA.nostriItems.reduce((a,it)=>{
    const v=itemVals(it,scope,metric); return a+((v&&v[m])||0);},0)); return o;
}
function barChart(vals,unit,months){
  const mo=months||M;
  const max=Math.max(...mo.map(m=>vals[m]||0),1);
  const bars=mo.map(m=>{
    const h=Math.max((vals[m]||0)/max*100,1.5);
    return `<div class="chgroup"><div class="bar" style="height:${h}%;background:${COL[m]}">
      <span class="cap" style="color:${COL[m]}">${fmt(vals[m])}</span></div></div>`;
  }).join("");
  const labels=mo.map(m=>`<span>${ML[m]}</span>`).join("");
  return `<div class="chart chart-monthly">${bars}</div><div class="chlabels">${labels}</div>`;
}
function scopeLabel(s){return s==="all"?"كل الصيدليات":"صيدلية "+s;}
function metricLabel(){return state.metric==="units"?"وحدة":"ريال";}
function convClass(p){return p>=90?"g":p>=60?"y":"r";}

V.sales=()=>{

    return `<div class="panel"><div class="pend"><div class="big">📄</div>

  const mk=state.metric, unit=metricLabel(), scope=state.scope;

  const dCur=delta(tot[CUR],tot[PREV]), dTot=delta(tot[CUR],tot[FIRST]);

     مبيعات نوستري (كل الفروع). الباقي = الصيدليات الخارجية. محسوبة من البيانات الحقيقية.</div>`;

    <div class="kpi"><div class="lbl">الخارجية — 07</div><div class="val">${fmt(ext[CUR])} <span class="unit">${unit}</span></div>

      <div class="val val-range ${sCur>=sFirst?'up':'down'}">من ${sFirst}% إلى ${sCur}%</div>
      <div class="delta ${sCur>=sFirst?'up':'down'}">${sCur>=sFirst?'ارتفاع':'انخفاض'} النصيب</div></div></div>`;

  const maxT=Math.max(...M.map(m=>all[m]),1);

  const chart=`<div class="panel"><h2>الداخلية مقابل الخارجية — تسلسل شهري (${unit})</h2>

      <span class="dot" style="background:var(--c05)"></span>خارجية</div>
    <div class="chart">${bars}</div><div class="chlabels">${M.map(m=>`<span>${ML[m]}</span>`).join("")}</div></div>`;
  const rows=M.map(m=>{
    const d=m===FIRST?{t:"—",c:"flat"}:(()=>{const p=m===CUR?PREV:FIRST;const dd=Math.round(share[m]-share[p]);
      return {t:(dd>0?"▲ +":dd<0?"▼ ":"● ")+dd+" نقطة",c:dd>0?"up":dd<0?"down":"flat"};})();
    return `<tr><td>${ML[m]}</td><td class="num">${fmt(intr[m])}</td><td class="num">${fmt(ext[m])}</td>
      <td class="num">${fmt(all[m])}</td><td><span class="pill ${share[m]>=50?'g':share[m]>=35?'y':'r'}">${Math.round(share[m])}%</span></td>
      <td class="trend ${d.c}">${d.t}</td></tr>`;
  }).join("");
  const table=`<div class="panel"><h2>جدول المشاركة الشهري (${unit})</h2>
    <div class="tbl-wrap"><table><thead><tr><th>الشهر</th><th>الداخلية (1/7/18)</th><th>الخارجية</th>
    <th>الإجمالي</th><th>مشاركة الداخلية</th><th>التغير</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  // internal breakdown by pharmacy for CUR
  const brk=INTERNAL.map(p=>{
    const t=itemTotals(p,mk)[CUR], sh=all[CUR]?Math.round(t/all[CUR]*100):0;
    return `<tr><td>${scopeLabel(p)}</td><td class="num">${fmt(t)}</td>

    <div class="tbl-wrap"><table><thead><tr><th>الصيدلية</th><th>المبيعات</th><th>نصيبها من الإجمالي</th></tr></thead>
    <tbody>${brk}</tbody>
    <tfoot><tr><td>مجموع الداخلية</td><td class="num">${fmt(intr[CUR])}</td>
    <td><span class="pill ${sCur>=50?'g':sCur>=35?'y':'r'}">${sCur}%</span></td></tr></tfoot></table></div></div>`;
  return kpis+chart+table+brkTable;
};

/* ---- 1ج. Credit (الأدوية آجل) — مقارنة سنوية 2025 vs 2026 ---- */

  const C=DATA.credit, y5=C["2025"], y6=C["2026"];

     <b>2025</b> و<b>2026</b> لنفس الشهور (05/06/07).</div>`;
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="lbl">إجمالي 2026 (05→07)</div><div class="val">${fmt(t6)} <span class="unit">ريال</span></div>
      <div class="delta ${t6>=t5?'up':'down'}">${dTot>0?'▲ +':''}${dTot}% مقابل 2025</div></div>
    <div class="kpi"><div class="lbl">إجمالي 2025 (05→07)</div><div class="val">${fmt(t5)} <span class="unit">ريال</span></div></div>
    <div class="kpi"><div class="lbl">الفرق السنوي</div><div class="val ${t6>=t5?'up':'down'}">${t6-t5>0?'+':''}${fmt(t6-t5)}</div>
      <div class="delta ${t6>=t5?'up':'down'}">ريال</div></div>
    <div class="kpi"><div class="lbl">يوليو 2026</div><div class="val">${fmt(y6[CUR])}</div>
      <div class="delta ${y6[CUR]>=y5[CUR]?'up':'down'}">${y6[CUR]-y5[CUR]>0?'▲ +':'▼ '}${Math.round((y6[CUR]-y5[CUR])/y5[CUR]*1000)/10}% مقابل يوليو 2025</div></div></div>`;
  // grouped bars: per month 2025 vs 2026
  const mx=Math.max(...M.map(m=>Math.max(y5[m],y6[m])),1);
  const groups=M.map(m=>{
    const h5=y5[m]/mx*100, h6=y6[m]/mx*100;

    return `<div class="chgroup">
      <div class="bar" style="height:${h5}%;background:var(--c05)"><span class="cap" style="color:var(--muted);font-size:11px">${fmt(y5[m])}</span></div>
      <div class="bar" style="height:${h6}%;background:var(--c07)"><span class="cap" style="color:var(--teal);font-size:11px">${fmt(y6[m])}</span></div>
    </div>`;}).join("");
  const chart=`<div class="panel"><h2>الأدوية آجل — 2025 مقابل 2026 (ريال)</h2>
    <div style="font-size:13px;color:var(--muted);margin-bottom:8px">

      <span class="dot" style="background:var(--c07)"></span>2026</div>
    <div class="chart">${groups}</div>
    <div class="chlabels">${M.map(m=>`<span>${ML[m]}</span>`).join("")}</div></div>`;
  const rows=M.map(m=>{
    const diff=y6[m]-y5[m], d=Math.round(diff/y5[m]*1000)/10, c=d>0?"up":d<0?"down":"flat";
    return `<tr><td>${ML[m]}</td><td class="num">${fmt(y5[m])}</td><td class="num">${fmt(y6[m])}</td>
      <td class="num ${c}">${diff>0?'+':''}${fmt(diff)}</td>

  return kpis+chart+table;
};

/* ---- 2. Writings (REAL — ص1) ---- */
function itemWr(it,scope){ return it.wr && it.wr[scope] ? it.wr[scope] : null; }
function wrTotals(scope,months){ const mo=months||M; const o={}; mo.forEach(m=>o[m]=DATA.nostriItems.reduce((a,it)=>{
  const w=itemWr(it,scope); return a+((w&&w[m])||0);},0)); return o; }
V.writings=()=>{
  const scope=state.scope;
  if(!DATA.writingsReady[scope]){
    return `<div class="panel"><div class="pend"><div class="big">✍️</div>
      <h2>كتابات ${scopeLabel(scope)} — بانتظار الملف</h2></div></div>`;
  }
  const w=wrTotals(scope,MW), dCur=delta(w[CURW],w[PREVW]), dTot=delta(w[CURW],w[FIRST]);
  const kpis=`<div class="kpis">
    <div class="kpi hero"><div class="lbl">كتابات أغسطس 08</div><div class="val">${fmt(w[CURW])}</div>
      <div class="delta ${dCur.c}">${dCur.t} مقابل يوليو</div></div>
    <div class="kpi"><div class="lbl">يوليو 07</div><div class="val">${fmt(w[CUR])}</div></div>
    <div class="kpi"><div class="lbl">يونيو 06</div><div class="val">${fmt(w[PREV])}</div></div>
    <div class="kpi"><div class="lbl">التغير 05←08</div><div class="val ${dTot.c}">${dTot.t.replace(/[▲▼●] /,"")}</div>
      <div class="delta ${dTot.c}">${dTot.c==="up"?"تحسّن":dTot.c==="down"?"تراجع":"ثبات"} الكتابات</div></div></div>`;
  const chart=`<div class="panel"><h2>تسلسل الكتابات — ${scopeLabel(scope)}</h2>${barChart(w,null,MW)}</div>`;
  const rows=DATA.nostriItems.map(it=>{
    const x=itemWr(it,scope)||{}, d=delta(x[CURW],x[PREVW]);
    return `<tr><td>${it.name}</td>${MW.map(m=>`<td class="num">${fmt(x[m])}</td>`).join("")}
      <td class="trend ${d.c}">${d.t}</td></tr>`;}).join("");
  const table=`<div class="panel"><h2>الكتابات لكل صنف — ${scopeLabel(scope)}</h2>
    <div class="tbl-wrap"><table><thead><tr><th>الصنف</th>${MW.map(m=>`<th>${ML[m]}</th>`).join("")}<th>التغير ش/ش</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>الإجمالي</td>${MW.map(m=>`<td class="num">${fmt(w[m])}</td>`).join("")}
    <td class="trend ${dCur.c}">${dCur.t}</td></tr></tfoot></table></div></div>`;
  // ===== إجمالي الصيدليات الثلاث معًا (1+7+18) =====
  const P3=["1","7","18"];
  const comb={}; MW.forEach(m=>comb[m]=P3.reduce((a,p)=>a+(wrTotals(p,MW)[m]||0),0));
  const cd=delta(comb[CURW],comb[PREVW]), cd3=delta(comb[CURW],comb[FIRST]);
  const combKpis=`<div class="kpis">
    <div class="kpi hero"><div class="lbl">إجمالي الصيدليات الثلاث (1+7+18) — أغسطس</div>
      <div class="val">${fmt(comb[CURW])}</div><div class="delta ${cd.c}">${cd.t} مقابل يوليو</div></div>
    <div class="kpi"><div class="lbl">يوليو</div><div class="val">${fmt(comb[CUR])}</div></div>
    <div class="kpi"><div class="lbl">يونيو</div><div class="val">${fmt(comb[PREV])}</div></div>
    <div class="kpi"><div class="lbl">التغير 05←08</div><div class="val ${cd3.c}">${cd3.t.replace(/[▲▼●] /,"")}</div>
      <div class="delta ${cd3.c}">${cd3.c==="up"?"تحسّن":cd3.c==="down"?"تراجع":"ثبات"}</div></div></div>`;
  const brk=P3.map(p=>{const x=wrTotals(p,MW), d=delta(x[CURW],x[PREVW]);
    return `<tr><td>${scopeLabel(p)}</td>${MW.map(m=>`<td class="num">${fmt(x[m])}</td>`).join("")}
      <td class="trend ${d.c}">${d.t}</td></tr>`;}).join("");
  const combPanel=`<div class="panel"><h2>🏥 إجمالي الصيدليات الثلاث معًا — الكتابات</h2>
    ${barChart(comb,null,MW)}
    <div class="tbl-wrap" style="margin-top:14px"><table><thead><tr><th>الصيدلية</th>${MW.map(m=>`<th>${ML[m]}</th>`).join("")}<th>التغير ش/ش</th></tr></thead>

    <td class="trend ${cd.c}">${cd.t}</td></tr></tfoot></table></div></div>`;

/* ---- 3. Conversion (REAL — ص1 & ص18) ---- */
V.conversion=()=>{
  const scope=state.scope;
  if(!DATA.writingsReady[scope]){
    return `<div class="panel"><div class="pend"><div class="big">🔄</div>
      <h2>تحويل ${scopeLabel(scope)} — بانتظار الكتابات</h2></div></div>`;
  }
  const note=`<div class="note real">🔄 <b>التحويل الفعلي — ${scopeLabel(scope)}</b> = (وحدات مباعة ÷ عدد الكتابات) × 100.
    كلاهما حقيقي. أكثر من 100% يعني بيع أكبر من الكتابة (صرف متعدد الوحدات أو بيع بدون وصفة).
    ⏳ باقي الصيدليات تدخل هنا فور وصول كتاباتها.</div>`;
  const soldTot=itemTotals(scope,"units"), wr=wrTotals(scope);
  // monthly totals
  const mrows=M.map(m=>{
    const cv=wr[m]?Math.round(soldTot[m]/wr[m]*100):0, c=convClass(cv);
    return `<tr><td>${ML[m]}</td><td class="num">${fmt(wr[m])}</td><td class="num">${fmt(soldTot[m])}</td>
      <td><span class="pill ${c}">${cv}%</span></td>
      <td style="width:160px"><div class="conv"><div class="track">

      </div></div></td></tr>`;}).join("");
  const cvCur=wr[CUR]?Math.round(soldTot[CUR]/wr[CUR]*100):0;

  const kpis=`<div class="kpis">
    <div class="kpi"><div class="lbl">تحويل يوليو 07</div><div class="val">${cvCur}%</div>
      <div class="delta ${cvCur>=cvPrev?'up':'down'}">${cvCur-cvPrev>0?'▲ +':'▼ '}${cvCur-cvPrev} نقطة مقابل يونيو</div></div>
    <div class="kpi"><div class="lbl">كتابات 07</div><div class="val">${fmt(wr[CUR])}</div></div>
    <div class="kpi"><div class="lbl">وحدات مباعة 07</div><div class="val">${fmt(soldTot[CUR])}</div></div></div>`;
  const mtable=`<div class="panel"><h2>التحويل الشهري — ${scopeLabel(scope)}</h2>
    <div class="tbl-wrap"><table><thead><tr><th>الشهر</th><th>كتابات</th><th>وحدات مباعة</th>
    <th>التحويل %</th><th></th></tr></thead><tbody>${mrows}</tbody></table></div></div>`;
  // per-item July
  const irows=DATA.nostriItems.map(it=>{
    const wv=(itemWr(it,scope)||{})[CUR]||0, uv=(itemVals(it,scope,"units")||{})[CUR]||0;
    const cv=wv?Math.round(uv/wv*100):0, c=convClass(cv);
    return `<tr><td>${it.name}</td><td class="num">${fmt(wv)}</td><td class="num">${fmt(uv)}</td>
      <td><span class="pill ${c}">${wv?cv+'%':'—'}</span></td></tr>`;}).join("");
  const itable=`<div class="panel"><h2>التحويل لكل صنف — يوليو 07 (${scopeLabel(scope)})</h2>
    <div class="tbl-wrap"><table><thead><tr><th>الصنف</th><th>كتابات</th><th>وحدات مباعة</th><th>التحويل %</th></tr></thead>
    <tbody>${irows}</tbody></table></div></div>`;
  return kpis+mtable+itable;
};

  const table=`<div class="panel"><h2>كل أصناف النير اكسبير (${NE.all.length}) — مرتّبة بالمخزون</h2>

        <button type="button" data-status="active">نشط</button>
      </div>
    </div>
    <div id="neCount" style="font-size:12px;color:var(--muted);margin-bottom:8px"></div>
    <div class="tbl-wrap" style="max-height:70vh;overflow-y:auto"><table><thead><tr>
      <th>الصنف</th><th>المخزون</th><th>مايو</th><th>يونيو</th><th>يوليو</th><th>أغسطس</th>
      <th>التغير</th><th>الحالة</th><th>أكثر طبيب يكتبه</th></tr></thead><tbody id="neBody">${allRows}</tbody></table></div></div>`;

    const inp=document.getElementById("neSearch"), body=document.getElementById("neBody"),
          cnt=document.getElementById("neCount"), trs=[...body.querySelectorAll("tr")],
          statusBox=document.getElementById("neStatus");
    let status="all";
    const upd=()=>{
      const q=(inp.value||"").trim().toLowerCase(); let n=0;
      trs.forEach(t=>{
        const okName=!q||t.dataset.name.includes(q);
        const okStatus=status==="all"||t.dataset.status===status;

          statusBox.querySelectorAll("button").forEach(x=>x.classList.remove("active"));
          b.classList.add("active"); status=b.dataset.status; upd();
        };

};

function scopeReadyMap(t){return (t==="writings"||t==="conversion"||t==="doctors")?DATA.writingsReady:DATA.pharmacyReady;}
function usesMetric(t){return t==="sales"||t==="share";}
const TAB_META={
  sales:{t:"مبيعات Nostri",s:"مقارنة مايو / يونيو / يوليو"},
  share:{t:"المشاركة",s:"الداخلية (1 · 7 · 18) من إجمالي نوستري"},
  writings:{t:"الكتابات",s:"كتابات الأطباء حسب الصيدلية"},
  conversion:{t:"التحويل",s:"الكتابة مقابل الوحدات المباعة"},

function sectionStage(tab){

    <div><h2>${m.t}</h2><p class="sub">${m.s}</p></div>

function goTab(tab){
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));
  state.tab=tab;
  if(tab==="sales") state.scope="all";
  else if(needsScope(tab) && !scopeReadyMap(tab)[state.scope]) state.scope="1";

function shortName(n){return (n||"").replace(/\s+/g," ").trim().slice(0,34);}
function topItemByJuly(metric){
  let best=null,bestV=-1;
  DATA.nostriItems.forEach(it=>{
    const v=(itemVals(it,"all",metric)||{})[CUR]||0;
    if(v>bestV){bestV=v;best=it;}
  });
  return {it:best,v:bestV};
}
function topGrowthItem(){
  let best=null,bestD=-Infinity,prev=0,cur=0;
  DATA.nostriItems.forEach(it=>{
    const u=itemVals(it,"all","units")||{};
    const a=u[PREV]||0,b=u[CUR]||0;
    if(!a) return;
    const d=(b-a)/a;
    if(d>bestD){bestD=d;best=it;prev=a;cur=b;}
  });
  return {it:best,d:bestD,prev,cur};
}
function insightsFor(tab){
  const out=[];
  if(tab==="sales"){
    const tot=itemTotals("all",state.metric), d=delta(tot[CUR],tot[PREV]), d3=delta(tot[CUR],tot[FIRST]);
    const unit=state.metric==="units"?"وحدة":"ريال";
    out.push({c:d.c,t:`يوليو vs يونيو: ${d.t} — ${fmt(tot[CUR])} ${unit}`});
    out.push({c:d3.c,t:`مايو ← يوليو: ${d3.t}`});
    const g=topGrowthItem();
    if(g.it) out.push({c:g.d>=0?"up":"down",t:`أعلى نمو شهري: ${shortName(g.it.name)} (${delta(g.cur,g.prev).t})`});
  } else if(tab==="share"){
    const all=itemTotals("all",state.metric), intr=internalTotals(state.metric);
    const sCur=all[CUR]?Math.round(intr[CUR]/all[CUR]*100):0;
    const sPrev=all[PREV]?Math.round(intr[PREV]/all[PREV]*100):0;
    const dd=sCur-sPrev;
    out.push({c:dd>0?"up":dd<0?"down":"flat",t:`مشاركة الداخلية يوليو: ${sCur}% (${dd>0?"+":""}${dd} نقطة vs يونيو)`});
    out.push({c:"flat",t:`الخارجية: ${100-sCur}% من الإجمالي`});
    let bestP="1",bestV=-1;
    ["1","7","18"].forEach(p=>{const v=itemTotals(p,state.metric)[CUR]; if(v>bestV){bestV=v;bestP=p;}});
    out.push({c:"up",t:`أعلى صيدلية داخلية: ص${bestP} — ${fmt(bestV)} ${metricLabel()}`});
  } else if(tab==="writings"){
    const scope=DATA.writingsReady[state.scope]?state.scope:"1";
    const w=wrTotals(scope,MW), d=delta(w[CURW],w[PREVW]);
    out.push({c:d.c,t:`${scopeLabel(scope)} أغسطس: ${fmt(w[CURW])} كتابة (${d.t} vs يوليو)`});
    out.push({c:delta(w[CURW],w[FIRST]).c,t:`مايو ← أغسطس: ${delta(w[CURW],w[FIRST]).t}`});
  } else if(tab==="conversion"){
    const scope=DATA.writingsReady[state.scope]?state.scope:"1";
    const sold=itemTotals(scope,"units"), wr=wrTotals(scope);
    const cv=wr[CUR]?Math.round(sold[CUR]/wr[CUR]*100):0;
    const cvP=wr[PREV]?Math.round(sold[PREV]/wr[PREV]*100):0;
    out.push({c:cv>=cvP?"up":"down",t:`تحويل ${scopeLabel(scope)} يوليو: ${cv}% (${cv-cvP>0?"+":""}${cv-cvP} نقطة)`});
    out.push({c:"flat",t:`${fmt(wr[CUR])} كتابة / ${fmt(sold[CUR])} وحدة`});
  } else if(tab==="pureherb"){
    const items=DATA.pureherb;
    const sum=(k,p)=>items.reduce((a,it)=>a+(it[k][p]||0),0);
    const uAll=sum("u","all"), uIntr=sum("u","1")+sum("u","7")+sum("u","18");
    const sh=uAll?Math.round(uIntr/uAll*100):0;
    out.push({c:"flat",t:`كل الصيدليات يوليو: ${fmt(uAll)} وحدة · ${fmt(sum("v","all"))} ريال`});
    out.push({c:"up",t:`الداخلية (1+7+18): ${fmt(uIntr)} وحدة · ${sh}%`});
    out.push({c:"down",t:`الخارجية: ${fmt(uAll-uIntr)} وحدة · ${100-sh}%`});
  } else if(tab==="doctors"){
    const scope=DATA.doctorsNostri[state.scope]?state.scope:"1";
    const docs=(DATA.doctorsNostri[scope]||[]).slice().sort((a,b)=>(b[4]||0)-(a[4]||0));
    if(docs[0]) out.push({c:"up",t:`الأعلى أغسطس (ص${scope}): ${shortName(docs[0][0])} — ${docs[0][4]||0}`});
    out.push({c:"flat",t:`عدد الأطباء الكاتبين: ${DATA.doctorCount[scope]||docs.length}`});
  } else if(tab==="credit"){
    const y5=DATA.credit["2025"], y6=DATA.credit["2026"];
    const t5=M.reduce((a,m)=>a+y5[m],0), t6=M.reduce((a,m)=>a+y6[m],0);
    const d=Math.round((t6-t5)/t5*1000)/10;
    out.push({c:t6>=t5?"up":"down",t:`إجمالي 2026 (05→07): ${fmt(t6)} ريال (${d>0?"+":""}${d}% vs 2025)`});
    const dd=y6[CUR]-y5[CUR];
    out.push({c:dd>=0?"up":"down",t:`يوليو 2026: ${fmt(y6[CUR])} · يوليو 2025: ${fmt(y5[CUR])}`});
  }
  return out;
}

    pb.title=on?"إيقاف وضع العرض":"وضع عرض";
    if(on){try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}catch(e){}}
    else if(document.fullscreenElement){try{document.exitFullscreen();}catch(e){}}
  }
  pb.onclick=()=>setPresent(!document.body.classList.contains("present"));
  document.addEventListener("fullscreenchange",()=>{
    if(!document.fullscreenElement){
      document.body.classList.remove("present"); pb.classList.remove("active");
      pb.title="وضع عرض";
    }
  });
  document.getElementById("printBtn").onclick=()=>window.print();
})();

/* ---- Executive Story Mode: sales → share → pureherb (~75s) ---- */
(function(){
  const STEPS=[
    {tab:"sales", title:"1 · مبيعات Nostri", sec:26},
    {tab:"share", title:"2 · المشاركة", sec:24},
    {tab:"pureherb", title:"3 · PureHerb", sec:24}
  ];
  const btn=document.getElementById("storyBtn");
  const fill=document.getElementById("storyFill");
  const title=document.getElementById("storyTitle");
  const meta=document.getElementById("storyMeta");
  let timer=null, raf=null, idx=0, started=0, stepDur=0, running=false;
  function stop(){
    running=false; document.body.classList.remove("storying");
    btn.classList.remove("active"); btn.textContent="▶";
    btn.title="عرض تلقائي";
    if(timer){clearTimeout(timer);timer=null;}
    if(raf){cancelAnimationFrame(raf);raf=null;}
    fill.style.width="0%";
  }
  window.__stopStory=stop;
  function progress(){
    if(!running) return;
    const p=Math.min(1,(performance.now()-started)/stepDur);
    const base=idx/STEPS.length, slice=1/STEPS.length;
    fill.style.width=((base+slice*p)*100).toFixed(1)+"%";
    if(p<1) raf=requestAnimationFrame(progress);
  }
  function playStep(i){
    if(!running) return;
    if(i>=STEPS.length){ stop(); return; }
    idx=i; const s=STEPS[i];
    title.textContent=s.title;
    meta.textContent=(i+1)+" / "+STEPS.length+" · "+s.sec+" ث";
    goTab(s.tab);
    stepDur=s.sec*1000; started=performance.now();
    if(raf)cancelAnimationFrame(raf); raf=requestAnimationFrame(progress);
    timer=setTimeout(()=>playStep(i+1), stepDur);
  }
  function start(){
    if(running){stop();return;}
    running=true; document.body.classList.add("storying","nav-collapsed");
    btn.classList.add("active"); btn.textContent="■";
    btn.title="إيقاف العرض التلقائي";
    playStep(0);
  }
  btn.onclick=start;
  document.getElementById("storyStop").onclick=stop;
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&running) stop(); });
})();

/* ---- visual layer: chart tooltip + trend chips + trend line + KPI polish ---- */
(function(){
  const view=document.getElementById("view");
  const tip=document.createElement("div"); tip.id="barTip"; document.body.appendChild(tip);
  view.addEventListener("mouseover",e=>{const b=e.target.closest(".bar");if(!b)return;
    const c=b.querySelector(".cap");tip.textContent=c?c.textContent.trim():"";tip.style.opacity="1";});
  view.addEventListener("mousemove",e=>{if(tip.style.opacity==="1"){
    tip.style.left=e.clientX+"px";tip.style.top=(e.clientY-12)+"px";}});
  view.addEventListener("mouseout",e=>{if(e.target.closest(".bar"))tip.style.opacity="0";});
  function chipTrends(){
    view.querySelectorAll("td.trend:not([data-chip])").forEach(td=>{
      td.setAttribute("data-chip","1");
      const txt=td.textContent.trim(); if(!txt||txt==="—")return;
      const cls=td.classList.contains("up")?"up":td.classList.contains("down")?"down":"flat";
      const sp=document.createElement("span"); sp.className="trend-chip "+cls; sp.textContent=txt;
      td.textContent=""; td.appendChild(sp);
    });
  }
  function heroKpi(){
    const first=view.querySelector(".kpis .kpi"); if(first) first.classList.add("hero");
  }
  function countUp(){
    if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
    view.querySelectorAll(".kpi .val").forEach(el=>{
      if(el.dataset.counted)return;
      if(el.classList.contains("val-range")){el.dataset.counted="1";return;}
      const unit=el.querySelector(".unit");
      const unitHtml=unit?unit.outerHTML:"";
      const probe=el.cloneNode(true);
      probe.querySelectorAll(".unit").forEach(u=>u.remove());
      const core=probe.textContent.replace(/\s+/g,"").trim();
      // رقم واحد فقط (مع فاصلة/% اختيارية) — يتجاهل قيم مثل 46% ← 36%
      if(!/^[+-]?\d{1,3}(?:,\d{3})*(?:\.\d+)?%?$/.test(core)) return;
      const raw=core.replace(/[^\d.+-]/g,"");
      const target=parseFloat(raw); if(!isFinite(target))return;
      el.dataset.counted="1";
      const isPct=/%/.test(core), decimals=String(raw).includes(".")?1:0;
      const start=performance.now(), dur=700;
      const tick=now=>{
        const p=Math.min(1,(now-start)/dur), e=1-Math.pow(1-p,3), n=target*e;
        const num=n.toLocaleString("en-US",{maximumFractionDigits:decimals,minimumFractionDigits:decimals});
        el.innerHTML=num+(isPct?"%":"")+(unitHtml?" "+unitHtml:"");
        if(p<1)requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }
  function trendLines(){
    view.querySelectorAll(".chart.chart-monthly").forEach(chart=>{
      const old=chart.querySelector("svg.trendline"); if(old)old.remove();
      const groups=[...chart.children].filter(c=>c.classList&&c.classList.contains("chgroup"));
      if(groups.length!==3)return;
      const bars=groups.map(g=>g.querySelectorAll(".bar"));
      if(bars.some(b=>b.length!==1))return;
      const cr=chart.getBoundingClientRect(); if(!cr.width)return;
      const pts=bars.map(b=>{const r=b[0].getBoundingClientRect();
        return[r.left+r.width/2-cr.left, r.top-cr.top];});
      const NS="http://www.w3.org/2000/svg";
      const svg=document.createElementNS(NS,"svg"); svg.setAttribute("class","trendline");
      svg.setAttribute("width",cr.width); svg.setAttribute("height",cr.height);
      svg.style.cssText="position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible";
      const pl=document.createElementNS(NS,"polyline");
      pl.setAttribute("points",pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" "));
      pl.setAttribute("fill","none"); pl.setAttribute("stroke-width","2");
      pl.setAttribute("stroke-linecap","round"); pl.setAttribute("stroke-linejoin","round");
      svg.appendChild(pl);
      pts.forEach(p=>{const c=document.createElementNS(NS,"circle");
        c.setAttribute("cx",p[0].toFixed(1));c.setAttribute("cy",p[1].toFixed(1));
        c.setAttribute("r","3.2");c.setAttribute("stroke-width","2");svg.appendChild(c);});
      chart.appendChild(svg);
    });
  }
  function enhance(){
    try{chipTrends();heroKpi();countUp();}catch(e){}
    setTimeout(()=>{try{trendLines();}catch(e){}},860);
  }
  try{new MutationObserver(enhance).observe(view,{childList:true});}catch(e){}
  enhance();
})();
</script>
</body>
