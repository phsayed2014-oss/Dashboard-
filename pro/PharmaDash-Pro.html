<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1922">
<title>PharmaDash Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a dark "night pharmacy" hero with the dual conversion ring, then a hub of icon tiles — each opens its own screen. */
:root{
  --bg:#eef3f1; --surface:#ffffff; --surface-2:#f3f7f5; --line:#dce6e2;
  --ink:#0e1d26; --muted:#5a6b73; --faint:#8b9aa1;
  --rx:#3d63dd;   --rx-soft:#e5ecfd;
  --sale:#0c9a72; --sale-soft:#dcf4ec;
  --leak:#e2582b; --leak-soft:#fde9e1;
  --warn:#d48a06; --warn-soft:#fbf0d9;
  --time:#7a4fd6; --time-soft:#efe8fc;
  --nostri:#7a4fd6; --herb:#0c9a72;
  --hero-1:#0b1922; --hero-2:#12313a; --hero-ink:#eaf6f2; --hero-muted:#9fb9b3; --hero-line:rgba(234,246,242,.12);
  --h0:#edf2f0; --h1:#c9ebdf; --h2:#86d3b8; --h3:#2fae86; --h4:#0b7f5c;
  --scrim:rgba(8,18,24,.5);
  --shadow:0 1px 2px rgba(14,29,38,.05),0 10px 30px -12px rgba(14,29,38,.18);
  --f-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Readex Pro',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081218; --surface:#0f1d25; --surface-2:#142630; --line:#1f3540;
  --ink:#e6f1ee; --muted:#9bb0b6; --faint:#6d838b;
  --rx:#7d9bff; --rx-soft:#172748; --sale:#3ad6a4; --sale-soft:#0f3329; --leak:#ff8a5c; --leak-soft:#3a1d14;
  --warn:#f3b23a; --warn-soft:#352812; --time:#b394ff; --time-soft:#2a1f47; --nostri:#b394ff; --herb:#3ad6a4;
  --hero-1:#050d12; --hero-2:#0c252c;
  --h0:#142630; --h1:#123a30; --h2:#16624d; --h3:#1f9670; --h4:#3ad6a4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#081218; --surface:#0f1d25; --surface-2:#142630; --line:#1f3540;
  --ink:#e6f1ee; --muted:#9bb0b6; --faint:#6d838b;
  --rx:#7d9bff; --rx-soft:#172748; --sale:#3ad6a4; --sale-soft:#0f3329; --leak:#ff8a5c; --leak-soft:#3a1d14;
  --warn:#f3b23a; --warn-soft:#352812; --time:#b394ff; --time-soft:#2a1f47; --nostri:#b394ff; --herb:#3ad6a4;
  --hero-1:#050d12; --hero-2:#0c252c;
  --h0:#142630; --h1:#123a30; --h2:#16624d; --h3:#1f9670; --h4:#3ad6a4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--rx);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 64px}
.topline{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--hero-1);color:var(--sale);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.topline b{font-family:var(--f-display);font-weight:600;font-size:15px;margin-inline-end:auto}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.icon-btn svg{width:18px;height:18px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;color:var(--hero-ink);background:radial-gradient(120% 140% at 85% -10%,var(--hero-2) 0%,var(--hero-1) 60%);padding:26px 26px 22px;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(80% 90% at 20% 50%,#000 10%,transparent 75%);-webkit-mask-image:radial-gradient(80% 90% at 20% 50%,#000 10%,transparent 75%)}
.hero-in{position:relative;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.hello{font-size:13px;color:var(--hero-muted)}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.6vw,32px);line-height:1.25;margin:4px 0 14px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--sale)}
.hero .cta{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:14px;background:var(--hero-ink);color:var(--hero-1);font-weight:600;margin-bottom:6px}
.hero .cta svg{width:18px;height:18px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.pill{padding:6px 13px;border-radius:999px;font-size:13px;color:var(--hero-muted);border:1px solid var(--hero-line)}
.pill.on{background:var(--hero-ink);color:var(--hero-1);border-color:transparent;font-weight:600}
select.pill{background:transparent;appearance:none;-webkit-appearance:none;padding-inline-end:13px}
select.pill.on{background:var(--hero-ink)}
select.pill option{color:#0e1d26}
.hstats{display:grid;grid-template-columns:repeat(3,auto);gap:10px 28px;justify-content:start}
.hs .l{font-size:12px;color:var(--hero-muted);display:flex;align-items:center;gap:6px}
.hs .l i{width:8px;height:8px;border-radius:50%}
.hs .v{font-size:28px;font-weight:600;line-height:1.15}
.hs .d{font-size:12px;min-height:18px}
.up{color:var(--sale)}.down{color:var(--leak)}.flat{color:var(--faint)}
.hero .flat{color:var(--hero-muted)}
.ring-wrap{position:relative;width:210px;height:210px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-size:44px;font-weight:600;line-height:1}
.ring-c span{font-size:12.5px;color:var(--hero-muted)}
.hero-note{position:relative;margin-top:14px;font-size:12.5px;color:var(--hero-muted)}

/* filter strip on section screens */
.fstrip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{padding:6px 13px;border-radius:999px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:transparent;font-weight:600}
select.chip{appearance:none;-webkit-appearance:none}
.fstrip .sep{width:1px;height:22px;background:var(--line);margin:0 4px}

/* hub */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 12px}
.sec-h h2{font-family:var(--f-display);font-size:18px;font-weight:600}
.sec-h span{font-size:13px;color:var(--muted)}
.hub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .2s;min-width:0}
.tile:hover{transform:translateY(-3px)}
.tile .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.tile .ic svg{width:26px;height:26px}
.tile .tt{font-family:var(--f-display);font-weight:600;font-size:16.5px}
.tile .td{font-size:13px;color:var(--muted);margin-top:2px}
.tile .tv{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:auto}
.tile .tv>svg,.tile .tv>div{max-width:100%}
.tile .tv b{font-size:30px;font-weight:600;line-height:1}
.tile .tv small{display:block;font-size:12px;color:var(--muted);font-weight:400;font-family:var(--f-body);margin-top:4px}
.tile .go{position:absolute;top:18px;left:18px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.tile .go svg{width:16px;height:16px}
.badge{position:absolute;top:14px;right:58px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--leak);color:var(--surface);font-size:12px;font-weight:700;display:grid;place-items:center}
.k-sale{background:var(--sale-soft);color:var(--sale)}
.k-rx{background:var(--rx-soft);color:var(--rx)}
.k-leak{background:var(--leak-soft);color:var(--leak)}
.k-warn{background:var(--warn-soft);color:var(--warn)}
.k-time{background:var(--time-soft);color:var(--time)}
.k-up{background:var(--surface-2);color:var(--ink)}
.mini-heat{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;width:130px}
.mini-heat i{aspect-ratio:1;border-radius:2px}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%}

/* section screens */
.bar{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.back{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.back svg{width:20px;height:20px}
.bar .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.bar .ic svg{width:24px;height:24px}
.bar h2{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.25;text-wrap:balance}
.bar p{font-size:13px;color:var(--muted)}
.bar>div{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel h3{font-family:var(--f-display);font-weight:600;font-size:15.5px;margin-bottom:12px}
.stack{display:grid;gap:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.muted{color:var(--muted)}.small{font-size:12.5px}

.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .2s;min-width:0}
.pcard:hover{transform:translateY(-3px)}
.pcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pcard .pn{font-family:var(--f-display);font-weight:600;font-size:16px}
.pcard .pf{font-size:12px;color:var(--faint)}
.brand{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:6px;white-space:nowrap}
.b-n{background:var(--time-soft);color:var(--nostri)}.b-h{background:var(--sale-soft);color:var(--herb)}
.pmid{display:flex;align-items:center;gap:14px}
.gauge{position:relative;width:78px;height:78px;flex:none}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:600;color:var(--ink)}
.pnums{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.pnums b{color:var(--ink);font-size:16px;font-family:var(--f-display);font-weight:600}
.pnums i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.trend{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.trend.up{background:var(--sale-soft)}.trend.down{background:var(--leak-soft)}.trend.flat{background:var(--surface-2)}
.spark{width:96px;height:28px}

.dgrid{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.bars{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:minmax(90px,34%) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.brow>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.brow:hover{color:var(--rx)}
.brow .t{height:10px;border-radius:9px;background:var(--surface-2);overflow:hidden;display:flex}
.brow .t i{display:block;height:100%}
.legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}

.heat{overflow-x:auto}
.heat table{border-collapse:separate;border-spacing:3px;font-size:12.5px}
.heat th{font-weight:500;color:var(--muted);padding:4px;writing-mode:vertical-rl;transform:rotate(180deg);height:110px;text-align:start;white-space:nowrap}
.heat th.dn{writing-mode:horizontal-tb;transform:none;height:auto}
.heat td.dn{white-space:nowrap;padding-inline-end:10px;font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.heat td.dn a:hover{color:var(--rx)}
.heat .c{width:34px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600;font-family:var(--f-display)}

.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:600;font-family:var(--f-display);font-size:14px;flex:none}
.lrow .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow>div{min-width:0}
.lrow .s{font-size:12.5px;color:var(--muted)}
.lbar{height:6px;border-radius:9px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.lbar i{display:block;height:100%;border-radius:9px}
.big{font-size:22px;font-weight:600;text-align:center;line-height:1.1}
.big small{display:block;font-size:11px;color:var(--muted);font-weight:400;font-family:var(--f-body)}

.alerts{display:grid;gap:12px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.alert .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.alert .ic svg{width:22px;height:22px}
.alert b{font-family:var(--f-display);font-weight:600;font-size:15.5px}
.alert p{font-size:13.5px;color:var(--muted)}

.tl svg{width:100%;height:auto;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:start;color:var(--muted);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}

.drop{display:grid;place-items:center;text-align:center;gap:10px;padding:40px 20px;border:2px dashed var(--line);border-radius:22px;background:var(--surface);width:100%;transition:border-color .2s,background .2s}
.drop.over{border-color:var(--rx);background:var(--rx-soft)}
.drop .ic{width:70px;height:70px;border-radius:22px;display:grid;place-items:center}
.drop .ic svg{width:32px;height:32px}
.drop b{font-family:var(--f-display);font-size:18px;font-weight:600}
.drop p{color:var(--muted);font-size:13.5px;max-width:440px}
.ftype{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--line)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--leak)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:10px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:4px}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:500}

/* modal / toast / loading */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow:auto}
@media (min-width:640px){.sheet{border-radius:24px}}
.sheet h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin-bottom:4px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.fhead{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fhead b{flex:1;min-width:0;word-break:break-all;font-size:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields.three{grid-template-columns:1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select{padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.loading{position:fixed;inset:0;z-index:55;background:var(--scrim);display:grid;place-items:center;padding:16px}
.loading div{background:var(--surface);padding:18px 24px;border-radius:18px;font-weight:600}
.foot{text-align:center;color:var(--faint);font-size:12.5px;margin-top:28px}

@media (max-width:900px){.hub{grid-template-columns:repeat(2,minmax(0,1fr))}.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){
  .hero{padding:20px 18px;border-radius:24px}
  .hero-in{grid-template-columns:1fr}.ring-wrap{width:170px;height:170px;margin:0 auto;grid-row:1}
  .hstats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.hs .v{font-size:22px}
  .hub{gap:10px}.tile{padding:14px;border-radius:18px}.tile .tv b{font-size:24px}.mini-heat{width:100%}
  .tile .go,.badge{display:none}
  .tile .tv{flex-direction:column;align-items:stretch}.dots i{width:8px;height:8px}
  .pgrid,.two{grid-template-columns:1fr}.dgrid{grid-template-columns:1fr;justify-items:center}.dgrid .bars{width:100%}
  .fields,.fields.three{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.tile,.pcard{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topline"><a class="logo" href="#home" aria-label="الرئيسية">P</a><b>PharmaDash Pro</b>
    <button class="icon-btn" id="themeBtn" aria-label="الوضع الليلي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
  <main id="app"></main>
  <div class="foot">Dr.Elsayed Hassan · تطوير الاعمال - قطاع الصيدليات<br>الإصدار 4.2 · 28 أكتوبر 2026</div>
</div>
<input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.pdf,.json" multiple hidden>
<input type="file" id="restoreInput" accept=".json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

function createAggregateState(){

function aggregateRow(state,r){
    const {docMap,drugMap,secMap,patients,statusCounts,orders}=state;

      if(patientKey)d.patients.add(patientKey);d.status[st]=(d.status[st]||0)+1;
    }
    if(drugKey){
      let dr=drugMap.get(drugKey);if(!dr){dr={name:r.service,total:0,doctors:new Map(),patients:new Map(),sections:new Map(),status:{}};drugMap.set(drugKey,dr);}
      dr.total++;
      if(doctorKey){const item=dr.doctors.get(doctorKey)||{name:r.doctor,count:0};item.count++;dr.doctors.set(doctorKey,item);}
      if(patientKey)dr.patients.set(patientKey,(dr.patients.get(patientKey)||0)+1);
      if(sectionKey){const item=dr.sections.get(sectionKey)||{name:r.section,count:0};item.count++;dr.sections.set(sectionKey,item);}
      dr.status[st]=(dr.status[st]||0)+1;

    if(sectionKey){
      let s=secMap.get(sectionKey);if(!s){s={name:r.section,total:0,doctors:new Set(),drugs:new Set(),patients:new Set()};secMap.set(sectionKey,s);}

function finalizeAggregate(state,totalRows){

    doctors:[...docMap.values()].map(d=>({name:d.name,section:d.section,total:d.total,uniqueDrugs:d.drugs.size,patients:d.patients.size,status:d.status,drugs:[...d.drugs.values()].sort((a,b)=>b.count-a.count)})).sort((a,b)=>b.total-a.total),
    drugs:[...drugMap.values()].map(d=>({name:d.name,total:d.total,doctorCount:d.doctors.size,patients:d.patients.size,status:d.status,repeatPatients:[...d.patients.values()].filter(c=>c>1).length,sections:[...d.sections.values()].sort((a,b)=>b.count-a.count),doctors:[...d.doctors.values()].sort((a,b)=>b.count-a.count)})).sort((a,b)=>b.total-a.total),
    sections:[...secMap.values()].map(s=>({name:s.name,total:s.total,doctors:s.doctors.size,drugs:s.drugs.size,patients:s.patients.size})).sort((a,b)=>b.total-a.total),

function aggregate(rows){

}
function yieldToBrowser(){return new Promise(resolve=>setTimeout(resolve,0));}
function throwIfCancelled(options){

    const error=new Error('تم إلغاء المعالجة لأن ملفاً أحدث بدأ');
    error.name='AbortError';
    throw error;
  }
}
async function aggregateAsync(rows,onProgress,shouldCancel){
  const list=rows||[],state=createAggregateState(),chunk=5000;
  for(let start=0;start<list.length;start+=chunk){
    if(shouldCancel?.())throwIfCancelled({shouldCancel});
    const end=Math.min(start+chunk,list.length);
    for(let i=start;i<end;i++)aggregateRow(state,list[i]);
    if(onProgress)onProgress(end/list.length);
    if(end<list.length)await yieldToBrowser();

function attachParseMeta(rows,meta){Object.defineProperty(rows,'_parseMeta',{value:meta,enumerable:false,configurable:true});return rows;}
async function normalizeParsedRows(rawRows,source,options){
  if((rawRows||[]).length>PharmaCore.MAX_UPLOAD_ROWS)throw new Error('عدد الصفوف أكبر من الحد المدعوم (500,000 صف)');
  const sourceList=rawRows||[],rows=[],chunk=5000;
  for(let start=0;start<sourceList.length;start+=chunk){
    throwIfCancelled(options);
    const end=Math.min(start+chunk,sourceList.length);

    options?.onProgress?.(end/sourceList.length);
    if(end<sourceList.length)await yieldToBrowser();
  }

}
function selectWorkbookData(wb,options){
  for(const sheetName of wb.SheetNames||[]){
    throwIfCancelled(options);
    const sheet=wb.Sheets[sheetName];
    if(!sheet||!sheet['!ref'])continue;
    let range;
    try{range=XLSX.utils.decode_range(sheet['!ref']);}catch(_){continue;}
    if(range.e.r-range.s.r>PharmaCore.MAX_UPLOAD_ROWS+50)throw new Error('عدد صفوف ورقة Excel أكبر من الحد المدعوم (500,000 صف)');
    const previewRange={s:{r:range.s.r,c:range.s.c},e:{r:Math.min(range.e.r,range.s.r+24),c:range.e.c}};
    const preview=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false,blankrows:true,range:previewRange});
    const headerOffset=preview.findIndex(row=>PharmaCore.countRxHeaderMatches(row)>=2);
    if(headerOffset<0)continue;
    const headerRow=range.s.r+headerOffset;
    if(range.e.r-headerRow>PharmaCore.MAX_UPLOAD_ROWS)throw new Error('عدد صفوف ورقة Excel أكبر من الحد المدعوم (500,000 صف)');
    const rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false,range:headerRow});
    if(rows.length)return{rows,sheetName};
  }
  throw new Error('لم أجد ورقة تحتوي أعمدة الطبيب والدواء — راجع أسماء الأعمدة في الملف');
}
async function parseExcel(file,options){
  const buf=await file.arrayBuffer();throwIfCancelled(options);options?.onProgress?.(.08);await yieldToBrowser();
  const wb=XLSX.read(buf,{type:'array'});throwIfCancelled(options);options?.onProgress?.(.28);
  if(!wb.SheetNames.length)throw new Error('ملف Excel لا يحتوي أوراقاً');
  const selected=selectWorkbookData(wb,options);options?.onProgress?.(.4);
  return normalizeParsedRows(selected.rows,'excel',{...options,meta:{sheet:selected.sheetName},onProgress:p=>options?.onProgress?.(.4+p*.6)});
}
function decodeDelimitedText(buffer){
  const bytes=new Uint8Array(buffer);
  let text;
  if(bytes[0]===0xFF&&bytes[1]===0xFE)text=new TextDecoder('utf-16le').decode(bytes.subarray(2));
  else if(bytes[0]===0xFE&&bytes[1]===0xFF)text=new TextDecoder('utf-16be').decode(bytes.subarray(2));
  else{
    const source=bytes[0]===0xEF&&bytes[1]===0xBB&&bytes[2]===0xBF?bytes.subarray(3):bytes;
    try{text=new TextDecoder('utf-8',{fatal:true}).decode(source);}
    catch(_){text=new TextDecoder('windows-1256').decode(source);}
  }
  if(text.includes('\uFFFD'))throw new Error('تعذر تحديد ترميز CSV — احفظه بصيغة UTF-8 ثم أعد الرفع');
  return text;
}
async function parseCSV(file,options){
  const buffer=await file.arrayBuffer();throwIfCancelled(options);
  const text=decodeDelimitedText(buffer);options?.onProgress?.(.1);await yieldToBrowser();
  const wb=XLSX.read(text,{type:'string'});throwIfCancelled(options);options?.onProgress?.(.3);
  if(!wb.SheetNames.length)throw new Error('ملف CSV فارغ');
  const selected=selectWorkbookData(wb,options);options?.onProgress?.(.4);
  return normalizeParsedRows(selected.rows,'csv',{...options,meta:{encoding:'auto'},onProgress:p=>options?.onProgress?.(.4+p*.6)});

function normalizeRow(r){return PharmaCore.normalizeRxRow(r);}

const PUREHERB_KEYMAP = { 'PURE OMEGA':'pure_omega','PUREFEEL':'purefeel','CENTROZON W':'centrozon_w','CENTROZON':'centrozon','ZINCOLIVE':'zincolive','BONEFRIEND':'bonefriend','ARGIGROW':'argigrow' };
const PRODUCTS = [
  ...PRIVATE_LABEL.map(p=>({ key:p.key, name:p.name, form:p.form.replace(' · ',' '), brand:'n' })),
  ...PUREHERB_PRODUCTS.map(p=>{ const name=p.name.replace(/\s+(Syrup|Tablet)?\s*\d.*$/,''); return { key:PUREHERB_KEYMAP[p.key], name, form:p.name.slice(name.length).trim(), brand:'h' }; })
];
const PROD = Object.fromEntries(PRODUCTS.map(p=>[p.key,p]));
const BASE_COUNT = PRODUCTS.length;
/* أصناف إضافية بتتضاف لوحدها لما تظهر في تقرير مبيعات مورد (PureHerb أو NOSTRI) بكود مش معروف */
let EXTRAS = [];
const STOP_WORDS = new Set(['TABLET','TABLETS','TABL','TAB','SYRUP','CREAM','GEL','ORAL','APPLY','BOX','BOTTLE','BOTTEL','TUBE','SACHET','CAPSULE','CAPSULES','EFFERVESCENT','VITAMIN','WITH','PLUS','CONTAINER','SPRAY','DROPS','SUSPENSION','OINTMENT','WASH']);
const nameTokens = n => String(n||'').normalize('NFKC').toUpperCase().split(/[^A-Z0-9]+/).filter(t=>t.length>=3&&!/^\d+$/.test(t));
function applyExtras(list){
  EXTRAS = (list||[]).filter(x=>x&&x.key&&x.code);
  PRODUCTS.length = BASE_COUNT;
  Object.keys(PROD).forEach(k=>{ if(!PRODUCTS.some(p=>p.key===k)) delete PROD[k]; });
  EXTRAS.forEach(x=>{ const toks=nameTokens(x.name); x.head=toks.find(t=>!STOP_WORDS.has(t))||''; x.tokens=toks.filter(t=>t!==x.head);
    PRODUCTS.push(x); PROD[x.key]=x; PRODUCT_CODES[x.code]=x.key; });
  aggCache=new WeakMap();
}
function extraKeyOf(service){
  if(!EXTRAS.length) return null;
  const up=String(service||'').normalize('NFKC').toUpperCase(); let best=null, score=0;
  EXTRAS.forEach(x=>{ if(!x.head||!up.includes(x.head)) return; let sc=1; x.tokens.forEach(t=>{ if(up.includes(t)) sc++; }); if(sc>score){ score=sc; best=x.key; } });
  return best;
}
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

function productKeyOf(service){
  const pl=findPrivateLabelProduct(service); if(pl) return pl.key;
  const ph=findPureHerbProduct(service); if(ph){ const k=PUREHERB_KEYMAP[ph.key]||null; if(!(k==='argigrow'&&/TABL/i.test(service))) return k; }
  return extraKeyOf(service);
}
const keyOf = v => PharmaCore.normalizeEntityKey(v);
const esc = escapeHtml;
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayISO = () => ymd(new Date());
function addDays(iso,n){ const [y,m,d]=iso.split('-').map(Number); return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10); }
function monthEnd(ym){ const [y,m]=ym.split('-').map(Number); return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10); }
function prevMonth(ym){ const [y,m]=ym.split('-').map(Number); return m===1?(y-1)+'-12':y+'-'+String(m-1).padStart(2,'0'); }
const fmtDay = d => { if(!d) return '—'; const [,m,dd]=d.split('-'); return (+dd)+' '+MONTHS[+m-1]; };
const fmtMonth = ym => { const [y,m]=ym.split('-'); return MONTHS[+m-1]+' '+y; };
const pctChange = (cur,prev) => prev>0 ? Math.round((cur-prev)/prev*100) : null;
const tone = c => c==null?'var(--faint)':c>=80?'var(--sale)':c>=40?'var(--warn)':'var(--leak)';
const slug = k => k.replace(/_/g,'-');
function idOf(str){ let h=5381; for(const ch of str) h=((h<<5)+h+ch.codePointAt(0))>>>0; return h.toString(36); }
function initials(name){
  const w=String(name||'').replace(/^(DR\.?|DOCTOR|د\.?|دكتور)\s+/i,'').trim().split(/\s+/).filter(Boolean);
  return ((w[0]||'?')[0]+((w[1]||'')[0]||'')).toUpperCase();
}

/* ───────── التخزين (IndexedDB) ───────── */
const Store=(()=>{
  let dbp=null;
  function open(){
    if(dbp) return dbp;
    dbp=new Promise((res,rej)=>{
      const r=indexedDB.open('pharmadash-pro',1);
      r.onupgradeneeded=()=>{ const db=r.result;
        ['uploads','visits'].forEach(s=>{ if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:'id'}); });
        if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); };
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    });
    return dbp;
  }
  async function tx(store,mode,fn){
    const db=await open();
    return new Promise((res,rej)=>{ const t=db.transaction(store,mode); const out=fn(t.objectStore(store));
      t.oncomplete=()=>res(out&&'result' in out?out.result:out); t.onerror=()=>rej(t.error); });
  }
  return {
    all:s=>tx(s,'readonly',st=>st.getAll()),
    put:(s,v)=>tx(s,'readwrite',st=>{ st.put(v); }),
    del:(s,id)=>tx(s,'readwrite',st=>{ st.delete(id); }),
    clear:s=>tx(s,'readwrite',st=>{ st.clear(); }),
    get:k=>tx('kv','readonly',st=>st.get(k)),
    set:(k,v)=>tx('kv','readwrite',st=>{ st.put(v,k); })
  };
})();

  catch(e){ toast('تعذّر فتح التخزين المحلي — البيانات مش هتتحفظ بعد قفل الصفحة'); }
  // النسخ القديمة كانت بتحفظ يوم واحد (date) — بقت فترة (from/to)
  S.uploads.forEach(u=>{ if(!u.from){ u.from=u.to=u.date||todayISO(); } });

}

/* ───────── الفترات ─────────
   كل ملف (كتابات أو مبيعات) بيغطي فترة من/إلى. أي فترة بتختارها بتاخد من كل ملف
   نصيب الأيام اللي جواها بس (بافتراض إن أيام الملف متساوية). */
const dayDiff=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5);
const lenOf=r=>dayDiff(r.from,r.to)+1;
function overlap(r,W){ if(!W) return 0; const f=r.from>W.from?r.from:W.from, t=r.to<W.to?r.to:W.to; return f>t?0:dayDiff(f,t)+1; }
const frac=(r,W)=>overlap(r,W)/lenOf(r);
function eachDay(from,to,fn){ for(let d=from,g=0;d<=to&&g<800;d=addDays(d,1),g++) fn(d); }
function dataRange(){
  let a='', b='';
  S.uploads.forEach(u=>{ if(!a||u.from<a) a=u.from; if(!b||u.to>b) b=u.to; });
  S.sales.forEach(e=>{ if(!a||e.from<a) a=e.from; if(!b||e.to>b) b=e.to; });
  return { first:a||todayISO(), last:b||todayISO() };
}
function dataMonths(){
  const s=new Set(); const add=r=>{ for(let m=r.from.slice(0,7),g=0;m<=r.to.slice(0,7)&&g<60;g++){ s.add(m); const [y,mm]=m.split('-').map(Number); m=mm===12?(y+1)+'-01':y+'-'+String(mm+1).padStart(2,'0'); } };
  S.uploads.forEach(add); S.sales.forEach(add); return [...s].sort();
}
function windowOf(){
  const {first,last}=dataRange(); const f=S.f;
  if(f.mode==='day'){ const p=addDays(last,-1); return { from:last, to:last, prev:{from:p,to:p}, label:fmtDay(last), cmp:'عن '+fmtDay(p) }; }
  if(f.mode==='week'){
    const from=addDays(last,-6);
    return { from, to:last, prev:{from:addDays(from,-7),to:addDays(from,-1)}, label:'آخر 7 أيام', cmp:'عن الـ 7 أيام اللي قبلها' };
  }
  if(f.mode==='all') return { from:first, to:last, prev:null, label:'كل الفترة', cmp:'' };
  const months=dataMonths();
  const ym=months.includes(f.month)?f.month:(months[months.length-1]||todayISO().slice(0,7));
  const to=last.slice(0,7)===ym?last:monthEnd(ym);
  const days=+to.slice(8,10); const pm=prevMonth(ym);
  const pTo=pm+'-'+String(Math.min(days,+monthEnd(pm).slice(8,10))).padStart(2,'0');
  return { from:ym+'-01', to, prev:{from:pm+'-01',to:pTo}, label:fmtMonth(ym), cmp:'عن نفس الأيام من '+MONTHS[+pm.slice(5,7)-1], ym };
}

/* ───────── بناء الفهرس ───────── */
let aggCache=new WeakMap();
function aggOf(u){
  let a=aggCache.get(u); if(a) return a;
  a={ prod:{}, canc:{}, docs:new Map() };
  for(const r of u.rows){
    const service=r[1], doctor=r[0]; const pk=service?productKeyOf(service):null; const dk=keyOf(doctor); const gk=keyOf(service);
    if(pk){ a.prod[pk]=(a.prod[pk]||0)+1; if(PharmaCore.normalizeStatus(r[4])==='Canceled') a.canc[pk]=(a.canc[pk]||0)+1; }
    if(!dk) continue;
    let d=a.docs.get(dk); if(!d){ d={name:doctor,section:r[2]||'',total:0,mine:0,prods:{},drugs:new Map()}; a.docs.set(dk,d); }
    d.total++; if(r[2]&&!d.section) d.section=r[2];
    if(gk){ const g=d.drugs.get(gk)||{name:service,count:0,pk}; g.count++; d.drugs.set(gk,g); }
    if(pk){ d.mine++; d.prods[pk]=(d.prods[pk]||0)+1; }
  }
  aggCache.set(u,a); return a;
}
const R=v=>Math.round(v);
function rebuild(){
  const W=windowOf(); const B=S.f.branch; const {last}=dataRange();
  const okB=b=>B==='ALL'||b===B; let approx=false;
  const prod={}; PRODUCTS.forEach(p=>prod[p.key]={ key:p.key, brand:p.brand, w:0, wPrev:0, s:0, sPrev:0, amount:0, canceled:0,
      wB:{T1:0,T2:0,T3:0}, sB:{T1:0,T2:0,T3:0}, sPrevB:{T1:0,T2:0,T3:0}, wCovB:{T1:0,T2:0,T3:0}, stock:{}, docs:new Map(), dailyW:new Map(), dailyS:new Map() });
  const doctors=new Map(); const months=new Map();
  const mon=ym=>{ let m=months.get(ym); if(!m){ m={w:0,s:0,pw:{},ps:{}}; months.set(ym,m);} return m; };
  const sparkTo=W.to, sparkFrom=addDays(sparkTo,-29), SP={from:sparkFrom,to:sparkTo};
  const a7={from:addDays(last,-6),to:last}, p7={from:addDays(last,-13),to:addDays(last,-7)};
  const r14={from:addDays(last,-13),to:last}, o28={from:addDays(last,-41),to:addDays(last,-14)};
  const alertW={}, alertS={}; PRODUCTS.forEach(p=>{ alertW[p.key]={c:0,p:0}; alertS[p.key]={c:0,p:0}; });
  const docStop=new Map(); let salesA=false, salesP=false;
  const spread=(map,r,v)=>{ const n=lenOf(r); const f=r.from>SP.from?r.from:SP.from, t=r.to<SP.to?r.to:SP.to; if(f<=t) eachDay(f,t,d=>map.set(d,(map.get(d)||0)+v/n)); };
  const toMonths=(r,fn)=>{ const n=lenOf(r); const byM={}; eachDay(r.from,r.to,d=>{ const m=d.slice(0,7); byM[m]=(byM[m]||0)+1; }); Object.keys(byM).forEach(m=>fn(mon(m),byM[m]/n)); };

  // أيام فيها ملف مبيعات (لكل صيدلية ولكل شركة) داخل الفترة — التحويل بيتحسب عليها بس
  const covDays={};
  S.sales.forEach(e=>{ if(!okB(e.branch)||!PROD[e.product]) return;
    const f=e.from>W.from?e.from:W.from, t=e.to<W.to?e.to:W.to; if(f>t) return;
    const k=e.branch+'|'+PROD[e.product].brand; const set=covDays[k]||(covDays[k]=new Set()); eachDay(f,t,d=>set.add(d)); });
  const covPrev=new Set(); S.sales.forEach(e=>{ if(okB(e.branch)&&PROD[e.product]&&overlap(e,W.prev)) covPrev.add(e.branch+'|'+PROD[e.product].brand); });
  const covFrac=(u,brand)=>{ const set=covDays[u.branch+'|'+brand]; if(!set) return 0; const f=u.from>W.from?u.from:W.from, t=u.to<W.to?u.to:W.to; if(f>t) return 0; let n=0; eachDay(f,t,d=>{ if(set.has(d)) n++; }); return n/lenOf(u); };

  for(const u of S.uploads){
    if(!okB(u.branch)) continue;
    const a=aggOf(u); const fw=frac(u,W), fp=frac(u,W.prev); if(fw>0&&fw<1) approx=true;
    const cf={n:fw?covFrac(u,'n'):0,h:fw?covFrac(u,'h'):0};
    for(const pk in a.prod){ const c=a.prod[pk], P=prod[pk];
      P.w+=c*fw; P.wB[u.branch]+=c*fw; P.wCovB[u.branch]+=c*cf[P.brand]; P.wPrev+=c*fp; P.canceled+=(a.canc[pk]||0)*fw;
      spread(P.dailyW,u,c); toMonths(u,(m,f)=>{ m.w+=c*f; m.pw[pk]=(m.pw[pk]||0)+c*f; });
      alertW[pk].c+=c*frac(u,a7); alertW[pk].p+=c*frac(u,p7); }
    const fr14=frac(u,r14), fo28=frac(u,o28);
    a.docs.forEach((d,dk)=>{
      if(fw>0){
        let doc=doctors.get(dk);
        if(!doc){ doc={ key:dk, id:idOf(dk), name:d.name, section:d.section, total:0, mine:0, prods:new Map(), drugs:new Map(), branches:new Set() }; doctors.set(dk,doc); }
        doc.total+=d.total*fw; doc.mine+=d.mine*fw; doc.branches.add(u.branch); if(!doc.section) doc.section=d.section;
        d.drugs.forEach((g,gk)=>{ const x=doc.drugs.get(gk)||{name:g.name,count:0,pk:g.pk}; x.count+=g.count*fw; doc.drugs.set(gk,x); });
        for(const pk in d.prods){ const c=d.prods[pk]; const pp=doc.prods.get(pk)||{w:0}; pp.w+=c*fw; doc.prods.set(pk,pp);
          const P=prod[pk]; const x=P.docs.get(dk)||{name:d.name,w:0,wB:{T1:0,T2:0,T3:0},wCovB:{T1:0,T2:0,T3:0}};
          x.w+=c*fw; x.wB[u.branch]+=c*fw; x.wCovB[u.branch]+=c*cf[P.brand]; P.docs.set(dk,x); }
      }
      if(fr14||fo28) for(const pk in d.prods){ const k=dk+'|'+pk; const x=docStop.get(k)||{name:d.name,dk,pk,recent:0,old:0}; x.recent+=d.prods[pk]*fr14; x.old+=d.prods[pk]*fo28; docStop.set(k,x); }
    });
  }
  const latestSeg={};
  for(const e of S.sales){
    if(!okB(e.branch)||!PROD[e.product]) continue;
    const P=prod[e.product]; const fw=frac(e,W); if(fw>0&&fw<1) approx=true;
    P.s+=e.units*fw; P.sB[e.branch]+=e.units*fw; P.amount+=(e.amount||0)*fw; const fpv=frac(e,W.prev); P.sPrev+=e.units*fpv; P.sPrevB[e.branch]+=e.units*fpv;
    spread(P.dailyS,e,e.units); toMonths(e,(m,f)=>{ m.s+=e.units*f; m.ps[e.product]=(m.ps[e.product]||0)+e.units*f; });
    const fa=frac(e,a7), fp=frac(e,p7); if(fa) salesA=true; if(fp) salesP=true; alertS[e.product].c+=e.units*fa; alertS[e.product].p+=e.units*fp;
    if(e.stock!=null){ const k=e.product+'|'+e.branch; if(!latestSeg[k]||e.to>latestSeg[k].to) latestSeg[k]=e; }
  }
  Object.values(latestSeg).forEach(e=>{ prod[e.product].stock[e.branch]={qty:e.stock,at:e.to}; });

  // تقريب الأرقام بعد التوزيع على الأيام
  const hasSales=Object.keys(covDays).length>0;
  const cov=[...new Set(Object.keys(covDays).map(k=>k.split('|')[0]))];
  let W_=0,S_=0,WC=0,LOST=0,Wp=0,Sp=0,SC=0,SPC=0;
  PRODUCTS.forEach(p=>{ const P=prod[p.key];
    ['w','wPrev','s','sPrev','amount','canceled'].forEach(k=>P[k]=R(P[k]));
    ['T1','T2','T3'].forEach(b=>{ P.wB[b]=R(P.wB[b]); P.sB[b]=R(P.sB[b]); P.wCovB[b]=R(P.wCovB[b]); });
    P.dailyW.forEach((v,k)=>P.dailyW.set(k,R(v))); P.dailyS.forEach((v,k)=>P.dailyS.set(k,R(v)));
    const covB=b=>!!covDays[b+'|'+p.brand];
    P.covered=['T1','T2','T3'].filter(covB);
    P.wCov=P.covered.reduce((a,b)=>a+P.wCovB[b],0);
    P.lostB={T1:0,T2:0,T3:0}; P.covered.forEach(b=>{ P.lostB[b]=Math.max(0,P.wCovB[b]-P.sB[b]); });
    P.lost=P.covered.reduce((a,b)=>a+P.lostB[b],0);
    P.conv=P.covered.length&&P.wCov>0?Math.round(P.s/P.wCov*100):null;
    // مقارنة المبيعات: بس الصيدليات اللي ليها ملف مبيعات للشركة دي في الفترتين
    const both=P.covered.filter(b=>covPrev.has(b+'|'+p.brand));
    P.sCmp=R(both.reduce((a,b)=>a+P.sB[b],0)); P.sPrevCmp=R(both.reduce((a,b)=>a+P.sPrevB[b],0));
    P.trend=hasSales?(both.length?pctChange(P.sCmp,P.sPrevCmp):null):pctChange(P.w,P.wPrev);
    W_+=P.w; S_+=P.s; WC+=P.wCov; LOST+=P.lost; Wp+=P.wPrev; Sp+=P.sPrev; SC+=P.sCmp; SPC+=P.sPrevCmp;
  });
  doctors.forEach(d=>{ d.total=R(d.total); d.mine=R(d.mine); d.prods.forEach((x,k)=>{ x.w=R(x.w); if(!x.w) d.prods.delete(k); }); d.drugs.forEach((x,k)=>{ x.count=R(x.count); if(!x.count) d.drugs.delete(k); }); });
  months.forEach(m=>{ m.w=R(m.w); m.s=R(m.s); for(const k in m.pw) m.pw[k]=R(m.pw[k]); for(const k in m.ps) m.ps[k]=R(m.ps[k]); });

  // الفاقد لكل طبيب (تقديري): نصيبه من فاقد الصنف في نفس الصيدلية
  const leak=[];
  PRODUCTS.forEach(p=>{ const P=prod[p.key];
    P.docs.forEach((x,dk)=>{ let est=0; P.covered.forEach(b=>{ if(P.wCovB[b]>0) est+=x.wCovB[b]*P.lostB[b]/P.wCovB[b]; });
      x.w=R(x.w); ['T1','T2','T3'].forEach(b=>x.wB[b]=R(x.wB[b])); x.lost=Math.min(x.w,R(est));
      if(!x.w){ P.docs.delete(dk); return; }
      if(x.lost>0) leak.push({dk,id:idOf(dk),name:x.name,pk:p.key,w:x.w,lost:x.lost,branches:Object.keys(x.wB).filter(b=>x.wB[b]>0)}); });
  });
  leak.sort((a,b)=>b.lost-a.lost||b.w-a.w);

  // التنبيهات
  const alerts=[];
  PRODUCTS.forEach(p=>{
    const s={c:R(alertS[p.key].c),p:R(alertS[p.key].p)}, w={c:R(alertW[p.key].c),p:R(alertW[p.key].p)};
    if(salesA&&salesP&&s.p>=5&&s.c<=s.p*.75) alerts.push({sev:2,c:'leak',i:'down',t:p.name+' مبيعاته نزلت '+Math.round((1-s.c/s.p)*100)+'%',p:'آخر 7 أيام '+s.c+' علبة مقابل '+s.p+' في الأسبوع اللي قبله.'+(w.c>=w.p&&w.p>0?' الكتابات ثابتة أو زادت، يعني المشكلة غالبًا في البيع أو التوفر.':''),pk:p.key});
    if(w.p>=5&&w.c<=w.p*.75) alerts.push({sev:2,c:'leak',i:'down',t:p.name+' كتاباته نزلت '+Math.round((1-w.c/w.p)*100)+'%',p:'آخر 7 أيام '+w.c+' كتابة مقابل '+w.p+' في الأسبوع اللي قبله.',pk:p.key});
    const P=prod[p.key]; if(P.conv!=null&&P.wCov>=10&&P.conv<40) alerts.push({sev:1,c:'warn',i:'box',t:p.name+' بيتكتب ومش بيتباع',p:'في '+W.label+' اتكتب '+P.wCov+' مرة واتباع '+P.s+' علبة بس ('+P.conv+'%). راجع التوفر في الصيدلية.',pk:p.key});
  });
  [...docStop.values()].filter(x=>R(x.old)>=3&&x.recent<0.5).sort((a,b)=>b.old-a.old).slice(0,8).forEach(x=>{
    alerts.push({sev:0,c:'rx',i:'user',t:x.name+' بطّل يكتب '+PROD[x.pk].name,p:'كتبه '+R(x.old)+' مرة في الأسابيع اللي فاتت، وما كتبهوش ولا مرة في آخر 14 يوم.',id:idOf(x.dk)});
  });
  alerts.sort((a,b)=>b.sev-a.sev);

  S.ix={ W, prod, doctors, leak, alerts, months, hasSales, cov, last, approx,
    totals:{w:W_,s:S_,wc:WC,lost:LOST,wPrev:Wp,sPrev:Sp,sCmp:SC,sPrevCmp:SPC,conv:hasSales&&WC>0?Math.round(S_/WC*100):null} };
}

/* ───────── رسومات صغيرة ───────── */
function ring(size,stroke,parts){
  const r=(size-stroke)/2, C=2*Math.PI*r; let off=0;
  let h='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="currentColor" stroke-opacity=".14" stroke-width="'+stroke+'"/>';
  parts.forEach(p=>{ const v=Math.max(0,Math.min(1,p.v)); if(!v) return;
    h+='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+p.c+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+(C*v).toFixed(1)+' '+C.toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'"/>'; off+=C*v; });
  return '<svg viewBox="0 0 '+size+' '+size+'" aria-hidden="true">'+h+'</svg>';
}
function spark(vals,c){
  if(vals.length<2||!vals.some(v=>v)) return '<svg class="spark" viewBox="0 0 96 28" aria-hidden="true"></svg>';
  const m=Math.max(...vals,1), n=vals.length-1, pts=vals.map((v,i)=>[i*96/n,26-v/m*22]);
  return '<svg class="spark" viewBox="0 0 96 28" aria-hidden="true"><path d="M0 28 L'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+' L96 28Z" fill="'+c+'" fill-opacity=".14"/><polyline fill="none" stroke="'+c+'" stroke-width="2" points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/><circle cx="'+pts[n][0].toFixed(1)+'" cy="'+pts[n][1].toFixed(1)+'" r="2.6" fill="'+c+'"/></svg>';
}
function series(map,to,days){ const out=[]; for(let i=days-1;i>=0;i--) out.push(map.get(addDays(to,-i))||0); return out; }
function trendTag(t){ if(t==null) return '<span class="trend flat">—</span>';
  return '<span class="trend '+(t>0?'up':t<0?'down':'flat')+'">'+(t>0?'▲ ':t<0?'▼ ':'')+Math.abs(t)+'%</span>'; }
function delta(t){ if(t==null) return '<div class="d flat">—</div>'; return '<div class="d '+(t>0?'up':t<0?'down':'flat')+'">'+(t>0?'▲ ':t<0?'▼ ':'')+Math.abs(t)+'%</div>'; }
function niceMax(v){ const step=Math.pow(10,Math.floor(Math.log10(Math.max(v,1)/4))); const unit=[1,2,2.5,5,10].map(x=>x*step).find(u=>u*4>=v)||step*10; return unit*4; }
const heatLv=v=>v===0?0:v<3?1:v<6?2:v<10?3:4;

function dayChart(days,wMap,sMap,withSales){

  days.forEach((d,i)=>{ const x=x0+i*bw, hw=Wv[i]/mx*130, hs=Sv[i]/mx*130;
    if(hw) g+='<rect x="'+(x+bw*.12).toFixed(1)+'" y="'+(150-hw).toFixed(1)+'" width="'+(bw*(withSales?.36:.76)).toFixed(1)+'" height="'+hw.toFixed(1)+'" rx="2" fill="var(--rx)"/>';
    if(withSales&&hs) g+='<rect x="'+(x+bw*.52).toFixed(1)+'" y="'+(150-hs).toFixed(1)+'" width="'+(bw*.36).toFixed(1)+'" height="'+hs.toFixed(1)+'" rx="2" fill="var(--sale)"/>';
    const lastI=i===days.length-1; if(i%5===4&&i<days.length-3||lastI) g+='<text x="'+(lastI?w:x+bw/2).toFixed(1)+'" y="168" font-size="10.5" fill="var(--muted)" text-anchor="'+(lastI?'end':'middle')+'">'+fmtDay(d)+'</text>'; });
  return '<div class="tl"><svg viewBox="0 0 '+w+' '+hgt+'" role="img" aria-label="الكتابات والمبيعات يوميًا">'+g+'</svg></div><div class="legend"><span><i style="background:var(--rx)"></i>كتابات</span>'+(withSales?'<span><i style="background:var(--sale)"></i>مبيعات</span>':'')+'</div>';

  {key:'reflex',kw:'REFLEX'},{key:'rizer',kw:'RIZER'},{key:'oracure',kw:'ORACURE'},

function salesKw(text){

function toISO(d,m,y){ d=+d; m=+m; if(m>12&&d<=12){ const t=d; d=m; m=t; } if(m<1||m>12||d<1||d>31) return ''; return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function datesIn(s){
  const out=[];
  for(const m of String(s).matchAll(/(\d{1,2})[-/.](\d{1,2})[-/.](20\d{2})/g)){ const iso=toISO(m[1],m[2],m[3]); if(iso) out.push(iso); }
  for(const m of String(s).matchAll(/(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})/g)){ const iso=toISO(m[3],m[2],m[1]); if(iso) out.push(iso); }
  return out;

function guessMeta(text,fileName){
  let branch=null;
  const pm=text.match(/(?:صيدلي[ةه]|pharmacy)\s*(?:رقم|no\.?|#)?\s*(\d+)/i)||String(fileName||'').match(/(?:صيدلي[ةه]|ph|pharmacy)\s*[-_ ]?(\d+)/i);
  if(pm&&PHARMACY_TO_BRANCH[pm[1]]) branch=PHARMACY_TO_BRANCH[pm[1]];
  // تقارير الكتابات بتكتب رقم التعاون في آخر الصفحة: "-Co.3"
  if(!branch){ const cm=text.match(/\bCo\.?\s*([123])\b/)||text.match(/التعاون\s*(الأول|الثاني|الثالث)/); if(cm) branch={'1':'T1','2':'T2','3':'T3','الأول':'T1','الثاني':'T2','الثالث':'T3'}[cm[1]]; }
  // الفترة: "من تاريخ … الى تاريخ …" في الملف، من غير تاريخ الطباعة
  const body=text.split('\n').filter(l=>!/Printing Date|Print Date|تاريخ الطباع[ةه]/i.test(l)).join('\n');
  let ds=[...new Set(datesIn(body))].sort(), sure=ds.length>0, from='', to='';
  if(ds.length){ from=ds[0]; to=ds[ds.length-1]; }
  else {
    const nm=String(fileName||'').replace(/_/g,' '); const fd=[...new Set(datesIn(nm))].sort();
    if(fd.length>=2){ from=fd[0]; to=fd[fd.length-1]; }
    else if(fd.length===1){ to=fd[0]; from=/till|until|حتى|لحد|الى|إلى/i.test(nm)?to.slice(0,8)+'01':to; }
    else { from=to=todayISO(); }
  }
  return { branch:branch||(S.f.branch!=='ALL'?S.f.branch:'T1'), branchSure:!!branch, from, to, dateSure:sure };
}

      const content=await (await doc.getPage(i)).getTextContent(); const byY={};
      content.items.forEach(it=>{ if(!it.str) return; const y=Math.round(it.transform[5]); (byY[y]=byY[y]||[]).push({s:it.str,x:it.transform[4]}); });
      Object.keys(byY).map(Number).sort((a,b)=>b-a).forEach(y=>{ const l=byY[y].sort((a,b)=>a.x-b.x).map(t=>t.s).join(' ').replace(/\s+/g,' ').trim(); if(l) lines.push(l.normalize('NFKC')); });
    }
  } finally { try{ await doc.destroy(); }catch(e){} }
  return lines;
}
const CODE_RE=/\b(\d-\d{2}-\d{3}-\d{3})\b/;
function brandOfText(text,knownKeys){
  if(/بيور هيرب|PURE ?HERB/i.test(text)) return 'h';
  if(/العناي[ةه] الوحيد[ةه]|NOSTRI/i.test(text)) return 'n';
  const c={n:0,h:0}; knownKeys.forEach(k=>{ if(PROD[k]) c[PROD[k].brand]++; }); return c.n||c.h?(c.n>=c.h?'n':'h'):null;
}
function newProduct(code,raw){
  raw=String(raw||'').replace(/\s+/g,' ').trim(); const head=raw.split(',')[0].trim();
  let name=head.split(' ').reduce((acc,w)=>acc.stop?acc:(/\d/.test(w)?{...acc,stop:true}:{...acc,ws:[...acc.ws,w]}),{ws:[],stop:false}).ws.join(' ')||head;
  name=name.replace(/[\s/+-]+$/,'');
  let form=raw.slice(name.length).replace(/^[\s,]+/,'');
  const fm=name.match(/\s(tablets?|syrup|cream|gel|capsules?|sachets?|effervescent)$/i);
  if(fm){ name=name.slice(0,fm.index); form=fm[1]+' '+form; }
  name=name.split(' ').map(w=>/^[A-Z][A-Z-]{3,}$/.test(w)?w.split('-').map(x=>x.charAt(0)+x.slice(1).toLowerCase()).join('-'):w).join(' ');
  form=form.replace(/\s+/g,' ').trim().slice(0,34);
  return { key:'x'+code.replace(/-/g,''), code, name, form, brand:null, auto:true };
}
function addSale(map,key,v){ const r=map.get(key)||{product:key,units:0,amount:0,cost:0,stock:null}; r.units+=v.units||0; r.amount+=v.amount||0; r.cost+=v.cost||0; if(v.stock!=null) r.stock=(r.stock||0)+v.stock; map.set(key,r); }
/* PDF "مبيعات أصناف مورد": الأرقام قبل اسم الصنف بالترتيب: القيمة بسعر البيع · بالتكلفة · الكمية الحالية · الكمية المباعة */
function salesFromLines(lines,fresh){
  const rows=new Map();
  lines.forEach(line=>{
    let key=null, at=-1; const cm=line.match(CODE_RE);
    if(cm){ const pre=line.slice(0,cm.index); at=(pre.match(/^[\s\d.,]*/)||[''])[0].length;
      key=PRODUCT_CODES[cm[1]]||null;
      if(!key&&fresh&&/[A-Za-z]/.test(pre.slice(at))){ const np=newProduct(cm[1],pre.slice(at)); fresh.set(np.key,np); key=np.key; } }
    if(!key){ const k=salesKw(line); if(!k) return; key=k.key; at=k.at; }
    const nums=(line.slice(0,at).match(/\d[\d,]*(?:\.\d+)?/g)||[]).map(toNum).filter(n=>!isNaN(n));
    if(nums.length<2) return;
    addSale(rows,key,{units:Math.round(nums[nums.length-1]),amount:Math.round(nums[0]),cost:nums.length>=3?Math.round(nums[1]):0,stock:nums.length>=4?Math.round(nums[nums.length-2]):null}); });
  return [...rows.values()];
}
function salesFromGrid(grids,fresh){
  const rows=new Map();
  grids.forEach(grid=>{ let cols=null;
    grid.forEach((row,ri)=>{ const cells=row.map(c=>String(c==null?'':c).trim());
      if(!cols){ const c={}; cells.forEach((v,i)=>{ const h=(v+' '+String((grid[ri+1]||[])[i]||'')).replace(/\s+/g,' ').trim(); for(const k in SALES_HEAD) if(c[k]==null&&(SALES_HEAD[k].test(v.replace(/\s+/g,' '))||SALES_HEAD[k].test(h))) c[k]=i; }); if(c.units!=null){ cols=c; return; } }
      let k=null; const ci=cells.findIndex(c=>CODE_RE.test(c));
      if(ci>=0){ const code=cells[ci].match(CODE_RE)[1]; let key=PRODUCT_CODES[code]||null;
        if(!key&&fresh){ const nm=cells.filter((c,i)=>i!==ci&&/[A-Za-z]{3}/.test(c)&&!/شرك[ةه]/.test(c)).sort((a,b)=>b.length-a.length)[0]; if(nm){ const np=newProduct(code,nm); fresh.set(np.key,np); key=np.key; } }
        if(key) k={key}; }
      if(!k) k=salesKw(cells.join(' ')); if(!k) return;
      if(cols){ const u=toNum(row[cols.units]); if(isNaN(u)) return;
        addSale(rows,k.key,{units:Math.round(u),amount:cols.amount!=null?Math.round(toNum(row[cols.amount])||0):0,cost:cols.cost!=null?Math.round(toNum(row[cols.cost])||0):0,stock:cols.stock!=null&&!isNaN(toNum(row[cols.stock]))?Math.round(toNum(row[cols.stock])):null}); }
      else { const nums=row.filter(c=>c!==''&&!salesKw(c)&&!CODE_RE.test(String(c))&&!/[A-Za-z]/.test(String(c))).map(toNum).filter(n=>!isNaN(n)&&n<1e7); if(!nums.length) return;
        addSale(rows,k.key,{units:Math.round(nums.length===1?nums[0]:nums[nums.length-1]),amount:nums.length>1?Math.round(nums[0]):0}); }
    }); });
  return [...rows.values()];
}
/* الأصناف الجديدة بتاخد شركة التقرير؛ لو الشركة مش معروفة ما بتتضافش */
function withBrand(fresh,text,sales){
  if(!fresh.size) return [];
  const brand=brandOfText(text,sales.map(s=>s.product).filter(k=>!fresh.has(k)));
  if(!brand){ for(let i=sales.length-1;i>=0;i--) if(fresh.has(sales[i].product)) sales.splice(i,1); return []; }
  return [...fresh.values()].map(p=>({...p,brand}));
}
async function analyzeFile(f){
  const name=f.name||'ملف'; const ext=(name.toLowerCase().match(/\.[^.]+$/)||[''])[0];
  if(!['.pdf','.xlsx','.xls','.csv'].includes(ext)) throw new Error('صيغة غير مدعومة — استخدم PDF أو Excel');
  if(f.size>PharmaCore.MAX_UPLOAD_BYTES) throw new Error('الملف أكبر من 50MB');
  if(ext==='.pdf'){
    const lines=await pdfLines(f); const text=lines.join('\n');
    const looksSales=/مبيعات|الكمي[ةه] المباع[ةه]|بسعر البيع/.test(text)&&salesFromLines(lines,new Map()).length>0;
    if(!looksSales&&/Service Name|Medication Orders|Doctor Name|اسم الطبيب|اسم الخدم[ةه]/i.test(text)){
      const rows=await parsePDF(f,{}); validateParsedRows(rows);
      return { name, kind:'rx', rows:rows.map(r=>[r.doctor,r.service,r.section,r.patient,r.status]), ...guessMeta(text,name) };
    }
    const fresh=new Map(); const sales=salesFromLines(lines,fresh);
    if(!sales.length) throw new Error('ما لقيتش أعمدة كتابات ولا أي صنف Private Label في الملف');
    return { name, kind:'sales', sales, newProducts:withBrand(fresh,text,sales), ...guessMeta(text,name) };
  }
  const buf=await f.arrayBuffer();
  const wb= ext==='.csv' ? XLSX.read(decodeDelimitedText(buf),{type:'string'}) : XLSX.read(buf,{type:'array'});
  const grids=wb.SheetNames.map(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:true}));
  const text=grids.map(g=>g.slice(0,40).map(r=>r.join(' ')).join('\n')).join('\n');
  let selected=null; try{ selected=selectWorkbookData(wb,{}); }catch(e){}
  if(selected){
    const rows=await normalizeParsedRows(selected.rows,ext==='.csv'?'csv':'excel',{}); validateParsedRows(rows);
    return { name, kind:'rx', rows:rows.map(r=>[r.doctor,r.service,r.section,r.patient,r.status]), ...guessMeta(text,name) };
  }
  const fresh=new Map(); const sales=salesFromGrid(grids,fresh);
  if(!sales.length) throw new Error('ما لقيتش أعمدة كتابات (الطبيب والدواء) ولا أي صنف Private Label في الملف');
  return { name, kind:'sales', sales, newProducts:withBrand(fresh,text,sales), ...guessMeta(text,name) };
}
async function onFiles(list){
  const files=[...list]; if(!files.length) return;
  const json=files.find(f=>/\.json$/i.test(f.name)); if(json){ restoreFrom(json); return; }
  const out=[];
  for(let i=0;i<files.length;i++){
    loading('جارٍ قراءة '+(files.length>1?'('+(i+1)+'/'+files.length+') ':'')+files[i].name+'…');
    try{ out.push(await analyzeFile(files[i])); }catch(err){ out.push({name:files[i].name,kind:'error',error:String(err&&err.message||err)}); }
  }
  loading(); review(out);
}
const rangeLabel=(a,b)=>a===b?fmtDay(a)+' '+a.slice(0,4):'من '+fmtDay(a)+' لـ '+fmtDay(b)+' '+b.slice(0,4);
function review(items){

  items.forEach(x=>x.include=x.kind==='rx'||x.kind==='sales');
  const sel=(i,b)=>'<select id="rv-b'+i+'" data-i="'+i+'" data-f="branch">'+Object.entries(BRANCHES).map(([k,l])=>'<option value="'+k+'"'+(b===k?' selected':'')+'>'+l+'</option>').join('')+'</select>';

    +items.map((x,i)=>{
      const badge=x.kind==='rx'?'<span class="ftype k-rx">كتابات</span>':x.kind==='sales'?'<span class="ftype k-sale">مبيعات</span>':'<span class="ftype k-leak">مش مفهوم</span>';
      let body='';
      if(x.kind==='error') body='<p class="small" style="color:var(--leak)">'+esc(x.error)+'</p>';
      else {
        const warn=t=>'<span style="color:var(--warn)"> — '+t+'</span>';
        body='<div class="fields three"><div class="field"><label for="rv-b'+i+'">الصيدلية'+(x.branchSure?'':warn('اتأكد'))+'</label>'+sel(i,x.branch)+'</div>'
          +'<div class="field"><label for="rv-f'+i+'">من'+(x.dateSure?'':warn('اتأكد'))+'</label><input type="date" id="rv-f'+i+'" data-i="'+i+'" data-f="from" value="'+escapeAttr(x.from)+'"></div>'
          +'<div class="field"><label for="rv-t'+i+'">إلى</label><input type="date" id="rv-t'+i+'" data-i="'+i+'" data-f="to" value="'+escapeAttr(x.to)+'"></div></div>';
        if(x.kind==='rx'){ const mine=x.rows.filter(r=>productKeyOf(r[1])).length; body+='<p class="small muted" style="margin-top:10px">'+fmt(x.rows.length)+' كتابة، منها <b style="color:var(--ink)">'+fmt(mine)+'</b> Private Label</p>'; }
        else { const np=Object.fromEntries((x.newProducts||[]).map(p=>[p.key,p])); const info=k=>PROD[k]||np[k];
          body+='<div class="dchips" style="margin-top:10px">'+x.sales.map(s=>'<span class="dchip '+(info(s.product).brand==='n'?'b-n':'b-h')+'">'+esc(info(s.product).name)+' · '+fmt(s.units)+' علبة'+(np[s.product]?' · <b>صنف جديد</b>':'')+'</span>').join('')+'</div>';
          if(x.newProducts&&x.newProducts.length) body+='<p class="small muted" style="margin-top:8px">الأصناف الجديدة هتتضاف لـ Private Label وهتتحسب في الكتابات كمان.</p>'; }
      }
      return '<div class="fcard"><div class="fhead">'+badge+'<b>'+esc(x.name)+'</b>'+(x.kind!=='error'?'<label class="small muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="rv-c'+i+'" checked data-i="'+i+'" data-f="include"> حفظ</label>':'')+'</div>'+body+'</div>';
    }).join('')
    +'<div class="sheet-actions"><button class="btn" data-x>إلغاء</button>'+(ok?'<button class="btn pri" data-ok>حفظ</button>':'')+'</div></div>';
  document.body.appendChild(m);
  m.addEventListener('change',e=>{ const t=e.target, x=items[+t.dataset.i]; if(!x) return; if(t.dataset.f==='include') x.include=t.checked; else x[t.dataset.f]=t.value; });
  m.addEventListener('click',async e=>{
    if(e.target===m||e.target.closest('[data-x]')){ m.remove(); return; }
    if(!e.target.closest('[data-ok]')) return;
    const bad=items.find(x=>x.include&&(!/^\d{4}-\d{2}-\d{2}$/.test(x.from||'')||!/^\d{4}-\d{2}-\d{2}$/.test(x.to||'')||x.from>x.to));
    if(bad){ toast('راجع الفترة في '+bad.name+': «من» لازم تكون قبل «إلى»'); return; }
    const ovl=(a,b)=>a.from<=b.to&&b.from<=a.to;
    const rxGroups=new Map(); let nRx=0,nS=0; let sales=S.sales.slice(); const newExtras=[];
    items.forEach(x=>{ if(!x.include) return;
      if(x.kind==='rx'){ const k=x.branch+'|'+x.from+'|'+x.to; const g=rxGroups.get(k)||{branch:x.branch,from:x.from,to:x.to,rows:[],names:[]}; g.rows.push(...x.rows); g.names.push(x.name); rxGroups.set(k,g); }
      if(x.kind==='sales'){
        (x.newProducts||[]).forEach(p=>{ if(!newExtras.some(e=>e.key===p.key)&&!EXTRAS.some(e=>e.key===p.key)) newExtras.push(p); });
        sales=sales.filter(o=>!(o.branch===x.branch&&x.sales.some(s=>s.product===o.product)&&ovl(o,x)));
        x.sales.forEach(s=>sales.push({branch:x.branch,product:s.product,from:x.from,to:x.to,units:s.units,amount:s.amount,cost:s.cost,stock:s.stock,file:x.name}));
        nS++; } });
    try{
      for(const g of rxGroups.values()){
        const old=S.uploads.filter(u=>u.branch===g.branch&&ovl(u,g));
        for(const o of old) await Store.del('uploads',o.id);
        S.uploads=S.uploads.filter(u=>!old.includes(u));
        const u={ id:'u'+Date.now()+Math.random().toString(36).slice(2,6), name:g.names.join(' + '), branch:g.branch, from:g.from, to:g.to, rows:g.rows, mine:g.rows.filter(r=>productKeyOf(r[1])).length, added:new Date().toISOString() };
        S.uploads.push(u); await Store.put('uploads',u); nRx++;
      }
      if(newExtras.length){ const all=EXTRAS.map(({head,tokens,...x})=>x).concat(newExtras.map(({head,tokens,...x})=>x)); applyExtras(all); await Store.set('products',all.map(({head,tokens,...x})=>x)); }
      if(nS){ S.sales=sales; await Store.set('sales',S.sales); }
    }catch(err){ toast('اتقرا بس ما اتحفظش على الجهاز: '+(err&&err.message||err)); }
    // اعرض الفترة اللي اترفعت

    if(lastTo&&S.f.mode!=='all'){ S.f.mode='month'; S.f.month=lastTo.slice(0,7); saveFilter(); }
    m.remove(); rebuild(); route();
    toast('اتحفظ ✓'+(nRx?' '+nRx+' ملف كتابات':'')+(nRx&&nS?' و':'')+(nS?' '+nS+' ملف مبيعات':''));
  });
}
function restoreFrom(file){
  const rd=new FileReader();
  rd.onload=()=>{
    let json; try{ json=JSON.parse(rd.result); }catch(e){ toast('ملف JSON غير صالح'); return; }
    if(!json||json.app!=='pharmadash-pro'){ toast('ده مش نسخة احتياطية من PharmaDash Pro'); return; }
    confirmBox('استرجاع النسخة هيستبدل كل البيانات الحالية بـ '+(json.uploads||[]).length+' ملف كتابات و'+(json.sales||[]).length+' سطر مبيعات.','استرجاع',async()=>{
      await Store.clear('uploads'); for(const u of json.uploads||[]) await Store.put('uploads',u);
      await Store.set('sales',json.sales||[]); await Store.set('products',json.products||[]); await loadAll(); route(); toast('اتسترجعت النسخة ✓'); });
  };
  rd.readAsText(file);
}
function confirmBox(msg,okLabel,fn){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML='<div class="sheet" role="dialog" aria-modal="true" style="max-width:420px"><h3>متأكد؟</h3><p class="muted" style="margin-top:6px">'+esc(msg)+'</p><div class="sheet-actions"><button class="btn" data-x>إلغاء</button><button class="btn pri" data-ok>'+esc(okLabel)+'</button></div></div>';
  document.body.appendChild(m);
  m.addEventListener('click',e=>{ if(e.target===m||e.target.closest('[data-x]')) m.remove(); else if(e.target.closest('[data-ok]')){ m.remove(); fn(); } });
}
