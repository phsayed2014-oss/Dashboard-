<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5fd7">
<title>PharmaDash Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../app/icons/icon-192.png">
<link rel="apple-touch-icon" href="../app/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f0f3f9; --line:#e3e8f1;
  --text:#14213d; --muted:#64708a; --faint:#94a0b8;
  --brand:#0f5fd7; --brand-soft:#e6efff; --brand-ink:#0b4bb0;
  --mine:#0e9f6e; --mine-soft:#e3f6ee;
  --warn:#d97706; --warn-soft:#fdf2e1;
  --bad:#dc2626; --bad-soft:#fde8e8;
  --nostri:#7c3aed; --nostri-soft:#efe8fd;
  --herb:#0e9f6e; --herb-soft:#e3f6ee;
  --shadow:0 1px 2px rgba(20,33,61,.05),0 4px 16px rgba(20,33,61,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1220; --surface:#141c2e; --surface-2:#1b2439; --line:#26314a;
  --text:#e7ecf6; --muted:#9aa6c0; --faint:#6b7894;
  --brand:#5b9bff; --brand-soft:#16284a; --brand-ink:#8ab8ff;
  --mine:#34d399; --mine-soft:#10302a; --warn:#f5a524; --warn-soft:#33270f;
  --bad:#f87171; --bad-soft:#3a1a1d; --nostri:#a78bfa; --nostri-soft:#251c42;
  --herb:#34d399; --herb-soft:#10302a; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0c1220; --surface:#141c2e; --surface-2:#1b2439; --line:#26314a;
  --text:#e7ecf6; --muted:#9aa6c0; --faint:#6b7894;
  --brand:#5b9bff; --brand-soft:#16284a; --brand-ink:#8ab8ff;
  --mine:#34d399; --mine-soft:#10302a; --warn:#f5a524; --warn-soft:#33270f;
  --bad:#f87171; --bad-soft:#3a1a1d; --nostri:#a78bfa; --nostri-soft:#251c42;
  --herb:#34d399; --herb-soft:#10302a; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ── layout ── */
.shell{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--surface);border-inline-start:1px solid var(--line);position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#22b8cf);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.brand b{display:block;font-size:16px}
.brand small{color:var(--muted);font-size:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:500}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.side-foot{margin-top:auto;font-size:12px;color:var(--faint);padding:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:700;margin-inline-end:auto;display:flex;align-items:center;gap:8px;min-width:0}
.back{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.back svg{width:18px;height:18px}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button.on{background:var(--brand);color:#fff}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:13px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.icon-btn svg{width:18px;height:18px}
.view{padding:22px 24px 110px;max-width:1180px;width:100%;margin:0 auto}
.tabbar{display:none}

@media (max-width:860px){
  .side{display:none}
  .top{padding:10px 16px}
  .top h1{font-size:17px}
  .view{padding:16px 16px 110px}
  .tabbar{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--faint);border-radius:12px}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a.on{color:var(--brand)}
  .top h1{flex:1}
  #themeBtn{order:1}
  .filters{order:2;width:100%;overflow-x:auto;flex-wrap:nowrap}
  .filters .sel{flex:1;min-width:120px}
}

/* ── components ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3>svg{width:18px;height:18px;flex:none;color:var(--brand)}
.avatar svg{width:26px;height:26px}
.card h3 .sub{font-weight:400;color:var(--muted);font-size:13px;margin-inline-start:auto}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.kpi{padding:14px 16px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px}
.kpi .h{font-size:12px;color:var(--faint)}
.hero{display:flex;gap:16px;align-items:center}
.avatar{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none;background:var(--brand-soft);color:var(--brand-ink)}
.hero h2{font-size:21px;line-height:1.3}
.hero .meta{color:var(--muted);font-size:13.5px;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:12.5px;font-weight:500;white-space:nowrap}
.chip.mine{background:var(--mine-soft);color:var(--mine)}
.chip.nostri{background:var(--nostri-soft);color:var(--nostri)}
.chip.herb{background:var(--herb-soft);color:var(--herb)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.brand{background:var(--brand-soft);color:var(--brand-ink)}
button.chip{cursor:pointer;border:1px solid transparent}
button.chip.pick{border-color:var(--line);background:var(--surface)}
button.chip.pick.on{background:var(--mine-soft);color:var(--mine);border-color:var(--mine)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--line)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.good{background:var(--mine);border-color:var(--mine);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px}

/* product tiles */
.ptile{display:flex;flex-direction:column;gap:8px;padding:16px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.ptile:hover{transform:translateY(-2px)}
.ptile .pn{font-weight:700;font-size:16px}
.ptile .pf{font-size:12px;color:var(--muted)}
.ptile .pv{display:flex;align-items:baseline;gap:6px}
.ptile .pv b{font-size:26px}
.ptile .pv span{color:var(--muted);font-size:12.5px}
.ptile .stripe{position:absolute;inset-block-start:0;inset-inline:0;height:4px}
.ptile.zero{opacity:.62}

/* list rows */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
a.row:hover,button.row:hover{background:var(--surface-2);border-radius:10px}
button.row{width:100%;text-align:start}
.row .rk{width:26px;color:var(--faint);font-size:12.5px;text-align:center;flex:none}
.row .rm{flex:1;min-width:0}
.row .rt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rs{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rv{font-weight:700;text-align:end;flex:none}
.row .rv small{display:block;font-weight:400;color:var(--faint);font-size:11.5px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.bar.mine i{background:var(--mine)}
.mini-av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--surface-2);color:var(--muted)}
.mini-av.on{background:var(--mine-soft);color:var(--mine)}

/* bars chart */
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.hb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.hb .t{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--brand);border-radius:99px}
.hb.mine .t i{background:var(--mine)}
.hb .c{font-weight:600;min-width:34px;text-align:end}
.cols{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.cols .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.cols .col i{display:block;width:100%;max-width:44px;background:var(--brand);border-radius:8px 8px 3px 3px;min-height:3px}
.cols .col b{font-size:12px}
.cols .col span{font-size:11px;color:var(--faint);white-space:nowrap}

/* search */
.search{position:relative}
.search input{width:100%;padding:12px 44px 12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.search input:focus{outline:2px solid var(--brand);outline-offset:-1px}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}

/* tips */
.tip{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--surface-2)}
.tip .ti{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.tip .ti svg{width:18px;height:18px}
.tip b{display:block;font-size:14px}
.tip p{font-size:13px;color:var(--muted)}

/* empty */
.empty{text-align:center;padding:48px 20px}
.empty .ei{width:72px;height:72px;border-radius:22px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 16px}
.empty .ei svg{width:34px;height:34px}
.empty h2{font-size:20px;margin-bottom:6px}
.empty p{color:var(--muted);max-width:440px;margin:0 auto 18px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.section-title{font-size:13px;font-weight:600;color:var(--muted);margin:6px 2px -4px}

/* visits */
.visit{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.visit:last-child{border-bottom:0}
.visit .vd{width:52px;flex:none;text-align:center;background:var(--brand-soft);color:var(--brand-ink);border-radius:12px;padding:6px 0;line-height:1.2}
.visit .vd b{display:block;font-size:18px}
.visit .vd span{font-size:11px}
.visit .vb{flex:1;min-width:0}
.visit .vn{font-size:13.5px;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.effect{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,16,30,.45)}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:640px){.sheet{border-radius:20px}}
.sheet h3{font-size:18px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.field textarea{min-height:80px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;z-index:60;box-shadow:var(--shadow)}
.loading{position:fixed;inset:0;z-index:55;background:rgba(10,16,30,.4);display:grid;place-items:center}
.loading div{background:var(--surface);padding:18px 24px;border-radius:16px;font-weight:600}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-weight:600;color:var(--muted);text-align:start;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line)}
.wrap-x{overflow-x:auto}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="logo">P</div><div><b>PharmaDash Pro</b><small>متابعة الأصناف والأطباء</small></div></div>
    <nav class="nav" id="sideNav"></nav>
    <div class="side-foot">البيانات محفوظة على جهازك فقط</div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="title"></h1>
      <div class="filters" id="filters"></div>
      <button class="icon-btn" id="themeBtn" aria-label="الوضع الليلي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<nav class="tabbar" id="tabBar"></nav>
<input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.pdf" multiple hidden>
<input type="file" id="jsonInput" accept=".json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
